                        if (el.classList.contains('truncate')) { el.style.paddingTop = '0.4em'; el.style.paddingBottom = '0.4em'; el.style.marginTop = '-0.4em'; el.style.marginBottom = '-0.4em'; }
                    });
                    if (document.fonts?.ready) await document.fonts.ready;
                    const w = 1000, h = Math.ceil(inner.scrollHeight);
                    const canvas = await html2canvas(inner, { scale: 2, useCORS: true, backgroundColor: '#f9fafb', logging: false, width: w, height: h, windowWidth: viewportWidth, windowHeight: window.innerHeight, scrollX: 0, scrollY: 0 });
                    return { canvas, w, h };
                } finally {
                    root.unmount();
                    document.body.removeChild(host);
                }
            };
            const exportChartPDF = async () => {
                const source = document.getElementById('org-chart-full-view');
                if (!source) return;
                setIsExportingChartPdf(true);
                const host = document.createElement('div');
                host.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;z-index:-1;';
                const inner = document.createElement('div');
                inner.style.cssText = 'position:absolute;left:0;top:0;width:max-content;background:#fff;';
                host.appendChild(inner);
                const clone = source.cloneNode(true);
                clone.removeAttribute('id');
                // Interactive controls have no place on paper.
                clone.querySelectorAll('button, .grid-control-pill, .reorder-controls, .add-btn').forEach(el => el.remove());
                // Leader groups scroll inside a capped width on screen; open them up so every card is printed.
                clone.querySelectorAll('*').forEach(el => {
                    if (el.classList.contains('overflow-x-auto')) { el.style.overflow = 'visible'; el.style.maxWidth = 'none'; }
                    el.classList.remove('flash-active', 'drop-target-hover', 'animate-pulse');
                    el.style.animation = 'none';
                    // html2canvas draws Sarabun lower than the browser does, so `truncate` (overflow:hidden) lines get their bottoms cut off.
                    // Grow the clip box vertically with padding and cancel it with margin so the layout does not move.
                    if (el.classList.contains('truncate')) { el.style.paddingTop = '0.4em'; el.style.paddingBottom = '0.4em'; el.style.marginTop = '-0.4em'; el.style.marginBottom = '-0.4em'; }
                    // html2canvas paints box-shadows by drawing the casting shape off-canvas; on wide charts that leaves solid ghost cards behind.
                    el.style.boxShadow = 'none';
                });
                clone.style.cssText += ';box-shadow:none;border:none;border-radius:0;margin:0;';
                inner.appendChild(clone);
                document.body.appendChild(host);
                try {
                    // html2pdf would re-flow the chart to the page width, which squeezes and clips wide charts, so render the bitmap and build the page ourselves.
                    const [html2canvas, { jsPDF }] = await Promise.all([
                        loadAttendanceLibrary('html2canvas', 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
                        loadAttendanceLibrary('jspdf', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
                    ]);
                    if (document.fonts?.ready) await document.fonts.ready;
                    await Promise.all([...clone.querySelectorAll('img')].map(img => img.complete ? null : new Promise(res => { img.onload = img.onerror = res; setTimeout(res, 4000); })));
                    // html2canvas ignores `object-fit: cover` and squashes non-square photos into the avatar circle, so crop each photo to a square ourselves.
                    // The photo is re-requested with CORS (same requirement html2canvas has); if that fails the original is left untouched.
                    const squareCache = new Map();
                    const toSquareDataUrl = (src) => {
                        if (!squareCache.has(src)) squareCache.set(src, new Promise((resolve, reject) => {
                            const probe = new Image();
                            probe.crossOrigin = 'anonymous';
                            probe.referrerPolicy = 'no-referrer';
                            probe.onload = () => {
                                try {
                                    const side = Math.min(probe.naturalWidth, probe.naturalHeight, 192);
                                    const c = document.createElement('canvas');
                                    c.width = c.height = side;
                                    const crop = Math.min(probe.naturalWidth, probe.naturalHeight);
                                    c.getContext('2d').drawImage(probe, (probe.naturalWidth - crop) / 2, (probe.naturalHeight - crop) / 2, crop, crop, 0, 0, side, side);
                                    resolve(c.toDataURL('image/jpeg', 0.92));
                                } catch (error) { reject(error); }
                            };
                            probe.onerror = reject;
                            probe.src = src;
                        }));
                        return squareCache.get(src);
                    };
                    await Promise.all([...clone.querySelectorAll('img')].map(async img => {
                        if (!img.naturalWidth || getComputedStyle(img).objectFit !== 'cover') return;
                        try {
                            img.src = await toSquareDataUrl(img.currentSrc || img.src);
                            img.style.objectFit = 'fill';
                            await img.decode().catch(() => {});
                        } catch (error) { /* keep the original photo */ }
                    }));
                    // Measure every descendant too: anything that still overflows the wrapper must be inside the capture box.
                    const viewportWidth = getViewportWidth();
                    const box = clone.getBoundingClientRect();
                    let w = Math.ceil(box.width), h = Math.ceil(box.height);
                    clone.querySelectorAll('*').forEach(el => { const r = el.getBoundingClientRect(); w = Math.max(w, Math.ceil(r.right - box.left)); h = Math.max(h, Math.ceil(r.bottom - box.top)); });
                    clone.style.width = `${w}px`; clone.style.height = `${h}px`;
                    // Browsers cap canvas size (about 16k px a side, ~150M px in total); stay under it and trade sharpness only for very large charts.
                    const scale = Math.max(0.3, Math.min(2, 16000 / w, 16000 / h, Math.sqrt(150e6 / (w * h))));
                    const canvas = await html2canvas(clone, { scale, useCORS: true, backgroundColor: '#ffffff', logging: false, width: w, height: h, windowWidth: viewportWidth, windowHeight: window.innerHeight, scrollX: 0, scrollY: 0 });
                    // One page whose proportions match the chart, so no branch is ever split across pages. Small charts print at A3-ish size, big ones grow (PDF viewers zoom) up to the 5000mm page limit.
                    const margin = 8, mmPerPx = Math.min(5000 / Math.max(w, h), Math.max(400 / Math.max(w, h), 0.1));
                    const innerW = w * mmPerPx, innerH = h * mmPerPx;
                    const chartPage = [innerW + margin * 2, innerH + margin * 2];
                    const orient = (page) => page[0] >= page[1] ? 'landscape' : 'portrait';
                    // Page 1: the Dashboard summary for the department being exported. A failure here must not lose the chart.
                    let summary = null;
                    try { summary = await renderSummaryCanvas(html2canvas, currentDept === 'ALL' ? 'Overview' : currentDept); } catch (summaryError) { console.warn('Summary page skipped', summaryError); }
                    let pdf;
                    if (summary) {
                        const sumInnerW = 190, sumInnerH = summary.h * (sumInnerW / summary.w);
                        const sumPage = [sumInnerW + 20, sumInnerH + 20];
                        pdf = new jsPDF({ unit: 'mm', format: sumPage, orientation: orient(sumPage), compress: true });
                        pdf.addImage(summary.canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 10, 10, sumInnerW, sumInnerH);
                        pdf.addPage(chartPage, orient(chartPage));
                    } else {
                        pdf = new jsPDF({ unit: 'mm', format: chartPage, orientation: orient(chartPage), compress: true });
                    }
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, innerW, innerH);
                    pdf.save(`orgchart_${currentDept}_${new Date().toISOString().slice(0,10)}.pdf`);
                } catch (err) {
                    console.error(err);
                    alert('สร้าง PDF ไม่สำเร็จ: ' + (err?.message || err));
                } finally {
                    document.body.removeChild(host);
                    setIsExportingChartPdf(false);
                }
            };

            // [Fix] SummaryDashboard Logic with Dept Updates Fix
            const deptUpdates = useMemo(() => {
                const updates = {};
                departments.forEach(d => updates[d] = null);
                (employees || []).forEach(e => {
                    if (e.dept && e.lastModified && updates.hasOwnProperty(e.dept)) {
                        const t = new Date(e.lastModified).getTime();
                        if (!updates[e.dept] || t > updates[e.dept]) {
                            updates[e.dept] = t;
                        }
                    }
                });
                return updates;
            }, [employees, departments]);

            // [Fix] Summary Stats Logic
            const summaryStats = useMemo(() => {
                try {
                    const safeEmps = Array.isArray(employees) ? employees : [];
                    return {}; 
                } catch(e) { return {}; }
            }, [employees]);


            // *** FIXED ZONE: ALL HOOKS ARE ABOVE THIS LINE ***

            const allEmployeesWithIds = employees.filter(e => e.id);
            const resignedEmployees = allEmployeesWithIds.filter(isResignedEmployee);
            const validEmployees = allEmployeesWithIds.filter(e => !isResignedEmployee(e));

            const filteredAll = validEmployees.filter(e => e.reportsTo !== 'STAGING' && (currentDept === 'ALL' || e.dept === currentDept));

                if (sortConfig.key) {

                        if (aVal < bVal) return sortConfig.direction === 'ascending' ? -1 : 1;

rt/> แดชบอร์ดสรุป</button> {viewMode === 'chart' && <button onClick={()=>{setIsMobileMenuOpen(false); exportChartPDF();}} disabled={isExportingChartPdf} className="flex items-center gap-3 p-2 hover:bg-gray-100 rounded disabled:opacity-50"><Icons.FileText/> บันทึกผังเป็น PDF</button>} {currentUser.role === 'admin' && <button onClick={()=>{setIsAdminPanelOpen(true); setIsMobileMenuOpen(false);}} className="flex items-center gap-3 p-2 hover:bg-gray-100 rounded"><Icons.Settings/> Admin Panel</button>} <button onClick={()=>{setShowRulers(!showRulers); setIsMobileMenuOpen(false);}} className="flex items-center gap-3 p-2 hover:bg-gray-100 rounded"><Icons.RulerIcon/> {showRulers?'ซ่อนไม้บรรทัด':'แสดงไม้บรรทัด'}</button> <button onClick={()=>{localStorage.removeItem('currentUser'); setCurrentUser(null);}} className="flex items-center gap-3 p-2 text-red-600 hover:bg-red-50 mt-auto border-t"><Icons.LogOut/> ออกจากระบบ</button> </div> </div> </div> )}

                                    {annotations.map(ann => <DraggableAnnotation key={ann.id} ann={ann} onUpdate={(id, up) => setAnnotations(prev=>prev.map(a=>a.id===id?{...a,...up}:a))} onDelete={(id)=>setAnnotations(prev=>prev.filter(a=>a.id!==id))} isLocked={isLocked} onLinkStart={setLinkStartId} />)}
                                    <div id="org-chart-full-view" className="bg-white p-8 rounded-2xl border shadow-xl inline-block min-w-[800px] org-chart-container relative">
                                        <div className="mb-8 border-b-2 pb-2"><h1 className="text-3xl font-bold text-gray-800 uppercase">{deptName}</h1></div>
                                        <div className="flex gap-16 justify-center">
                                            {rootEmployees.map(root => <EmployeeNode key={root.id} employee={root} allEmployees={filteredAll} onEdit={(e)=>{setEditingEmployee({...e, isNew:false}); setIsModalOpen(true);}} onDrop={handleDropNode} isLocked={isLocked} themeConf={THEMES[appTheme]} shapeClass={appShape} selectionMode={selectionMode} selectedIds={selectedIds} toggleSelection={(id)=>setSelectedIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev, id])} onAddChild={(p)=>{setEditingEmployee({isNew:true, reportsTo:p.id, dept:p.dept}); setIsModalOpen(true);}} layoutThreshold={layoutThreshold} searchTerm={searchTerm} onReorder={handleReorder} onGridColChange={handleGridColChange} currentUser={currentUser} isAllDepts={currentDept === 'ALL'}/>)}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex flex-col h-full bg-white rounded-xl shadow-sm border overflow-hidden">
                                    <div className="flex flex-col gap-3 border-b bg-gray-50 p-4 sm:flex-row sm:items-center sm:justify-between">
                                        <div className="flex flex-wrap items-center gap-2">
                                            <button type="button" onClick={()=>setShowEmployeeHistory(false)} className={`rounded-lg px-3 py-2 text-sm font-bold ${!showEmployeeHistory ? 'bg-blue-700 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}`}>พนักงานปัจจุบัน ({scopedActiveCount})</button>
                                            <button type="button" onClick={()=>setShowEmployeeHistory(true)} className={`rounded-lg px-3 py-2 text-sm font-bold ${showEmployeeHistory ? 'bg-slate-700 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}`}>ประวัติลาออก ({scopedHistoryCount})</button>
                                            <span className="text-xs text-gray-500">แสดง {processedEmployees.length} รายการ</span>
                                        </div>
                                        <div className="flex flex-col gap-2 sm:flex-row sm:items-center">
                                            <label className="flex min-h-10 min-w-0 items-center gap-2 rounded-lg border border-gray-300 bg-white px-3 text-gray-400 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100 sm:w-80">
                                                <Icons.Search size={16}/>
                                                <input value={searchTerm} onChange={event=>setSearchTerm(event.target.value)} placeholder="ค้นหาชื่อ รหัส แผนก ตำแหน่ง..." aria-label="ค้นหาในตารางรายชื่อ" className="min-w-0 flex-1 bg-transparent text-sm text-gray-700 outline-none placeholder:text-gray-400"/>
                                                {searchTerm && <button type="button" onClick={()=>setSearchTerm('')} aria-label="ล้างคำค้นหา" className="text-gray-400 hover:text-gray-700"><Icons.X size={15}/></button>}
                                            </label>
                                            <button onClick={exportCSV} className="flex min-h-10 items-center justify-center gap-2 rounded-lg bg-green-600 px-3 text-sm text-white shadow-sm hover:bg-green-700"><Icons.FileSpreadsheet size={16}/> Export CSV</button>
                                            <button onClick={exportPDF} className="flex min-h-10 items-center justify-center gap-2 rounded-lg bg-red-600 px-3 text-sm text-white shadow-sm hover:bg-red-700"><Icons.FileText size={16}/> Export PDF</button>
                                        </div>
                                    </div>
                                    <div className="overflow-auto flex-1">
                                        <table className="min-w-full divide-y">
                                            <thead className="bg-gray-100 sticky top-0 z-10 shadow-sm">
                                                <tr>
                                                    {['ID','Name','Dept','Sub-dept','Shift','Position','Type','Status','Phone','Start Date','Company', ...(showEmployeeHistory ? ['Exit Date'] : [])].map(h => (
                                                        <th key={h} className="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" onClick={()=>requestSort(h==='ID'?'id':h==='Name'?'name':h==='Dept'?'dept':h==='Sub-dept'?'subDept':h==='Shift'?'shift':h==='Position'?'position':h==='Type'?'type':h==='Status'?'status':h==='Phone'?'phone':h==='Start Date'?'startDate':h==='Exit Date'?'exitDate':'company')}>
                                                            <div className="flex items-center">{h} <Icons.Sort size={12} className="ml-1 opacity-50"/></div>
                                                        </th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y bg-white">
                                                {processedEmployees.length === 0 && <tr><td colSpan={11} className="px-4 py-10 text-center text-sm text-gray-500">{searchTerm ? `ไม่พบรายชื่อที่ตรงกับ “${searchTerm}”` : 'ไม่พบพนักงานในแผนกนี้'}</td></tr>}
                                                {processedEmployees.map(emp => (
                                                    <tr key={emp.id} className="hover:bg-blue-50 cursor-pointer transition-colors" onClick={()=>{setEditingEmployee({...emp, isNew:false}); setIsModalOpen(true);}}>
                                                        <td className="px-4 py-3 text-sm font-mono text-gray-500">{emp.id}</td>
                                                        <td className="px-4 py-3 text-sm font-medium text-gray-900 flex items-center gap-2"><img src={formatDriveUrl(emp.image)} className="w-6 h-6 rounded-full bg-gray-200"/>{emp.name}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-600"><span className="px-2 py-0.5 rounded-full bg-gray-100 text-xs">{showEmployeeHistory ? (emp.exitDept || emp.dept) : emp.dept}</span></td>
                                                        <td className="px-4 py-3 text-sm text-gray-600">{(showEmployeeHistory ? (emp.exitSubDept || emp.subDept) : emp.subDept) || <span className="text-gray-400">ไม่ระบุ</span>}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-600">{['A', 'B'].includes(String(emp.shift || '').toUpperCase()) ? <span className="rounded-full bg-indigo-100 px-2 py-0.5 text-xs font-bold text-indigo-700">กะ {String(emp.shift).toUpperCase()}</span> : <span className="text-gray-400">ไม่มีกะ</span>}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-600">{emp.position}</td>
                                                        <td className="px-4 py-3 text-sm"><span className={`px-2 py-1 rounded-full text-xs font-bold ${emp.type==='Permanent'?'bg-green-100 text-green-800':'bg-orange-100 text-orange-800'}`}>{emp.type}</span></td>
                                                        <td className="px-4 py-3 text-sm"><span className={`w-2 h-2 rounded-full inline-block mr-2 ${emp.status==='Active'?'bg-green-500':'bg-red-500'}`}></span>{emp.status}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-500">{emp.phone}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-500"><div>{formatDate(emp.startDate)}</div><div className="text-[10px] text-gray-400">{calculateTenure(emp.startDate)}</div></td>
                                                        <td className="px-4 py-3 text-sm text-gray-500">{emp.company}</td>
                                                        {showEmployeeHistory && <td className="px-4 py-3 text-sm text-gray-500">{formatDate(emp.exitDate) || <span className="text-gray-400">ไม่ระบุ</span>}</td>}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {selectionMode && selectedIds.length > 0 && (
                                <div className="batch-actions">
                                    <span className="text-sm font-bold text-gray-600">{selectedIds.length} Selected</span>
                                    <div className="h-6 w-px bg-gray-200 mx-2"></div>
                                    <span className="text-xs text-gray-400 mr-2">Transfer To:</span>
                                    {departments.map(d => <button key={d} onClick={()=>handleTransferToDept(d)} className="px-2 py-1 text-xs bg-blue-50 text-blue-600 rounded hover:bg-blue-100">{d}</button>)}
                                    <button onClick={()=>{if(!confirm(`Delete ${selectedIds.length} employees?`)) return; updateStateFull(employees.filter(e=>!selectedIds.includes(e.id)), [], selectedIds); setSelectedIds([]); setSelectionMode(false);}} className="p-2 text-red-600 ml-4"><Icons.Trash2 size={16}/></button>
                                </div>
                            )}

                            {viewMode === 'chart' && (
                                <>
                                    <div className="zoom-controls"><button onClick={()=>setZoom(z=>Math.max(0.3,z-0.1))}><Icons.ZoomOut/></button><span className="text-xs font-mono">{Math.round(zoom*100)}%</span><button onClick={()=>setZoom(z=>Math.min(1.5,z+0.1))}><Icons.ZoomIn/></button></div>
                                    {!isLocked && historyIndex > 0 && <div className="undo-controls"><button onClick={handleUndo} className="bg-white text-gray-700 p-3 rounded-full shadow-lg border hover:bg-gray-50 flex items-center gap-2 group undo-btn" title="Undo Last Action"><Icons.RotateCcw size={20}/></button></div>}
                                </>
                            )}
                        </main>
                    </div>

                    {isModalOpen && <EmployeeForm employee={editingEmployee} supervisors={employees} positions={positions} positionRename={positionRename} depts={departments} subDepartments={subDepartments} onAddSubDept={handleAddSubDepartment} onDeleteSubDept={handleDeleteSubDepartment} onSave={handleSave} onCancel={()=>setIsModalOpen(false)} onDelete={handleDelete} currentUser={currentUser} driveUrl={driveUrl} onManagePositions={()=>setIsManagePositionsOpen(true)}/>}

                    {pendingShiftDrop && <div className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-950/50 p-4" role="dialog" aria-modal="true" aria-labelledby="drop-shift-title">
                        <div className="w-full max-w-md overflow-hidden rounded-2xl bg-white shadow-2xl">
                            <div className="border-b bg-slate-50 px-5 py-4">
                                <h2 id="drop-shift-title" className="text-lg font-bold text-slate-900">กำหนดกะก่อนย้ายพนักงาน</h2>
                                <p className="mt-1 text-sm text-slate-600">Leader {employees.find(employee => employee.id === pendingShiftDrop.targetId)?.name || ''} ยังไม่มีกะ กรุณาเลือกกะให้พนักงานแต่ละคน</p>
                                <p className="mt-1 text-xs text-slate-500">พนักงานที่มีกะอยู่แล้วจะคงกะเดิมไว้</p>
                            </div>
                            <div className="max-h-[50vh] space-y-3 overflow-y-auto p-5">
                                {employees.filter(employee => pendingShiftDrop.sourceIds.includes(employee.id) && !['A', 'B'].includes(String(employee.shift || '').trim().toUpperCase())).map(employee => (
                                    <label key={employee.id} className="flex items-center justify-between gap-3 rounded-xl border border-slate-200 p-3">
                                        <span className="min-w-0"><span className="block truncate font-semibold text-slate-900">{employee.name || employee.id}</span><span className="block text-xs text-slate-500">{employee.id}</span></span>
                                        <select aria-label={`เลือกกะของ ${employee.name || employee.id}`} value={pendingDropShifts[employee.id] || ''} onChange={event => setPendingDropShifts(previous => ({ ...previous, [employee.id]: event.target.value }))} className="min-h-11 w-32 rounded-lg border border-slate-300 bg-white px-3 font-semibold text-slate-800 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                                            <option value="">เลือกกะ</option><option value="A">กะ A</option><option value="B">กะ B</option>
                                        </select>
                                    </label>
                                ))}
                            </div>
                            <div className="flex justify-end gap-2 border-t bg-slate-50 px-5 py-4">
                                <button type="button" onClick={() => { setPendingShiftDrop(null); setPendingDropShifts({}); }} className="min-h-11 rounded-xl border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 hover:bg-slate-100">ยกเลิก</button>
                                <button type="button" disabled={employees.some(employee => pendingShiftDrop.sourceIds.includes(employee.id) && !['A', 'B'].includes(String(employee.shift || '').trim().toUpperCase()) && !['A', 'B'].includes(String(pendingDropShifts[employee.id] || '').trim().toUpperCase()))} onClick={() => { const pending = pendingShiftDrop; const shifts = pendingDropShifts; setPendingShiftDrop(null); setPendingDropShifts({}); applyDropReparent(pending.sourceIds, pending.targetId, shifts); }} className="min-h-11 rounded-xl bg-blue-700 px-4 text-sm font-bold text-white hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-50">กำหนดกะและย้าย</button>
                            </div>
                        </div>
                    </div>}
                    
                    {/* [V15] Admin Panel is now the central hub */}
                    {isAdminPanelOpen && <AdminPanel onClose={()=>setIsAdminPanelOpen(false)} driveUrl={driveUrl} setDriveUrl={setDriveUrl} apiCall={appApiCall} depts={departments} onAddDept={handleAddDept} onDeleteDept={handleDeleteDept} currentUser={currentUser} orgData={employees} onDataRecovered={(raw) => { const data = normalizeEmployees(raw); setEmployees(data); resetHistory(data); persistPendingSync([]); localStorage.setItem('orgData', JSON.stringify(data)); }}/>}
                    
                    {isManagePositionsOpen && <ManagePositionsModal positions={positions} onAdd={handleAddPosition} onDelete={handleDeletePosition} onRename={handleRenamePosition} canRename={currentUser?.role !== 'leader'} onClose={()=>setIsManagePositionsOpen(false)} />}
                    {isManageDeptsOpen && <ManageDeptsModal depts={departments} onAdd={handleAddDept} onDelete={handleDeleteDept} onClose={()=>setIsManageDeptsOpen(false)} />}
                    {isSummaryOpen && <SummaryDashboard employees={validEmployees} onClose={()=>setIsSummaryOpen(false)} departments={departments} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
