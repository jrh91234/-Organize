        const { useState, useEffect, useRef, useCallback, useMemo } = React;
        const attendanceLibraryLoads = {};
        const loadAttendanceLibrary = (globalName, url) => {
            if (window[globalName]) return Promise.resolve(window[globalName]);
            if (attendanceLibraryLoads[globalName]) return attendanceLibraryLoads[globalName];
            attendanceLibraryLoads[globalName] = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.async = true;
                const fail = message => {
                    delete attendanceLibraryLoads[globalName];
                    script.remove();
                    reject(new Error(message));
                };
                script.onload = () => window[globalName] ? resolve(window[globalName]) : fail('Attendance library did not load');
                script.onerror = () => fail('Attendance library request failed');
                document.head.appendChild(script);
            });
            return attendanceLibraryLoads[globalName];
        };

        // *** CONSTANTS ***
        const THEMES = { blue: { name: 'Blue', lv0: 'bg-blue-100 border-blue-600', lv1: 'bg-blue-50 border-blue-400', lvN: 'bg-white border-blue-200' }, teal: { name: 'Teal', lv0: 'bg-teal-100 border-teal-600', lv1: 'bg-teal-50 border-teal-400', lvN: 'bg-white border-teal-200' }, indigo: { name: 'Indigo', lv0: 'bg-indigo-100 border-indigo-600', lv1: 'bg-indigo-50 border-indigo-400', lvN: 'bg-white border-indigo-200' }, rose: { name: 'Rose', lv0: 'bg-rose-100 border-rose-600', lv1: 'bg-rose-50 border-rose-400', lvN: 'bg-white border-rose-200' }, slate: { name: 'Slate', lv0: 'bg-slate-200 border-slate-600', lv1: 'bg-slate-100 border-slate-400', lvN: 'bg-white border-slate-300' }, orange: { name: 'Orange', lv0: 'bg-orange-100 border-orange-600', lv1: 'bg-orange-50 border-orange-400', lvN: 'bg-white border-orange-200' } };
        const SHAPES = { rounded: { name: 'Rounded', cls: 'rounded-xl' }, sharp: { name: 'Square', cls: 'rounded-none' }, pill: { name: 'Pill', cls: 'rounded-[2rem]' }, leaf: { name: 'Leaf', cls: 'rounded-tr-3xl rounded-bl-3xl rounded-tl-md rounded-br-md' } };

        // --- Utils ---
        const formatDriveUrl = (url) => { if (!url) return "https://placehold.co/100x100?text=No+Img"; if (url.includes('drive.google.com') || url.includes('docs.google.com')) { let id = null; const idMatch1 = url.match(/id=([a-zA-Z0-9_-]+)/); if (idMatch1) id = idMatch1[1]; else { const idMatch2 = url.match(/\/d\/([a-zA-Z0-9_-]+)/); if (idMatch2) id = idMatch2[1]; } if (id) return `https://lh3.googleusercontent.com/d/${id}`; } return url; };
        const compressImage = (file, targetSizeKB = 512) => { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = (event) => { const img = new Image(); img.src = event.target.result; img.onload = () => { const canvas = document.createElement('canvas'); let width = img.width, height = img.height; const MAX = 1600; if (width > MAX || height > MAX) { if (width > height) { height *= MAX / width; width = MAX; } else { width *= MAX / height; height = MAX; } } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); let quality = 0.9, dataUrl = canvas.toDataURL('image/jpeg', quality); while (dataUrl.length * 0.75 > targetSizeKB * 1024 && quality > 0.1) { quality -= 0.1; dataUrl = canvas.toDataURL('image/jpeg', quality); } resolve(dataUrl); }; img.onerror = reject; }; reader.onerror = reject; }); };
        const formatDate = (dateString) => { if (!dateString) return ""; const date = new Date(dateString); if (isNaN(date.getTime())) return dateString; return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }); };
        const formatDateTime = (dateString) => { if (!dateString) return "-"; const date = new Date(dateString); if (isNaN(date.getTime())) return "-"; return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }); };
        const getLocalDateValue = () => { const date = new Date(); const offset = date.getTimezoneOffset() * 60000; return new Date(date.getTime() - offset).toISOString().slice(0, 10); };
        const isResignedEmployee = (employee) => String(employee?.status || '').trim().toLowerCase() === 'resigned';
        const calculateTenure = (dateString) => { if (!dateString) return ""; const start = new Date(dateString); const now = new Date(); if (isNaN(start.getTime())) return ""; let years = now.getFullYear() - start.getFullYear(); let months = now.getMonth() - start.getMonth(); if (months < 0 || (months === 0 && now.getDate() < start.getDate())) { years--; months += 12; } if (years < 0) return "New"; return `${years} ปี ${months} ด.`; };
        const safeLocalLoad = (key, fallback) => { try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : fallback; } catch (e) { console.warn(`Error loading ${key}, using fallback.`, e); return fallback; } };
        // Imported/cloud data may carry numeric IDs; the UI compares IDs with ===, so keep them as strings.
        const normalizeEmployees = (list) => (Array.isArray(list) ? list : []).filter(e => e && typeof e === 'object').map(e => ({
            ...e,
            id: e.id === null || e.id === undefined ? e.id : String(e.id),
            reportsTo: e.reportsTo === null || e.reportsTo === undefined ? e.reportsTo : String(e.reportsTo),
            subDept: String(e.subDept || '').trim(),
            shift: ['A', 'B'].includes(String(e.shift || '').trim().toUpperCase()) ? String(e.shift).trim().toUpperCase() : ''
        }));
        const isSubcontractEmployee = (employee) => String(employee?.type || '').trim().toLowerCase().replace(/[\s_-]/g, '').startsWith('subcontract');
        const compareEmployeeCategoryOrder = (a, b) => {
            const typeOrder = Number(isSubcontractEmployee(a)) - Number(isSubcontractEmployee(b));
            if (typeOrder) return typeOrder;
            if (isSubcontractEmployee(a)) {
                const companyA = String(a.company || '').trim();
                const companyB = String(b.company || '').trim();
                if (!companyA && companyB) return 1;
                if (companyA && !companyB) return -1;
                const companyOrder = companyA.localeCompare(companyB, undefined, { sensitivity: 'base', numeric: true });
                if (companyOrder) return companyOrder;
            }
            const orderA = Number(a.order) || 0;
            const orderB = Number(b.order) || 0;
            return orderA - orderB;
        };
        const normalizeSubDepartmentCatalog = (catalog, employees = []) => {
            const normalized = {};
            const add = (dept, rawName) => {
                const department = String(dept || '').trim();
                const name = String(rawName || '').trim();
                if (!department || !name) return;
                if (!normalized[department]) normalized[department] = [];
                if (!normalized[department].some(existing => existing.toLocaleLowerCase() === name.toLocaleLowerCase())) normalized[department].push(name);
            };
            if (catalog && typeof catalog === 'object' && !Array.isArray(catalog)) {
                Object.entries(catalog).forEach(([dept, names]) => Array.isArray(names) && names.forEach(name => add(dept, name)));
            }
            (Array.isArray(employees) ? employees : []).forEach(employee => add(employee?.dept, employee?.subDept));
            Object.values(normalized).forEach(names => names.sort((a, b) => a.localeCompare(b)));
            return normalized;
        };
        // True when `ancestorId` appears in the reporting chain above `nodeId` (or is the node itself).
        const isInChainAbove = (employees, ancestorId, nodeId) => {
            const byId = new Map(employees.map(e => [String(e.id), e]));
            const seen = new Set();
            let cur = nodeId === null || nodeId === undefined ? null : String(nodeId);
            while (cur && cur !== 'STAGING' && !seen.has(cur)) {
                if (cur === String(ancestorId)) return true;
                seen.add(cur);
                const node = byId.get(cur);
                cur = node && node.reportsTo ? String(node.reportsTo) : null;
            }
            return false;
        };

        const getPositionRank = (position) => {
            const p = (position || "").toLowerCase();
            if (p.includes('ceo') || p.includes('md') || p.includes('gm') || p.includes('president') || p.includes('director')) return 6;
            if (p.includes('manager')) return 5;
            if (p.includes('supervisor') || p.includes('sup')) return 4;
            if (p.includes('engineer') || p.includes('eng')) return 3;
            if (p.includes('leader')) return 2;
            return 1;
        };
        const getUserRoleRank = (role) => {
            if (role === 'admin') return 10;
            if (role === 'supervisor') return 4; 
            if (role === 'leader') return 2;     
            return 0; // Viewer
        };
        // [V24] Supervisor Self-Edit
        const canEditEmployee = (currentUser, targetEmp) => {
            if (!currentUser) return false;
            if (currentUser.role === 'admin') return true; 
            if (currentUser.dept !== 'ALL' && currentUser.dept !== targetEmp.dept) return false;
            const myRank = getUserRoleRank(currentUser.role);
            const targetRank = getPositionRank(targetEmp.position);
            
            if (currentUser.role === 'supervisor') {
                return myRank >= targetRank;
            }

            return myRank > targetRank;
        };

        const Ruler = ({ orientation = 'horizontal', length = 3000 }) => { const pxPerMm = 3.7795; const paperSizes = [ { name: 'A4', w: 210, h: 297 }, { name: 'A3', w: 297, h: 420 }, { name: 'A2', w: 420, h: 594 }, { name: 'A1', w: 594, h: 841 }, { name: 'A0', w: 841, h: 1189 } ];
            const ticks = []; for (let i = 0; i <= length / pxPerMm; i += 10) { ticks.push( <div key={i} className="absolute bg-gray-400" style={orientation==='horizontal'?{left:`${i*pxPerMm}px`,height:'6px',width:'1px',bottom:0}:{top:`${i*pxPerMm}px`,width:'6px',height:'1px',right:0}}> <span className="absolute text-[8px] text-gray-500 font-mono" style={orientation==='horizontal'?{left:'2px',bottom:'8px'}:{top:'2px',right:'8px'}}>{i}</span> </div> ); } const markers = []; paperSizes.forEach(size => { if (orientation === 'horizontal') { markers.push(<div key={`w-${size.name}`} className="paper-marker" style={{left: `${size.h * pxPerMm}px`, top: '2px'}}>{size.name}</div>); markers.push(<div key={`l-${size.name}`} className="paper-line" style={{left: `${size.h * pxPerMm}px`, height: '2000px', top: '30px', width: '0px'}}></div>); } else { markers.push(<div key={`h-${size.name}`} className="paper-marker" style={{top: `${size.w * pxPerMm}px`, left: '2px', transform: 'rotate(-90deg)'}}>{size.name}</div>); markers.push(<div key={`vl-${size.name}`} className="paper-line" style={{top: `${size.w * pxPerMm}px`, width: '2000px', left: '30px', height: '0px'}}></div>); } });

        const computeDashboardStats = (employees, activeTab) => {
                try {
                    const safeEmps = Array.isArray(employees) ? employees : [];
                    const targetEmps = activeTab === 'Overview' ? safeEmps : safeEmps.filter(e => e.dept === activeTab);
                    
                    const total = targetEmps.length;
                    const byType = { Permanent: 0, Subcontract: 0 };
                    const byPosition = {};
                    let totalYears = 0; let countTenure = 0;
                    
                    // [V11] Ops Counters
                    let opsSub = 0;
                    let opsPerm = 0;

                    targetEmps.forEach(e => {
                        if (e.type === 'Permanent') byType.Permanent++; 
                        else byType.Subcontract++;

                        const pos = e.position || "Unknown";
                        byPosition[pos] = (byPosition[pos] || 0) + 1;
                        
                        // [V11] Calculate Operational Ratio (Rank < 3)
                        const rank = getPositionRank(e.position);
                        if (rank < 3) { 
                            if (e.type === 'Subcontract') opsSub++;
                            else opsPerm++;
                        }

                        if (e.startDate) {
                            const start = new Date(e.startDate);
                            if (!isNaN(start.getTime())) {
                                const now = new Date();
                                const diffTime = Math.abs(now - start);
                                const diffYears = diffTime / (1000 * 60 * 60 * 24 * 365);
                                totalYears += diffYears;
                                countTenure++;
                            }
                        }
                    });

                    const avgTenure = countTenure > 0 ? (totalYears / countTenure).toFixed(1) : 0;

                    // [V11] Ratio Formatting
                    const totalOps = opsSub + opsPerm;
                    const opsRatio = totalOps > 0 ? { pct: Math.round((opsSub / totalOps) * 100), sub: opsSub, perm: opsPerm } : null;

                    // Production = every leader plus everyone who reports (directly or indirectly) to one; everyone else is Support.
                    // Follow the reporting chain over all employees so a team is still found when the dashboard is filtered to one department.
                    const childrenOf = {};
                    safeEmps.forEach(e => { const m = String(e.reportsTo ?? ''); if (m) (childrenOf[m] = childrenOf[m] || []).push(e); });
                    const productionIds = new Set();
                    const pending = safeEmps.filter(e => (e.position || '').toLowerCase().includes('leader'));
                    while (pending.length) {
                        const e = pending.pop();
                        const id = String(e.id);
                        if (productionIds.has(id)) continue;
                        productionIds.add(id);
                        (childrenOf[id] || []).forEach(c => pending.push(c));
                    }
                    const makeGroup = () => ({ total: 0, perm: 0, sub: 0, positions: {} });
                    const groups = { production: makeGroup(), support: makeGroup() };
                    targetEmps.forEach(e => {
                        const g = productionIds.has(String(e.id)) ? groups.production : groups.support;
                        g.total++;
                        if (e.type === 'Permanent') g.perm++; else g.sub++;
                        const pos = e.position || 'Unknown';
                        g.positions[pos] = (g.positions[pos] || 0) + 1;
                    });

                    // Leader Team Summary
                    const leaderSummary = targetEmps
                        .filter(e => (e.position || '').toLowerCase().includes('leader'))
                        .map(leader => {
                            const members = targetEmps.filter(e => e.reportsTo === leader.id);
                            // Include the leader in their own team totals.
                            const teamMembers = [leader, ...members];
                            const perm = teamMembers.filter(e => e.type === 'Permanent').length;
                            const sub = teamMembers.filter(e => e.type === 'Subcontract').length;
                            return { id: leader.id, name: leader.name, position: leader.position, dept: leader.dept, total: teamMembers.length, perm, sub };
                        })
                        .sort((a, b) => b.total - a.total);

                    return { total, byType, byPosition, avgTenure, opsRatio, leaderSummary, groups };
                } catch (error) {
                    console.error("Dashboard calculation error:", error);
                    return { total: 0, byType: {Permanent:0, Subcontract:0}, byPosition: {}, avgTenure: 0, opsRatio: null, leaderSummary: [], groups: { production: { total: 0, perm: 0, sub: 0, positions: {} }, support: { total: 0, perm: 0, sub: 0, positions: {} } } };

                            <div className={`grid grid-cols-1 gap-6 ${printMode ? '' : 'lg:grid-cols-2'}`}>

                                    <div className={`space-y-4 pr-2 ${printMode ? '' : 'max-h-60 overflow-y-auto'}`}>{Object.entries(stats.byPosition).sort((a,b)=>b[1]-a[1]).map(([pos, count]) => (<div key={pos} className="flex items-center group"><div className="w-40 text-sm font-medium text-gray-600 truncate pr-2 group-hover:text-blue-600">{pos}</div><div className="flex-1 bg-gray-100 rounded-full h-3 overflow-hidden"><div className="bg-blue-500 h-full rounded-full transition-all duration-500" style={{width: `${(count/stats.total)*100}%`}}></div></div><div className="w-12 text-right text-sm font-bold text-gray-800">{count}</div><div className="w-12 text-right text-xs text-gray-400">({Math.round((count/stats.total)*100)}%)</div></div>))}</div>
                                </div>
                                
                                {/* [NEW] Department Updates Table */}
                                {!printMode && (
                                <div className="bg-white rounded-xl shadow-sm p-6 border">
                                    <h3 className="font-bold text-gray-800 mb-4 border-b pb-2">Last Updates by Department</h3>
                                    <div className="space-y-2 max-h-60 overflow-y-auto">
                                        {Object.entries(deptUpdates).map(([dept, timestamp]) => (
                                            <div key={dept} className="flex justify-between items-center p-2 hover:bg-gray-50 rounded">
                                                <div className="font-medium text-sm text-gray-700">{dept}</div>
                                                <div className={`text-xs px-2 py-1 rounded-full ${timestamp ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'}`}>
                                                    {timestamp ? formatDateTime(new Date(timestamp).toISOString()) : 'No Data'}
                                                </div>
                                            </div>
                                        ))}

            </>
        );

        const SummaryDashboard = ({ employees, onClose, departments }) => { 
            const [activeTab, setActiveTab] = useState('Overview');
            
            const stats = useMemo(() => computeDashboardStats(employees, activeTab), [employees, activeTab]);

            // [V12 FIX] Filter out ghost departments
            const deptUpdates = useMemo(() => {
                const updates = {};
                // Initialize only valid departments
                departments.forEach(d => updates[d] = null);
                
                (employees || []).forEach(e => {
                    // Check if department is valid before updating timestamp
                    if (e.dept && e.lastModified && updates.hasOwnProperty(e.dept)) {
                        const t = new Date(e.lastModified).getTime();
                        if (!updates[e.dept] || t > updates[e.dept]) {
                            updates[e.dept] = t;
                        }
                    }
                });
                return updates;
            }, [employees, departments]);

            return ( 
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[80] animate-in fade-in"> 
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden"> 
                        <div className="flex shrink-0 justify-between items-center p-6 border-b bg-gray-50"><h2 className="text-2xl font-bold text-gray-800 flex items-center"><Icons.Chart className="mr-2 text-blue-600"/> Dashboard</h2><button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full"><Icons.X/></button></div>
                        <div className="flex shrink-0 overflow-x-auto p-4 gap-2 border-b bg-white"><button onClick={()=>setActiveTab('Overview')} className={`shrink-0 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap ${activeTab==='Overview'?'bg-blue-600 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>Overview</button>{departments.map(d => (<button key={d} onClick={()=>setActiveTab(d)} className={`shrink-0 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap ${activeTab===d?'bg-blue-600 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>{d}</button>))}</div>
                        <div className="p-6 overflow-y-auto bg-gray-50 flex-1">

                    </div> </div>
