        };

        const ManagePositionsModal = ({ positions, onAdd, onDelete, onRename, canRename, onClose }) => { const [newPos, setNewPos] = useState("");
            const [editing, setEditing] = useState(null); const [draft, setDraft] = useState("");
            const commitRename = () => { if (editing === null) return; if (onRename(editing, draft) !== false) setEditing(null); };
            return ( <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[70]"> <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm"> <div className="flex justify-between items-center mb-4"><h3 className="font-bold flex items-center"><Icons.Briefcase className="mr-2"/> Manage Positions</h3><button onClick={onClose}><Icons.X/></button></div> <div className="flex gap-2 mb-4"><input value={newPos} onChange={e=>setNewPos(e.target.value)} placeholder="New Position..." className="flex-1 border p-2 rounded text-sm"/><button onClick={()=>{if(newPos){onAdd(newPos);setNewPos('');}}} className="bg-green-600 text-white p-2 rounded"><Icons.Plus/></button></div> <div className="max-h-60 overflow-y-auto space-y-2">{positions.map(p => (editing === p ? (<div key={p} className="flex items-center gap-2 p-2 bg-blue-50 rounded text-sm"><input autoFocus value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{ if (e.key === 'Enter') commitRename(); if (e.key === 'Escape') setEditing(null); }} aria-label={`แก้ชื่อตำแหน่ง ${p}`} className="min-w-0 flex-1 border p-1.5 rounded text-sm"/><button onClick={commitRename} aria-label="บันทึกชื่อตำแหน่ง" className="p-1.5 rounded bg-blue-600 text-white"><Icons.Check size={16}/></button><button onClick={()=>setEditing(null)} aria-label="ยกเลิก" className="p-1.5 rounded text-gray-500 hover:bg-gray-200"><Icons.X size={16}/></button></div>) : (<div key={p} className="flex justify-between items-center gap-2 p-2 bg-gray-50 rounded text-sm group"><span className="min-w-0 truncate">{p}</span><span className="flex shrink-0 items-center gap-1">{canRename && <button onClick={()=>{setEditing(p); setDraft(p);}} aria-label={`แก้ชื่อตำแหน่ง ${p}`} title="แก้ชื่อตำแหน่ง" className="p-1 text-blue-500 hover:text-blue-700"><Icons.Edit size={16}/></button>}<button onClick={()=>onDelete(p)} aria-label={`ลบตำแหน่ง ${p}`} className="p-1 text-red-400 hover:text-red-600"><Icons.Trash2 size={16}/></button></span></div>)))}</div> </div> </div> );
        };
        const LoginScreen = ({ onLogin, driveUrl, apiCall }) => { const [creds, setCreds] = useState({ username: '', password: '' });
            const [loading, setLoading] = useState(false); const handleSubmit = async (e) => { e.preventDefault(); setLoading(true);
            try {
                if (driveUrl) {
                    const res = await apiCall(driveUrl, 'login', creds);
                    if (res?.status === 'success') { onLogin(res.user); return; }
                    alert(res?.message || "Login failed");
                    return;
                }
                if (creds.username === 'admin' && creds.password === 'password') {
                    onLogin({ username: 'admin', name: 'System Admin', role: 'admin', dept: 'ALL' });
                } else {
                    alert("Login failed");
                }
            } catch (err) {
                alert("ไม่สามารถเชื่อมต่อ Backend ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่");
            } finally { setLoading(false); } };
            // เพิ่มปุ่ม Reset Data มุมขวาล่าง
            return ( <div className="h-screen flex items-center justify-center bg-slate-900 px-4 relative"> <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm"> <div className="flex flex-col items-center mb-8"> <div className="bg-red-600 p-3 rounded-xl text-white font-bold text-2xl mb-2">HR</div> <h1 className="text-xl font-bold text-gray-800">Organize System</h1> </div> <form onSubmit={handleSubmit} className="space-y-4"> <input type="text" placeholder="Username" className="w-full p-3 border rounded-lg" onChange={e => setCreds({...creds, username: e.target.value})} required /> <input type="password" placeholder="Password" className="w-full p-3 border rounded-lg" onChange={e => setCreds({...creds, password: e.target.value})} required /> <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition-colors"> {loading ? 'Logging in...' : 'Login'} </button> </form> </div> <button onClick={()=>{if(confirm('ล้างข้อมูลทั้งหมดในเครื่องเพื่อแก้ปัญหา?')) { localStorage.clear(); location.reload(); }}} className="absolute bottom-4 right-4 text-xs text-gray-500 hover:text-white underline">Reset Data (Emergency)</button> </div> );
        };

        // [New] Loading Overlay Component
        const LoadingScreen = () => (
            <div className="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
                <Icons.Loader size={48} className="text-blue-600 mb-4 animate-spin"/>
                <p className="text-gray-500 font-bold">Loading Organization Data...</p>
            </div>
        );

        // [NEW] Status Indicator Component
        const StatusIndicator = ({ status, pendingCount = 0, onRetry }) => {
            let color = "bg-gray-400";
            let text = "Unknown";
            let icon = <Icons.WifiOff size={14} className="text-gray-600"/>;

            if (status === 'online') { 
                color = "bg-green-500"; 
                text = "Online"; 
                icon = <Icons.Wifi size={14} className="text-green-600"/>;
            }
            else if (status === 'syncing') { 
                color = "bg-yellow-500"; 
                text = "Syncing"; 
                icon = <Icons.RefreshCw size={14} className="text-yellow-600 animate-spin"/>;
            }
            else if (status === 'offline') { 
                color = "bg-red-500"; 
                text = "Offline"; 
                icon = <Icons.WifiOff size={14} className="text-red-600"/>;
            }
            else if (status === 'error') { 
                color = "bg-red-600"; 
                text = "Error"; 
                icon = <Icons.Alert size={14} className="text-red-600"/>;
            }
            else if (status === 'conflict') {
                color = "bg-orange-500";
                text = "Conflict";
                icon = <Icons.Alert size={14} className="text-orange-600"/>;
            }

            return (
                <div className="flex items-center gap-2 px-3 py-1.5 bg-white rounded-full shadow-sm border border-gray-200" title={`Connection Status: ${text}`}>
                    {icon}
                    <span className={`w-2 h-2 rounded-full ${color}`}></span>
                    <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider hidden sm:inline-block">{text}</span>
                    {pendingCount > 0 && <button type="button" onClick={onRetry} disabled={status === 'syncing'} className="text-[10px] font-bold text-orange-600 hover:text-orange-800 disabled:opacity-50" title="Retry pending cloud changes">
                        Retry ({pendingCount})
                    </button>}
                </div>
            );
        };

        // H1, Coil winding and Lug&Screw are shown as one combined sub-department in attendance views.
        const mergedSubDeptLabel = 'H1 / Coil winding / Lug&Screw';
        const mergedSubDeptNames = ['h1', 'coilwinding', 'lugscrew'];
        const attendanceSubDeptKey = value => {
            const name = String(value || '').trim();
            if (!name) return '__NO_SUB_DEPT__';
            return mergedSubDeptNames.includes(name.toLowerCase().replace(/[^a-z0-9]/g, '')) ? mergedSubDeptLabel : name;
        };

        const AttendanceMonitor = ({ data, loading, error, onRefresh, lastUpdated }) => {
            const employees = Array.isArray(data?.employees) ? data.employees : [];
            const records = Array.isArray(data?.records) ? data.records : [];
            const previousShifts = Array.isArray(data?.previousShifts) ? data.previousShifts : [];
            const [openDept, setOpenDept] = useState('');
            const [showPendingOnly, setShowPendingOnly] = useState(false);
            const workedIds = new Set(records.filter(record => record.type === 'work').map(record => record.username));
            const otIds = new Set(records.filter(record => record.type === 'ot').map(record => record.username));
            const shiftOf = employee => { const shift = String(employee.shift || '').trim().toUpperCase(); return shift === 'A' || shift === 'B' ? shift : ''; };

            // Group by department + team, then work out which shift(s) are on duty for each team:
            // 1) shifts that already have someone checked in this round, else
            // 2) the shifts the team checked in on its last earlier work day, else
            // 3) every shift (nothing to go on yet).
            // Employees with no shift assigned are always counted as expected.
            const teamMap = new Map();
            employees.forEach(employee => {
                const dept = employee.dept || 'ไม่ระบุแผนก';
                const subKey = attendanceSubDeptKey(employee.subDept);
                const key = `${dept}\u0000${subKey}`;
                if (!teamMap.has(key)) teamMap.set(key, { dept, subKey, members: [], earlier: new Set() });
                teamMap.get(key).members.push(employee);
            });
            previousShifts.forEach(entry => {
                const team = teamMap.get(`${entry.dept || 'ไม่ระบุแผนก'}\u0000${attendanceSubDeptKey(entry.subDept)}`);
                if (team) (entry.shifts || []).forEach(shift => team.earlier.add(shift));
            });
            const deptMap = new Map();
            teamMap.forEach(team => {
                const todayShifts = new Set(team.members.filter(employee => workedIds.has(employee.id)).map(shiftOf).filter(Boolean));
                let basis = 'today';
                let active = todayShifts;
                if (active.size === 0) { active = team.earlier; basis = 'earlier'; }
                if (active.size === 0) { active = new Set(['A', 'B']); basis = 'unknown'; }
                const expected = team.members.filter(employee => !shiftOf(employee) || active.has(shiftOf(employee)));
                const entry = {
                    name: team.subKey === '__NO_SUB_DEPT__' ? 'ไม่ระบุแผนกย่อย' : team.subKey,
                    shifts: Array.from(active).sort(),
                    basis,
                    total: expected.length,
                    work: expected.filter(employee => workedIds.has(employee.id)).length,
                    ot: expected.filter(employee => otIds.has(employee.id)).length,
                    pending: expected.filter(employee => !workedIds.has(employee.id))
                };
                if (!deptMap.has(team.dept)) deptMap.set(team.dept, { name: team.dept, total: 0, work: 0, ot: 0, teams: [], pending: [] });
                const dept = deptMap.get(team.dept);
                dept.total += entry.total; dept.work += entry.work; dept.ot += entry.ot;
                dept.teams.push(entry);
                dept.pending.push(...entry.pending);
            });
            const departments = Array.from(deptMap.values()).sort((a, b) => a.name.localeCompare(b.name));
            departments.forEach(dept => dept.teams.sort((a, b) => a.name.localeCompare(b.name)));
            const overall = departments.reduce((sum, dept) => ({ total: sum.total + dept.total, work: sum.work + dept.work, ot: sum.ot + dept.ot }), { total: 0, work: 0, ot: 0 });
            const pct = (done, total) => total > 0 ? Math.round((done / total) * 100) : 0;
            const tone = percent => percent >= 90 ? 'bg-green-500' : percent >= 60 ? 'bg-amber-400' : 'bg-red-400';
            const shiftText = team => `${team.shifts.map(shift => `กะ ${shift}`).join(' + ')}${team.basis === 'today' ? '' : ' (คาดการณ์)'}`;
            const dateLabel = data?.date
                ? new Date(`${data.date}T00:00:00`).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
                : 'วันนี้';
            const timeLabel = lastUpdated ? new Date(lastUpdated).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '-';
            const cards = [
                { label: 'ต้องเข้างาน (กะที่ทำงานอยู่)', value: overall.total, cls: 'text-gray-900' },
                { label: 'มาแล้ว', value: overall.work, cls: 'text-green-700' },
                { label: 'ยังไม่มา', value: overall.total - overall.work, cls: overall.total - overall.work > 0 ? 'text-red-600' : 'text-gray-400' },
                { label: 'OT', value: overall.ot, cls: 'text-purple-700' }
            ];
            return (
                <section className="mx-auto w-full max-w-6xl space-y-4 pb-10">
                    <div className="flex items-start justify-between gap-3">
                        <div>
                            <div className="text-sm font-semibold text-blue-600">Monitor การเช็คชื่อ</div>
                            <h1 className="text-xl sm:text-2xl font-bold text-gray-900">{dateLabel}</h1>
                            <p className="mt-1 text-sm text-gray-500">รอบวัน 08:00–07:59 วันถัดไป · อัปเดตอัตโนมัติทุก 60 วินาที · ล่าสุด {timeLabel}</p>
                        </div>
                        <button type="button" onClick={onRefresh} disabled={loading} className="shrink-0 rounded-xl border bg-white px-3 py-2 text-sm font-semibold text-gray-600 shadow-sm disabled:opacity-50">{loading ? 'กำลังโหลด...' : 'โหลดใหม่'}</button>
                    </div>
                    {error && <div role="alert" className="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">{error}</div>}
                    {data?.rosterMessage && <div className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm font-semibold text-amber-800">{data.rosterMessage}</div>}

                    <div className="grid grid-cols-2 gap-3 md:grid-cols-4">
                        {cards.map(card => (
                            <div key={card.label} className="rounded-2xl border bg-white p-4 shadow-sm">
                                <div className="text-xs font-semibold text-gray-500">{card.label}</div>
                                <div className={`mt-1 text-3xl font-extrabold ${card.cls}`}>{card.value}</div>
                            </div>
                        ))}
                    </div>

                    <div className="rounded-2xl border bg-white p-4 shadow-sm">
                        <div className="flex items-center justify-between text-sm font-semibold text-gray-700">
                            <span>มาแล้ว / ต้องเข้างาน</span>
                            <span>{overall.work}/{overall.total} ({pct(overall.work, overall.total)}%)</span>
                        </div>
                        <div className="mt-2 h-3 overflow-hidden rounded-full bg-gray-100"><div className={`h-full rounded-full transition-all ${tone(pct(overall.work, overall.total))}`} style={{ width: `${pct(overall.work, overall.total)}%` }}></div></div>
                        <p className="mt-2 text-xs text-gray-500">ระบบตรวจจับกะที่กำลังทำงานของแต่ละทีมเอง จากคนที่เช็คชื่อแล้ววันนี้ ถ้ายังไม่มีใครเช็คจะใช้กะของวันทำงานล่าสุดก่อนหน้า (คาดการณ์)</p>
                    </div>

                    <label className="flex items-center justify-end gap-2 text-xs font-semibold text-gray-600"><input type="checkbox" checked={showPendingOnly} onChange={event => setShowPendingOnly(event.target.checked)} />แสดงเฉพาะแผนกที่ยังมาไม่ครบ</label>

                    {employees.length === 0 && !loading && <div className="rounded-2xl border bg-white p-5 text-sm text-gray-500">ไม่มีรายชื่อพนักงานที่เข้าถึงได้</div>}

                    <div className="grid gap-3 md:grid-cols-2">
                        {departments.filter(dept => !showPendingOnly || dept.work < dept.total).map(dept => {
                            const percent = pct(dept.work, dept.total);
                            const isOpen = openDept === dept.name;
                            return (
                                <div key={dept.name} className="rounded-2xl border bg-white p-4 shadow-sm">
                                    <button type="button" onClick={() => setOpenDept(isOpen ? '' : dept.name)} className="w-full text-left" aria-expanded={isOpen}>
                                        <div className="flex items-center justify-between gap-2">
                                            <h2 className="text-base font-bold text-gray-900">{dept.name}</h2>
                                            <span className="text-sm font-bold text-gray-700">{percent}%</span>
                                        </div>
                                        <div className="mt-2 h-2.5 overflow-hidden rounded-full bg-gray-100"><div className={`h-full rounded-full transition-all ${tone(percent)}`} style={{ width: `${percent}%` }}></div></div>
                                        <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs font-semibold">
                                            <span className="text-green-700">มาแล้ว {dept.work}/{dept.total}</span>
                                            <span className="text-purple-700">OT {dept.ot}</span>
                                            <span className={dept.total - dept.work > 0 ? 'text-red-600' : 'text-gray-400'}>ยังไม่มา {dept.total - dept.work}</span>
                                            <span className="ml-auto text-gray-400">{isOpen ? 'ซ่อนรายละเอียด' : 'ดูรายละเอียด'}</span>
                                        </div>
                                    </button>
                                    {isOpen && (
                                        <div className="mt-3 space-y-3 border-t pt-3">
                                            <table className="w-full text-xs">
                                                <thead><tr className="text-left text-gray-500"><th className="py-1 pr-2">แผนกย่อย / ทีม</th><th className="px-2">กะที่ทำงาน</th><th className="px-2 text-right">ทั้งหมด</th><th className="px-2 text-right">มาแล้ว</th><th className="pl-2 text-right">%</th></tr></thead>
                                                <tbody>
                                                    {dept.teams.map(team => (
                                                        <tr key={team.name} className="border-t">
                                                            <td className="py-1.5 pr-2 font-semibold text-gray-800">{team.name}</td>
                                                            <td className="px-2 text-gray-600">{shiftText(team)}</td>
                                                            <td className="px-2 text-right">{team.total}</td>
                                                            <td className="px-2 text-right text-green-700">{team.work}</td>
                                                            <td className="pl-2 text-right font-bold">{pct(team.work, team.total)}%</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            <div>
                                                <div className="mb-1 text-xs font-bold text-gray-600">ยังไม่มา ({dept.pending.length})</div>
                                                {dept.pending.length === 0
                                                    ? <div className="text-xs font-semibold text-green-700">มาครบทุกคนแล้ว</div>
                                                    : <div className="flex flex-wrap gap-1.5">{dept.pending.map(employee => <span key={employee.id} className="rounded-full bg-red-50 px-2 py-0.5 text-[11px] font-semibold text-red-700" title={`${employee.id} · ${employee.position || ''}`}>{employee.name}</span>)}</div>}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </section>
            );
        };

        const sortAttendanceByHierarchy = (employees) => {
            const roster = Array.isArray(employees) ? employees : [];
            const byId = new Map(roster.map(employee => [String(employee.id), employee]));
            const originalIndex = new Map(roster.map((employee, index) => [String(employee.id), index]));
            const compareSiblings = (a, b) => {
                const categoryOrder = compareEmployeeCategoryOrder(a, b);
                if (categoryOrder) return categoryOrder;
                return (originalIndex.get(String(a.id)) || 0) - (originalIndex.get(String(b.id)) || 0);
            };
            const childrenByManager = new Map();
            const roots = [];
            roster.forEach(employee => {
                const managerId = String(employee.reportsTo || '').trim();
                if (!managerId || managerId === 'STAGING' || !byId.has(managerId)) {
                    roots.push(employee);
                    return;
                }
                if (!childrenByManager.has(managerId)) childrenByManager.set(managerId, []);
                childrenByManager.get(managerId).push(employee);
            });
            roots.sort(compareSiblings);
            childrenByManager.forEach(children => children.sort(compareSiblings));

            const ordered = [];
            const visited = new Set();
            const visit = employee => {
                const id = String(employee.id);
                if (visited.has(id)) return;
                visited.add(id);
                ordered.push(employee);
                (childrenByManager.get(id) || []).forEach(visit);
            };
            roots.forEach(visit);
            // Keep malformed or cyclic reporting chains visible after the valid hierarchy.
            roster.slice().sort(compareSiblings).forEach(visit);
            return ordered;
        };

        const AttendanceAvatar = ({ employee }) => {
            const [imageFailed, setImageFailed] = useState(false);
            const imageUrl = employee?.image ? formatDriveUrl(employee.image) : '';
            const initials = String(employee?.name || employee?.id || '?').trim().split(/\s+/).slice(0, 2).map(part => part.charAt(0)).join('').toUpperCase();
            return (
                <div className="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-full border border-gray-200 bg-blue-50 text-sm font-bold text-blue-700" aria-hidden="true">
                    {imageUrl && !imageFailed
                        ? <img src={imageUrl} alt="" loading="lazy" decoding="async" referrerPolicy="no-referrer" onError={() => setImageFailed(true)} className="h-full w-full object-cover" />
                        : <span>{initials}</span>}
                </div>
            );
        };

        const AttendanceQRCodeModal = ({ employee, onClose }) => {
            const qrRef = useRef(null);
            const [qrLoading, setQrLoading] = useState(true);
            const [qrError, setQrError] = useState('');
            const code = `HRATTEND1:${encodeURIComponent(String(employee.id))}`;
            useEffect(() => {
                let cancelled = false;
                loadAttendanceLibrary('QRCode', 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').then(QRCode => {
                    if (cancelled || !qrRef.current) return;
                    qrRef.current.innerHTML = '';
                    new QRCode(qrRef.current, { text: code, width: 248, height: 248, correctLevel: QRCode.CorrectLevel.M });
                    setQrLoading(false);
                }).catch(() => {
                    if (!cancelled) { setQrError('โหลด QR ไม่สำเร็จ กรุณาลองใหม่'); setQrLoading(false); }
                });
                return () => { cancelled = true; };
            }, [code]);
            return (
                <div className="fixed inset-0 z-[140] flex items-center justify-center bg-black/60 p-4" role="dialog" aria-modal="true" aria-label={`QR code ${employee.name}`}>
                    <div className="w-full max-w-sm rounded-2xl bg-white p-5 text-center shadow-2xl">
                        <div className="flex items-start justify-between gap-3 text-left">
                            <div><h2 className="font-bold text-gray-900">QR เช็คชื่อพนักงาน</h2><p className="mt-1 text-sm text-gray-500">{employee.name} · {employee.id}</p></div>
                            <button type="button" onClick={onClose} className="rounded-lg px-3 py-2 text-gray-500 hover:bg-gray-100">ปิด</button>
                        </div>
                        <div className="my-5 flex min-h-[264px] items-center justify-center rounded-xl border bg-white p-2"><div ref={qrRef}></div>{qrLoading && <span className="text-sm text-gray-500">กำลังสร้าง QR…</span>}{qrError && <span className="text-sm text-red-600">{qrError}</span>}</div>
                        <p className="text-sm text-gray-600">ให้พนักงานแสดง QR นี้ แล้วสแกนจากหน้าเช็คชื่อ</p>
                    </div>
                </div>
            );
        };

        const AttendanceQrScanner = ({ onScan, onClose, queuedCount, scanMessage }) => {
            const scannerRef = useRef(null);
            const onScanRef = useRef(onScan);
            const [cameraError, setCameraError] = useState('');
            const [cameraReady, setCameraReady] = useState(false);
            useEffect(() => { onScanRef.current = onScan; }, [onScan]);
            useEffect(() => {
                let disposed = false;
                let startPromise = null;
                const startScanner = async () => {
                    try {
                        const Html5Qrcode = await loadAttendanceLibrary('Html5Qrcode', 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
                        if (disposed) return;
                        const scanner = new Html5Qrcode('attendance-qr-reader', { verbose: false });
                        scannerRef.current = scanner;
                        startPromise = scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1 }, text => { if (!disposed) onScanRef.current(text); }, () => {});
                        await startPromise;
                        if (!disposed) setCameraReady(true);
                    } catch (error) {
                        if (!disposed) setCameraError(window.Html5Qrcode ? 'เปิดกล้องไม่ได้ กรุณาอนุญาตใช้กล้องและเปิดหน้านี้ผ่าน HTTPS' : 'โหลดระบบสแกน QR ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ');
                    }
                };
                void startScanner();
                return () => {
                    disposed = true;
                    const scanner = scannerRef.current;
                    scannerRef.current = null;
                    if (scanner) {
                        Promise.resolve(startPromise).catch(() => {}).then(() => scanner.stop().catch(() => {})).then(() => scanner.clear()).catch(() => {});
                    }
                };
            }, []);
            return (
                <div className="fixed inset-0 z-[130] flex items-center justify-center bg-black/70 p-3 sm:p-5" role="dialog" aria-modal="true" aria-label="สแกน QR เช็คชื่อ">
                    <div className="max-h-full w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl sm:p-5">
                        <div className="flex items-start justify-between gap-3">
                            <div><h2 className="text-lg font-bold text-gray-900">สแกน QR พนักงาน</h2><p className="mt-1 text-sm text-gray-500">ระบบเลือกเข้างานหรือ OT ให้อัตโนมัติตามรายการรอบนี้</p></div>
                            <button type="button" onClick={onClose} className="rounded-lg px-3 py-2 text-gray-600 hover:bg-gray-100">ปิด</button>
                        </div>
                        <div id="attendance-qr-reader" className="mt-4 min-h-[280px] overflow-hidden rounded-xl bg-gray-950"></div>
                        {!cameraReady && !cameraError && <p className="mt-3 text-center text-sm text-gray-500">กำลังเปิดกล้อง…</p>}
                        {cameraError && <p role="alert" className="mt-3 rounded-xl bg-red-50 p-3 text-sm text-red-700">{cameraError}</p>}
                        {scanMessage && <p role="status" className="mt-3 rounded-xl bg-blue-50 p-3 text-center text-sm font-semibold text-blue-800">{scanMessage}</p>}
                        <p className="mt-3 text-center text-sm font-semibold text-green-700">เข้าคิวแล้ว {queuedCount} รายการ · สแกนต่อได้ ระบบยังไม่บันทึก</p>
                        <button type="button" onClick={onClose} className="mt-3 min-h-12 w-full rounded-xl bg-blue-700 px-4 font-bold text-white">เสร็จสิ้นการสแกน · กลับไปบันทึกทั้งหมด</button>
                    </div>
                </div>
            );
        };

        const AttendancePanel = ({ data, currentUser, currentDept, loading, savingType, error, notice, onSaveBatch, onRefresh }) => {
            const employees = Array.isArray(data?.employees) ? data.employees : [];
            const orderedEmployees = useMemo(() => sortAttendanceByHierarchy(employees), [employees]);
            const records = Array.isArray(data?.records) ? data.records : [];
            const isAdmin = currentUser?.role === 'admin';
            const userKey = currentUser ? `${currentUser.attendanceToken || currentUser.username || ''}|${currentUser.dept || ''}` : '';
            const [selectedDept, setSelectedDept] = useState(() => currentUser?.dept || currentDept || '');
            const [selectedSubDept, setSelectedSubDept] = useState('ALL');
            const [selectedShift, setSelectedShift] = useState('ALL');
            const [searchTerm, setSearchTerm] = useState('');
            const [pendingActions, setPendingActions] = useState({});
            const [qrEmployee, setQrEmployee] = useState(null);
            const [scannerOpen, setScannerOpen] = useState(false);
            const [scanNotice, setScanNotice] = useState('');
            const initializedForUser = useRef('');
            const deptOptions = Array.from(new Set(employees.map(employee => employee.dept || '__NO_DEPT__')));
            const deptOptionsKey = deptOptions.join('|');
            const selfById = employees.find(employee => employee.id === String(data?.selfId || ''));
            const selfByUsername = employees.find(employee => employee.id === String(currentUser?.username || ''));
            const sameNameEmployees = currentUser?.name
                ? employees.filter(employee => String(employee.name || '').trim().toLocaleLowerCase() === String(currentUser.name).trim().toLocaleLowerCase())
                : [];
            const selfEmployee = selfById || selfByUsername || (sameNameEmployees.length === 1 ? sameNameEmployees[0] : null);
            useEffect(() => {
                if (employees.length === 0) return;
                const allowed = selectedDept === 'ALL' && isAdmin || deptOptions.includes(selectedDept);
                if (!allowed) {
                    const preferredDept = deptOptions.find(dept => dept.toLocaleLowerCase() === String(currentUser?.dept || '').trim().toLocaleLowerCase());
                    setSelectedDept(isAdmin ? (preferredDept || 'ALL') : (preferredDept || deptOptions[0] || ''));
                }
            }, [deptOptionsKey, employees.length, isAdmin, selectedDept, currentUser?.dept]);
            useEffect(() => {
                if (!userKey || !currentUser?.username || String(data?.actorUsername || '') !== String(currentUser.username) || employees.length === 0 || initializedForUser.current === userKey) return;
                initializedForUser.current = userKey;
                const userDept = String(currentUser.dept || '').trim();
                const preferredDept = deptOptions.find(dept => dept.toLocaleLowerCase() === userDept.toLocaleLowerCase());
                setSelectedDept(isAdmin ? (preferredDept || 'ALL') : (preferredDept || deptOptions[0] || ''));
                setSelectedSubDept(String(selfEmployee?.subDept || '').trim() ? attendanceSubDeptKey(selfEmployee.subDept) : 'ALL');
                const shift = String(selfEmployee?.shift || '').trim().toUpperCase();
                setSelectedShift(shift === 'A' || shift === 'B' ? shift : 'ALL');
                setSearchTerm('');
                setPendingActions({});
            }, [userKey, currentUser?.username, currentUser?.dept, data?.actorUsername, data?.selfId, deptOptionsKey, employees.length, isAdmin, selfEmployee?.subDept, selfEmployee?.shift]);

            const dateLabel = data?.date
                ? new Date(`${data.date}T00:00:00`).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
                : 'วันนี้';
            const scopedEmployees = orderedEmployees.filter(employee => selectedDept === 'ALL' || (employee.dept || '__NO_DEPT__') === selectedDept);
            const subDeptOptions = Array.from(new Set(scopedEmployees.map(employee => attendanceSubDeptKey(employee.subDept)))).sort((a, b) => a === '__NO_SUB_DEPT__' ? 1 : b === '__NO_SUB_DEPT__' ? -1 : a.localeCompare(b));
            const subDeptOptionsKey = subDeptOptions.join('|');
            useEffect(() => {
                if (selectedSubDept !== 'ALL' && !subDeptOptions.includes(selectedSubDept)) setSelectedSubDept('ALL');
            }, [selectedSubDept, subDeptOptionsKey]);
            const subDeptScopedEmployees = scopedEmployees.filter(employee => selectedSubDept === 'ALL' || attendanceSubDeptKey(employee.subDept) === selectedSubDept);
            const shiftScopedEmployees = subDeptScopedEmployees.filter(employee => selectedShift === 'ALL' || (selectedShift === 'UNASSIGNED' ? !['A', 'B'].includes(String(employee.shift || '').trim().toUpperCase()) : String(employee.shift || '').trim().toUpperCase() === selectedShift));
            const query = searchTerm.trim().toLowerCase();
            const visibleEmployees = shiftScopedEmployees.filter(employee => !query || `${employee.name} ${employee.id} ${employee.dept || ''} ${employee.subDept || ''} ${employee.position || ''} ${employee.shift || ''}`.toLowerCase().includes(query));
            const recordsByEmployee = records.reduce((map, record) => {
                const existing = map[record.username] || {};
                existing[record.type] = record;
                map[record.username] = existing;
                return map;
            }, {});
            const pendingList = Object.values(pendingActions);
            const workCount = shiftScopedEmployees.filter(employee => recordsByEmployee[employee.id]?.work).length;
            const otCount = shiftScopedEmployees.filter(employee => recordsByEmployee[employee.id]?.ot).length;

            const toggleAction = (employeeId, type) => {
                const key = `${employeeId}:${type}`;
                setPendingActions(previous => {
                    const next = { ...previous };
                    if (next[key]) {
                        delete next[key];
                        if (type === 'work') delete next[`${employeeId}:ot`];
                    } else {
                        next[key] = { employeeId, type };
                    }
                    return next;
                });
            };

            const handleQrScan = useCallback(rawCode => {
                const match = /^HRATTEND1:(.+)$/.exec(String(rawCode || '').trim());
                if (!match) {
                    setScanNotice('QR นี้ไม่ใช่รหัสเช็คชื่อของระบบ');
                    return;
                }
                let employeeId = '';
                try { employeeId = decodeURIComponent(match[1]); } catch (error) {}
                const employee = employees.find(item => item.id === employeeId);
                if (!employee) {
                    setScanNotice('พนักงานรายนี้อยู่นอกทีมที่คุณมีสิทธิ์เช็คชื่อ');
                    return;
                }
                if (!shiftScopedEmployees.some(item => item.id === employeeId)) {
                    setScanNotice(`พนักงาน ${employee.name} ไม่อยู่ในแผนกหรือกะที่เลือก`);
                    return;
                }
                const employeeRecords = recordsByEmployee[employee.id] || {};
                if (employeeRecords.ot) {
                    setScanNotice(`${employee.name} เช็คเข้างานและ OT ครบแล้วในรอบนี้`);
                    return;
                }
                if (!employeeRecords.work && pendingActions[`${employee.id}:work`]) {
                    setScanNotice(`${employee.name} อยู่ในคิวเข้างานแล้ว กรุณาบันทึกก่อนสแกน OT`);
                    return;
                }
                const type = employeeRecords.work ? 'ot' : 'work';
                const key = `${employee.id}:${type}`;
                if (pendingActions[key]) {
                    setScanNotice(`${employee.name} อยู่ในคิวบันทึกแล้ว`);
                    return;
                }
                setPendingActions(previous => ({ ...previous, [key]: { employeeId: employee.id, type } }));
                setScanNotice(`เพิ่ม ${employee.name} ในคิว${type === 'ot' ? ' OT' : 'เข้างาน'}แล้ว`);
                if (navigator.vibrate) navigator.vibrate(45);
            }, [employees, shiftScopedEmployees, recordsByEmployee, pendingActions]);

            const saveBatch = async () => {
                if (pendingList.length === 0 || savingType) return;
                const results = await onSaveBatch(pendingList);
                if (!Array.isArray(results)) return;
                const completed = new Set(results.filter(item => item.status === 'success' || item.status === 'duplicate').map(item => `${item.employeeId}:${item.type}`));
                setPendingActions(previous => Object.fromEntries(Object.entries(previous).filter(([key]) => !completed.has(key))));
            };

            return (
                <section className="mx-auto w-full max-w-6xl space-y-4 pb-28">
                    <div className="flex items-center justify-between gap-3">
                        <div>
                            <div className="text-sm font-semibold text-blue-600">เช็คชื่อประจำวัน</div>
                            <h1 className="text-xl sm:text-2xl font-bold text-gray-900">{dateLabel}</h1>
                            <p className="mt-1 text-sm text-gray-500">เลือกหลายคนหรือสแกน QR เพื่อบันทึกพร้อมกัน · รอบวัน 08:00–07:59 วันถัดไป</p>
                        </div>
                        <button type="button" onClick={onRefresh} disabled={loading} className="shrink-0 rounded-xl border bg-white px-3 py-2 text-sm font-semibold text-gray-600 shadow-sm disabled:opacity-50">{loading ? 'กำลังโหลด…' : 'โหลดใหม่'}</button>
                    </div>

                    {notice && <div role="status" className="rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-sm font-semibold text-green-800">{notice}</div>}
                    {error && <div role="alert" className="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">{error}</div>}
                    {data?.rosterMessage && <div role="status" className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm font-medium text-amber-800">{data.rosterMessage}</div>}
                    {scanNotice && <div role="status" className="rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm font-semibold text-blue-800">{scanNotice}</div>}

                    <div className="grid grid-cols-1 gap-3 rounded-2xl border bg-white p-3 shadow-sm sm:grid-cols-2 xl:grid-cols-12">
                        <label className="min-w-0 text-sm font-semibold text-gray-700 xl:col-span-2">
                            แผนก
                            <select value={selectedDept} onChange={event => { setSelectedDept(event.target.value); setSelectedSubDept('ALL'); }} disabled={loading || deptOptions.length === 0}
                                className="mt-1 min-h-12 w-full rounded-xl border border-gray-300 bg-white px-3 text-base font-semibold text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 disabled:bg-gray-100">
                                {isAdmin && <option value="ALL">ทุกแผนก</option>}
                                {deptOptions.map(dept => <option key={dept} value={dept}>{dept === '__NO_DEPT__' ? 'ไม่ระบุแผนก' : dept}</option>)}
                            </select>
                        </label>
                        <label className="min-w-0 text-sm font-semibold text-gray-700 xl:col-span-2">
                            แผนกย่อย / ทีม
                            <select value={selectedSubDept} onChange={event => setSelectedSubDept(event.target.value)} disabled={loading || scopedEmployees.length === 0}
                                className="mt-1 min-h-12 w-full rounded-xl border border-gray-300 bg-white px-3 text-base font-semibold text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 disabled:bg-gray-100">
                                <option value="ALL">ทุกแผนกย่อย</option>
                                {subDeptOptions.map(subDept => <option key={subDept} value={subDept}>{subDept === '__NO_SUB_DEPT__' ? 'ไม่ระบุแผนกย่อย' : subDept}</option>)}
                            </select>
                        </label>
                        <label className="min-w-0 text-sm font-semibold text-gray-700 xl:col-span-2">
                            กะ
                            <select value={selectedShift} onChange={event => setSelectedShift(event.target.value)} disabled={loading || employees.length === 0}
                                className="mt-1 min-h-12 w-full rounded-xl border border-gray-300 bg-white px-3 text-base font-semibold text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 disabled:bg-gray-100">
                                <option value="ALL">ทุกกะ</option>
                                <option value="A">กะ A</option>
                                <option value="B">กะ B</option>
                                <option value="UNASSIGNED">ไม่มีกะ</option>
                            </select>
                        </label>
                        <label className="min-w-0 text-sm font-semibold text-gray-700 xl:col-span-3">
                            ค้นหาพนักงาน
                            <input value={searchTerm} onChange={event => setSearchTerm(event.target.value)} placeholder="ชื่อหรือรหัสพนักงาน" className="mt-1 min-h-12 w-full rounded-xl border border-gray-300 px-3 text-base font-normal outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" />
                        </label>
                        <div className="flex flex-wrap items-end gap-2 sm:col-span-2 sm:justify-end xl:col-span-3 xl:justify-between">
                            <span className="whitespace-nowrap rounded-full bg-blue-100 px-3 py-2 text-xs font-bold text-blue-800">เข้างาน {workCount}/{shiftScopedEmployees.length}</span>
                            <span className="whitespace-nowrap rounded-full bg-violet-100 px-3 py-2 text-xs font-bold text-violet-800">OT {otCount}/{shiftScopedEmployees.length}</span>
                            <button type="button" onClick={() => { setScanNotice(''); setScannerOpen(true); }} disabled={loading || employees.length === 0} className="min-h-10 rounded-xl bg-green-700 px-4 text-sm font-bold text-white hover:bg-green-800 disabled:opacity-50">สแกน QR</button>
                        </div>
                    </div>

                    {loading && employees.length === 0 && <div className="rounded-2xl border bg-white p-5 text-sm text-gray-500">กำลังโหลดรายชื่อ…</div>}
                    {!loading && employees.length === 0 && !data?.rosterMessage && <div className="rounded-2xl border bg-white p-5 text-sm text-gray-500">ไม่มีรายชื่อพนักงานที่เข้าถึงได้</div>}
                    {employees.length > 0 && visibleEmployees.length === 0 && <div className="rounded-2xl border bg-white p-5 text-sm text-gray-500">{selectedShift === 'UNASSIGNED' ? 'ไม่พบพนักงานที่ไม่มีกะ' : selectedSubDept !== 'ALL' ? `ไม่พบพนักงานในแผนกย่อย ${selectedSubDept === '__NO_SUB_DEPT__' ? 'ที่ไม่ระบุ' : selectedSubDept}` : `ไม่พบพนักงานใน${selectedShift === 'ALL' ? 'แผนกนี้' : `กะ ${selectedShift}`}`}</div>}
                    <div className="space-y-3">
                        {visibleEmployees.map(employee => {
                            const employeeRecords = recordsByEmployee[employee.id] || {};
                            const work = employeeRecords.work;
                            const ot = employeeRecords.ot;
                            const workQueued = Boolean(pendingActions[`${employee.id}:work`]);
                            const buttons = [
                                { type: 'work', title: 'เข้างาน', record: work, queued: workQueued, disabled: Boolean(work) },
                                { type: 'ot', title: 'OT', record: ot, queued: Boolean(pendingActions[`${employee.id}:ot`]), disabled: !work && !workQueued || Boolean(ot) }
                            ];
                            return (
                                <article key={employee.id} className="rounded-2xl border bg-white p-3 shadow-sm sm:flex sm:items-center sm:gap-4 sm:p-4">
                                    <div className="mb-3 flex min-w-0 items-center justify-between gap-3 sm:mb-0 sm:flex-1">
                                        <div className="flex min-w-0 items-center gap-3">
                                            <AttendanceAvatar employee={employee} />
                                            <div className="min-w-0">
                                                <div className="flex min-w-0 items-center gap-1.5">
                                                    <div className="truncate font-bold text-gray-900">{employee.name || employee.id}</div>
                                                    {isSubcontractEmployee(employee) && <span title={employee.company || 'Subcontract'} className="max-w-24 shrink-0 truncate rounded bg-orange-50 px-1.5 py-0.5 text-[10px] font-semibold text-orange-700">{employee.company || 'Subcontract'}</span>}
                                                </div>
                                                <div className="truncate text-xs text-gray-500">{employee.id}{employee.position ? ` · ${employee.position}` : ''}{employee.dept ? ` · ${employee.dept}` : ''}{employee.subDept ? ` · ${employee.subDept}` : ''}{employee.shift ? ` · กะ ${employee.shift}` : ' · ไม่มีกะ'}</div>
                                            </div>
                                        </div>
                                        {employee.qrEnabled !== false && <button type="button" aria-label={`แสดง QR ${employee.name}`} onClick={() => setQrEmployee(employee)} className="shrink-0 rounded-lg border px-3 py-2 text-xs font-bold text-gray-600 hover:bg-gray-50">QR</button>}
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 sm:w-[360px]">
                                        {buttons.map(button => (
                                            <button key={button.type} type="button" disabled={loading || Boolean(savingType) || button.disabled}
                                                onClick={() => toggleAction(employee.id, button.type)}
                                                className={`touch-manipulation min-h-12 rounded-xl border px-3 py-2 text-sm font-bold transition active:scale-[0.98] disabled:cursor-not-allowed ${button.record ? 'border-green-200 bg-green-50 text-green-800' : button.queued ? 'border-blue-300 bg-blue-100 text-blue-800 ring-2 ring-blue-200' : button.type === 'ot' && button.disabled ? 'border-gray-200 bg-gray-100 text-gray-400' : 'border-blue-200 bg-white text-blue-700 hover:bg-blue-50 disabled:opacity-50'}`}>
                                                {button.record ? `${button.title} ✓ ${button.record.time}` : button.queued ? `เลือกแล้ว · ${button.title}` : button.type === 'ot' && button.disabled ? 'เลือกเข้างานก่อน' : button.title}
                                            </button>
                                        ))}
                                    </div>
                                </article>
                            );
                        })}
                    </div>

                    {pendingList.length > 0 && <div className="fixed inset-x-3 bottom-3 z-[60] mx-auto flex max-w-6xl items-center justify-between gap-3 rounded-2xl border border-blue-200 bg-white/95 p-3 shadow-xl backdrop-blur sm:px-5">
                        <div className="min-w-0"><div className="font-bold text-gray-900">รอบันทึก {pendingList.length} รายการ</div><div className="hidden text-xs text-gray-500 sm:block">ระบบจะส่งบันทึกทั้งหมดในครั้งเดียว</div></div>
                        <div className="flex shrink-0 gap-2"><button type="button" onClick={() => setPendingActions({})} disabled={Boolean(savingType)} className="min-h-11 rounded-xl border px-3 text-sm font-semibold text-gray-600">ล้าง</button><button type="button" onClick={saveBatch} disabled={Boolean(savingType)} className="min-h-11 rounded-xl bg-blue-700 px-4 text-sm font-bold text-white disabled:opacity-60">{savingType === 'batch' ? 'กำลังบันทึก…' : 'บันทึกทั้งหมด'}</button></div>
                    </div>}

                    {qrEmployee && <AttendanceQRCodeModal employee={qrEmployee} onClose={() => setQrEmployee(null)} />}
                    {scannerOpen && <AttendanceQrScanner onScan={handleQrScan} onClose={() => setScannerOpen(false)} queuedCount={pendingList.length} scanMessage={scanNotice} />}
                </section>
            );
        };

        const App = () => {
            // [FIXED] ใช้ safeLocalLoad ป้องกัน JSON Parse Error (สาเหตุหลักจอขาว)
            const initialEmployees = normalizeEmployees(safeLocalLoad('orgData', []));
            const initialPendingSync = safeLocalLoad('pendingSync', []);
            const safeInitialPendingSync = Array.isArray(initialPendingSync) ? initialPendingSync : [];
            const initialSubDepartmentCatalog = normalizeSubDepartmentCatalog(safeLocalLoad('orgSubDepartments', {}), initialEmployees);
            const [currentUser, setCurrentUser] = useState(() => safeLocalLoad('currentUser', null));
            const [employees, setEmployees] = useState(initialEmployees);
            const [positions, setPositions] = useState(() => safeLocalLoad('orgPositions', ["Manager", "Supervisor", "Engineer", "Leader", "Operator"]));
            const [departments, setDepartments] = useState(() => safeLocalLoad('orgDepartments', ["ASSEMBLY", "QC", "HR", "EXECUTIVE"]));
            const [subDepartments, setSubDepartments] = useState(initialSubDepartmentCatalog);
            
            const [currentDept, setCurrentDept] = useState(departments[0] || "ASSEMBLY");
            const [driveUrl, setDriveUrl] = useState(() => safeLocalLoad('driveUrl', "https://script.google.com/macros/s/AKfycbxYxBWD4blG_bP9hdTm_W8RP9PtM9CLZovmSFQVVsQTcBl18uxcaAxrhW5lZKFmEj8H/exec"));
            
            // [FIXED] เพิ่มสถานะ isDataReady เพื่อป้องกัน White Screen
            const [isDataReady, setIsDataReady] = useState(false);
            
            const [viewMode, setViewMode] = useState('chart'); 
            const [zoom, setZoom] = useState(1);
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingEmployee, setEditingEmployee] = useState(null);
            const [selectionMode, setSelectionMode] = useState(false);
            const [selectedIds, setSelectedIds] = useState([]);
            const [cloudStatus, setCloudStatus] = useState('offline');
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
            const [isAdminPanelOpen, setIsAdminPanelOpen] = useState(false);
            const [isSummaryOpen, setIsSummaryOpen] = useState(false);
            const [appTheme, setAppTheme] = useState('blue');
            const [appShape, setAppShape] = useState(SHAPES.rounded);
            const [layoutThreshold, setLayoutThreshold] = useState(4);
            const [deptName, setDeptName] = useState(currentDept + " DEPT");
            const [isManageDeptsOpen, setIsManageDeptsOpen] = useState(false);
            const [isManagePositionsOpen, setIsManagePositionsOpen] = useState(false);
            const [logo, setLogo] = useState({ url: null, x: 50, y: 50 });
            const [annotations, setAnnotations] = useState([]);
            const [linkStartId, setLinkStartId] = useState(null);
            const [showRulers, setShowRulers] = useState(false);
            const [history, setHistory] = useState([initialEmployees]);
            const [historyIndex, setHistoryIndex] = useState(0);
            const [pendingSyncCount, setPendingSyncCount] = useState(safeInitialPendingSync.length);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [sidebarWidth, setSidebarWidth] = useState(256);
            const [pendingShiftDrop, setPendingShiftDrop] = useState(null);
            const [pendingDropShifts, setPendingDropShifts] = useState({});
            const sidebarRef = useRef(null);
            const isResizing = useRef(false);
            const pendingSyncRef = useRef(safeInitialPendingSync);
            const syncInFlightRef = useRef(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'ascending' });
            const [showEmployeeHistory, setShowEmployeeHistory] = useState(false);
            const [attendanceData, setAttendanceData] = useState({ date: '', mine: {}, records: [], employees: [], departments: [] });
            const [attendanceLoading, setAttendanceLoading] = useState(false);
            const [attendanceUpdatedAt, setAttendanceUpdatedAt] = useState(null);
            const [attendanceSavingType, setAttendanceSavingType] = useState('');
            const [attendanceError, setAttendanceError] = useState('');
            const [attendanceNotice, setAttendanceNotice] = useState('');

            const appApiCall = useCallback(async (url, action, payload = {}) => {
                const executor = currentUser ? {
                    username: currentUser.username,
                    name: currentUser.name,
                    role: currentUser.role,
                    dept: currentUser.dept || 'ALL'
                } : { username: 'System', name: 'Login/System', role: '-', dept: '-' };
                const requestBody = { action, ...payload, executor };
                if (action === 'getAttendance' || action === 'recordAttendance' || action === 'recordAttendanceBatch') {
                    requestBody.attendanceToken = currentUser?.attendanceToken || '';
                }

                const res = await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify(requestBody)
                });
                const raw = await res.text();
                let result;
                try {
                    result = JSON.parse(raw);
                } catch (error) {
                    throw new Error(`Backend returned an invalid response (HTTP ${res.status})`);
                }
                if (!res.ok) {
                    throw new Error(result?.message || result?.error || `Backend request failed (HTTP ${res.status})`);
                }
                return result;
            }, [currentUser]);

            const loadAttendance = useCallback(async () => {
                if (!driveUrl) {
                    setAttendanceError('ยังไม่ได้ตั้งค่า URL ของระบบ');
                    return;
                }
                setAttendanceLoading(true);
                setAttendanceError('');
                try {
                    const result = await appApiCall(driveUrl, 'getAttendance');
                    if (result?.code === 'session_expired') {
                        localStorage.removeItem('currentUser');
                        setCurrentUser(null);
                        return;
                    }
                    if (result?.status !== 'success') throw new Error(result?.message || 'โหลดข้อมูลเช็คชื่อไม่สำเร็จ');
                    setAttendanceData(result);
                    setAttendanceUpdatedAt(Date.now());
                } catch (error) {
                    setAttendanceError(error?.message || 'เชื่อมต่อระบบเช็คชื่อไม่สำเร็จ');
                } finally {
                    setAttendanceLoading(false);
                }
            }, [appApiCall, driveUrl]);

            const handleAttendanceBatchSave = useCallback(async (items) => {
                if (!driveUrl || attendanceSavingType || !Array.isArray(items) || items.length === 0) return null;
                setAttendanceSavingType('batch');
                setAttendanceError('');
                setAttendanceNotice('');
                try {
                    const result = await appApiCall(driveUrl, 'recordAttendanceBatch', { items });
                    if (result?.code === 'session_expired') {
                        localStorage.removeItem('currentUser');
                        setCurrentUser(null);
                        return null;
                    }
                    if (result?.status !== 'success' || !Array.isArray(result.items)) {
                        throw new Error(result?.message || 'บันทึกเช็คชื่อไม่สำเร็จ');
                    }
                    const completed = result.items.filter(item => (item.status === 'success' || item.status === 'duplicate') && item.record);
                    setAttendanceData(previous => {
                        const sameDate = previous.date === result.date;
                        const mergedRecords = sameDate ? [...(previous.records || [])] : [];
                        completed.forEach(item => {
                            const record = item.record;
                            const index = mergedRecords.findIndex(existing => existing.username === record.username && existing.type === record.type);
                            if (index >= 0) mergedRecords[index] = record;
                            else mergedRecords.unshift(record);
                        });
                        return { ...previous, date: result.date || previous.date, records: mergedRecords };
                    });
                    const savedCount = result.items.filter(item => item.status === 'success').length;
                    const duplicateCount = result.items.filter(item => item.status === 'duplicate').length;
                    const failed = result.items.filter(item => item.status !== 'success' && item.status !== 'duplicate');
                    setAttendanceNotice(`บันทึกสำเร็จ ${savedCount} รายการ${duplicateCount ? ` · มีรายการบันทึกไว้แล้ว ${duplicateCount} รายการ` : ''}`);
                    if (failed.length) setAttendanceError(failed.map(item => `${item.name || item.employeeId}: ${item.message || 'บันทึกไม่สำเร็จ'}`).join(' · '));
                    return result.items;
                } catch (error) {
                    setAttendanceError(error?.message || 'เชื่อมต่อระบบเช็คชื่อไม่สำเร็จ กรุณาลองอีกครั้ง');
                    return null;
                } finally {
                    setAttendanceSavingType('');
                }
            }, [appApiCall, attendanceSavingType, driveUrl]);

            useEffect(() => {
                if ((viewMode === 'attendance' || viewMode === 'monitor') && currentUser) void loadAttendance();
            }, [viewMode, currentUser, loadAttendance]);
            useEffect(() => {
                if (viewMode !== 'monitor' || !currentUser) return undefined;
                const timer = setInterval(() => { if (!document.hidden) void loadAttendance(); }, 60000);
                return () => clearInterval(timer);
            }, [viewMode, currentUser, loadAttendance]);

            const persistPendingSync = useCallback((queue) => {
                const safeQueue = Array.isArray(queue) ? queue : [];
                pendingSyncRef.current = safeQueue;
                setPendingSyncCount(safeQueue.length);
                localStorage.setItem('pendingSync', JSON.stringify(safeQueue));
            }, []);

            const resetHistory = useCallback((state) => {
                const snapshot = Array.isArray(state) ? state : [];
                setHistory([snapshot]);
                setHistoryIndex(0);
            }, []);

            const flushPendingSync = useCallback(async () => {
                if (!driveUrl || syncInFlightRef.current || pendingSyncRef.current.length === 0) return;
                syncInFlightRef.current = true;
                setCloudStatus('syncing');
                try {
                    while (pendingSyncRef.current.length > 0) {
                        const operation = pendingSyncRef.current[0];
                        let res = null;
                        let lastError = 'unknown error';
                        for (let attempt = 0; attempt < 3; attempt++) {
                            try {
                                res = await appApiCall(driveUrl, 'updateEmployees', operation);
                                lastError = res?.message || res?.error || lastError;
                            } catch (error) {
                                lastError = error?.message || String(error);
                            }

                            if (res?.status === 'success' || res?.status === 'conflict') break;
                            const retryable = !res || /server busy|temporar|timeout|network|fetch/i.test(lastError);
                            if (!retryable || attempt >= 2) break;
                            await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
                        }

                        if (res?.status === 'conflict') {
                            setCloudStatus('conflict');
                            try {
                                const latest = await appApiCall(driveUrl, 'getData');
                                if (latest?.status === 'success' && Array.isArray(latest.data?.orgData)) {
                                    const latestData = normalizeEmployees(latest.data.orgData);
                                    setEmployees(latestData);
                                    localStorage.setItem('orgData', JSON.stringify(latestData));
                                    resetHistory(latestData);
                                    persistPendingSync([]);
                                    setCloudStatus('online');
                                    alert((res.message || 'ข้อมูลถูกแก้ไขโดยผู้ใช้อื่นแล้ว') + '\nระบบโหลดข้อมูลล่าสุดให้แล้ว รายการที่ค้างถูกยกเลิก กรุณาตรวจสอบและบันทึกใหม่');
                                } else {
                                    setCloudStatus('error');
                                    alert((res.message || 'ข้อมูลถูกแก้ไขโดยผู้ใช้อื่นแล้ว') + '\nไม่สามารถโหลดข้อมูลล่าสุดได้ กรุณากด Retry หรือรีเฟรชหน้าเว็บ');
                                }
                            } catch (e) {
                                setCloudStatus('error');
                                alert('เกิด Conflict แต่โหลดข้อมูลล่าสุดไม่สำเร็จ กรุณากด Retry อีกครั้ง');
                            }
                            return;
                        }

                        if (res?.status !== 'success') {
                            setCloudStatus('error');
                            alert('บันทึก Cloud ไม่สำเร็จ: ' + lastError + '\nข้อมูลยังค้างอยู่ในเครื่อง ระบบจะให้กด Retry เพื่อบันทึกอีกครั้ง');
                            return;
                        }

                        persistPendingSync(pendingSyncRef.current.slice(1));
                    }

                    if (pendingSyncRef.current.length === 0) setCloudStatus('online');
                } catch (e) {
                    setCloudStatus('error');
                    alert('บันทึก Cloud ไม่สำเร็จ: ' + (e?.message || String(e)) + '\nข้อมูลยังค้างอยู่ในเครื่อง กด Retry เมื่อเชื่อมต่อได้');
                } finally {
                    syncInFlightRef.current = false;
                }
            }, [driveUrl, appApiCall, persistPendingSync, resetHistory]);

            const queueSync = useCallback((updates = [], deletes = [], baseVersions = {}, renames = []) => {
                if (!driveUrl) return;
                const operation = { updates, deletes, baseVersions, renames };
                persistPendingSync([...pendingSyncRef.current, operation]);
                return flushPendingSync();
            }, [driveUrl, persistPendingSync, flushPendingSync]);
            
            // [FIXED] Logic การโหลดข้อมูล: รอให้โหลดเสร็จก่อนค่อยพร้อมใช้งาน (กันจอขาว)
            useEffect(() => {
                if (currentUser) {
                    setIsDataReady(false);
                    const rawLocalData = safeLocalLoad('orgData', null);
                    const localData = Array.isArray(rawLocalData) ? normalizeEmployees(rawLocalData) : null;
                    if (localData) {
                        setEmployees(localData);
                        resetHistory(localData);
                        setIsDataReady(true);
                    }

                    if (driveUrl) {
                        appApiCall(driveUrl, 'getData').then(res => {
                            if (res?.status === 'success' && res.data) {
                                // Keep local edits when there is an unsent queue; otherwise cloud is authoritative.
                                if (pendingSyncRef.current.length === 0 && Array.isArray(res.data.orgData)) {
                                    const cloudData = normalizeEmployees(res.data.orgData);
                                    setEmployees(cloudData);
                                    localStorage.setItem('orgData', JSON.stringify(cloudData));
                                    resetHistory(cloudData);
                                }
                                if (Array.isArray(res.data.orgPositions)) { setPositions(res.data.orgPositions); localStorage.setItem('orgPositions', JSON.stringify(res.data.orgPositions)); }
                                if (Array.isArray(res.data.orgDepartments)) { setDepartments(res.data.orgDepartments); localStorage.setItem('orgDepartments', JSON.stringify(res.data.orgDepartments)); }
                                const catalogEmployees = pendingSyncRef.current.length === 0 && Array.isArray(res.data.orgData) ? normalizeEmployees(res.data.orgData) : normalizeEmployees(safeLocalLoad('orgData', []));
                                const catalog = normalizeSubDepartmentCatalog(res.data.orgSubDepartments, catalogEmployees);
                                setSubDepartments(catalog);
                                localStorage.setItem('orgSubDepartments', JSON.stringify(catalog));
                                setCloudStatus('online');
                            }
                            setIsDataReady(true);
                            if (pendingSyncRef.current.length > 0) void flushPendingSync();
                        }).catch(() => {
                            setIsDataReady(true);
                            if (pendingSyncRef.current.length > 0) setCloudStatus('error');
                        });
                    } else {
                        setIsDataReady(true);
                    }
                }
            }, [driveUrl, currentUser, appApiCall, resetHistory, flushPendingSync]);

            useEffect(() => { localStorage.setItem('orgData', JSON.stringify(employees)); }, [employees]);
            useEffect(() => { try { localStorage.setItem('driveUrl', JSON.stringify(driveUrl)); } catch (e) {} }, [driveUrl]);
            useEffect(() => { setDeptName(currentDept + " DEPT"); }, [currentDept]);
            
            const pushToHistory = useCallback((nextState) => {
                const newHistory = history.slice(0, historyIndex + 1);
                newHistory.push(nextState);
                if (newHistory.length > 10) newHistory.shift();
                setHistory(newHistory);
                setHistoryIndex(newHistory.length - 1);
            }, [history, historyIndex]);

            const buildEmployeeDelta = useCallback((fromState, toState) => {
                const fromMap = new Map((Array.isArray(fromState) ? fromState : []).map(item => [String(item.id), item]));
                const toMap = new Map((Array.isArray(toState) ? toState : []).map(item => [String(item.id), item]));
                const updates = [];
                const deletes = [];
                const baseVersions = {};

                toMap.forEach((target, id) => {
                    const current = fromMap.get(id);
                    if (!current || JSON.stringify(current) !== JSON.stringify(target)) {
                        updates.push(target);
                        baseVersions[id] = current ? (current.lastModified || null) : null;
                    }
                });
                fromMap.forEach((current, id) => {
                    if (!toMap.has(id)) {
                        deletes.push(id);
                        baseVersions[id] = current.lastModified || null;
                    }
                });
                return { updates, deletes, baseVersions };
            }, []);

            const handleUndo = useCallback(() => {
                if (historyIndex <= 0) return;
                const targetState = history[historyIndex - 1];
                const delta = buildEmployeeDelta(employees, targetState);
                const timestamp = new Date().toISOString();
                const stampedUpdates = delta.updates.map(item => ({ ...item, lastModified: timestamp }));
                const finalState = targetState.map(item => {
                    const update = stampedUpdates.find(candidate => String(candidate.id) === String(item.id));
                    return update || item;
                });
                setEmployees(finalState);
                setHistoryIndex(historyIndex - 1);
                localStorage.setItem('orgData', JSON.stringify(finalState));
                if (stampedUpdates.length > 0 || delta.deletes.length > 0) {
                    queueSync(stampedUpdates, delta.deletes, delta.baseVersions, []);
                }
            }, [historyIndex, history, employees, buildEmployeeDelta, queueSync]);

            const updateStateFull = useCallback((newState, updates = [], deletes = [], baseVersions = {}, renames = []) => {
                const resolvedBaseVersions = { ...baseVersions };
                const captureBaseVersion = (id) => {
                    const key = String(id);
                    if (!Object.prototype.hasOwnProperty.call(resolvedBaseVersions, key)) {
                        const current = employees.find(e => String(e.id) === key);
                        resolvedBaseVersions[key] = current ? (current.lastModified || null) : null;
                    }
                };
                updates.forEach(u => u && u.id !== null && u.id !== undefined && captureBaseVersion(u.id));
                deletes.forEach(captureBaseVersion);
                renames.forEach(rename => {
                    if (rename && rename.fromId !== null && rename.fromId !== undefined) captureBaseVersion(rename.fromId);
                });

                // [NEW] Add Timestamps
                const timestamp = new Date().toISOString();
                const stampedUpdates = updates.map(u => ({ ...u, lastModified: timestamp }));
                
                const finalState = newState.map(e => {
                    const up = stampedUpdates.find(u => String(u.id) === String(e.id));
                    return up ? up : e;
                });

                pushToHistory(finalState);
                setEmployees(finalState);
                if (stampedUpdates.length > 0 || deletes.length > 0) queueSync(stampedUpdates, deletes, resolvedBaseVersions, renames);
            }, [employees, pushToHistory, queueSync]);
            
            // [V15 NEW] Unified Admin Actions
            const saveSettingsToCloud = (payload) => {
                if (!driveUrl) return;
                appApiCall(driveUrl, 'saveData', payload)
                    .then(res => { if (res?.status !== 'success') alert('บันทึกการตั้งค่าลง Cloud ไม่สำเร็จ: ' + (res?.message || res?.error || 'unknown error')); })
                    .catch(e => alert('บันทึกการตั้งค่าลง Cloud ไม่สำเร็จ: ' + (e?.message || e)));
            };

            const handleAddDept = (rawDept) => {
                const dept = String(rawDept || '').trim();
                if (!dept) return;
                if (departments.some(d => d.toLowerCase() === dept.toLowerCase()) || dept.toUpperCase() === 'ALL') return alert(`แผนก "${dept}" มีอยู่แล้ว`);
                const newDepts = [...departments, dept];
                setDepartments(newDepts);
                localStorage.setItem('orgDepartments', JSON.stringify(newDepts));
                saveSettingsToCloud({orgDepartments: newDepts});
            };

            const handleDeleteDept = (dept) => {
                const count = employees.filter(e => e.dept === dept).length;
                if (!confirm(count > 0 ? `แผนก "${dept}" ยังมีพนักงาน ${count} คน (จะดูได้เฉพาะใน ALL DEPTS)\nยืนยันลบแผนก?` : `ยืนยันลบแผนก "${dept}"?`)) return;

                    const currentIndex = roots.findIndex(e => e.id === id);
                    if (currentIndex === -1) return;

                    let newIndex = currentIndex + offset;
                    if (newIndex < 0) newIndex = 0;
                    if (newIndex >= roots.length) newIndex = roots.length - 1;
                    if (newIndex === currentIndex) return;

                    // Swap mechanism
                    const itemToMove = roots[currentIndex];
                    roots.splice(currentIndex, 1);
                    roots.splice(newIndex, 0, itemToMove);

                    // Re-assign order based on new array position
                    const updates = roots.map((root, index) => ({ ...root, order: index + 1 }));
                    
                    // Merge updates
                    const newData = employees.map(e => {
                        const updatedRoot = updates.find(u => u.id === e.id);

                    updateStateFull(newData, updates, []);

                const siblings = employees.filter(e => e.reportsTo === target.reportsTo).sort((a, b) => { const orderA = a.order || 0; const orderB = b.order || 0; if (orderA !== orderB) return orderA - orderB; return String(a.id ?? "").localeCompare(String(b.id ?? "")); });
                const currentIndex = siblings.findIndex(e => e.id === id); if (currentIndex === -1) return;
                let newIndex = currentIndex + offset; if (newIndex < 0) newIndex = 0; if (newIndex >= siblings.length) newIndex = siblings.length - 1; if (newIndex === currentIndex) return;
                const itemToMove = siblings[currentIndex]; siblings.splice(currentIndex, 1); siblings.splice(newIndex, 0, itemToMove);
                const updates = siblings.map((sib, index) => ({ ...sib, order: index + 1 }));
                const newData = employees.map(e => { const updatedSibling = updates.find(u => u.id === e.id); return updatedSibling ? updatedSibling : e; });

                    const roots = employees

                // 2. Setup Context

                const isNew = !originalId || !employees.some(e => String(e.id) === String(originalId)); // Check if we are editing an existing record
                const existingEmployee = isNew ? null : employees.find(e => String(e.id) === String(originalId));
                if (isResignedEmployee(data)) {
                    if (!isResignedEmployee(existingEmployee)) {
                        data.exitDate = data.exitDate || getLocalDateValue();

                        data.exitSubDept = data.subDept || '';

                    }
                }
                if (data.reportsTo && data.reportsTo !== 'STAGING' && (String(data.reportsTo) === data.id || (!isNew && isInChainAbove(employees, originalId, data.reportsTo)))) {
                    alert("Error: ไม่สามารถให้พนักงานรายงานต่อตัวเองหรือลูกทีมของตัวเองได้");
                    return;
                }
                const idChanged = !isNew && String(originalId) !== String(data.id);

                // 3. Validation: Duplicate Check
                // If ID exists AND it's not the current record we are editing -> Duplicate!
                const isDuplicate = employees.some(e => String(e.id) === String(data.id) && String(e.id) !== String(originalId));
                if (isDuplicate) {
                    alert("Error: ID " + data.id + " already exists!");
                    return;
                }

                let updates = [data];
                let allEmployeesCopy = [...employees];

                // 4. Cascading Update (If ID Changed)
                if (idChanged) {
                    // Find all subordinates who report to the OLD ID
                    const subordinates = allEmployeesCopy.filter(e => String(e.reportsTo) === String(originalId));
                    
                    // Update them to report to the NEW ID
                    subordinates.forEach(sub => {
                        const updatedSub = { ...sub, reportsTo: data.id };
                        updates.push(updatedSub); // Add to updates list
                    });
                }

                // 5. Merge Data

                    // If this is the record being edited (match by OLD ID)
                    if (!isNew && String(e.id) === String(originalId)) return data;
                    
                    // If this is a subordinate that got updated
