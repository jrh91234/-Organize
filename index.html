<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;
        const attendanceLibraryLoads = {};
        const loadAttendanceLibrary = (globalName, url) => {
            if (window[globalName]) return Promise.resolve(window[globalName]);
            if (attendanceLibraryLoads[globalName]) return attendanceLibraryLoads[globalName];
            attendanceLibraryLoads[globalName] = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.async = true;
                const fail = message => {
                    delete attendanceLibraryLoads[globalName];
                    script.remove();
                    reject(new Error(message));
                };
                script.onload = () => window[globalName] ? resolve(window[globalName]) : fail('Attendance library did not load');
                script.onerror = () => fail('Attendance library request failed');
                document.head.appendChild(script);
            });
            return attendanceLibraryLoads[globalName];
        };

        // *** CONSTANTS ***
        const THEMES = { blue: { name: 'Blue', lv0: 'bg-blue-100 border-blue-600', lv1: 'bg-blue-50 border-blue-400', lvN: 'bg-white border-blue-200' }, teal: { name: 'Teal', lv0: 'bg-teal-100 border-teal-600', lv1: 'bg-teal-50 border-teal-400', lvN: 'bg-white border-teal-200' }, indigo: { name: 'Indigo', lv0: 'bg-indigo-100 border-indigo-600', lv1: 'bg-indigo-50 border-indigo-400', lvN: 'bg-white border-indigo-200' }, rose: { name: 'Rose', lv0: 'bg-rose-100 border-rose-600', lv1: 'bg-rose-50 border-rose-400', lvN: 'bg-white border-rose-200' }, slate: { name: 'Slate', lv0: 'bg-slate-200 border-slate-600', lv1: 'bg-slate-100 border-slate-400', lvN: 'bg-white border-slate-300' }, orange: { name: 'Orange', lv0: 'bg-orange-100 border-orange-600', lv1: 'bg-orange-50 border-orange-400', lvN: 'bg-white border-orange-200' } };
        const SHAPES = { rounded: { name: 'Rounded', cls: 'rounded-xl' }, sharp: { name: 'Square', cls: 'rounded-none' }, pill: { name: 'Pill', cls: 'rounded-[2rem]' }, leaf: { name: 'Leaf', cls: 'rounded-tr-3xl rounded-bl-3xl rounded-tl-md rounded-br-md' } };

        // --- Utils ---
        const formatDriveUrl = (url) => { if (!url) return "https://placehold.co/100x100?text=No+Img"; if (url.includes('drive.google.com') || url.includes('docs.google.com')) { let id = null; const idMatch1 = url.match(/id=([a-zA-Z0-9_-]+)/); if (idMatch1) id = idMatch1[1]; else { const idMatch2 = url.match(/\/d\/([a-zA-Z0-9_-]+)/); if (idMatch2) id = idMatch2[1]; } if (id) return `https://lh3.googleusercontent.com/d/${id}`; } return url; };
        const compressImage = (file, targetSizeKB = 512) => { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = (event) => { const img = new Image(); img.src = event.target.result; img.onload = () => { const canvas = document.createElement('canvas'); let width = img.width, height = img.height; const MAX = 1600; if (width > MAX || height > MAX) { if (width > height) { height *= MAX / width; width = MAX; } else { width *= MAX / height; height = MAX; } } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); let quality = 0.9, dataUrl = canvas.toDataURL('image/jpeg', quality); while (dataUrl.length * 0.75 > targetSizeKB * 1024 && quality > 0.1) { quality -= 0.1; dataUrl = canvas.toDataURL('image/jpeg', quality); } resolve(dataUrl); }; img.onerror = reject; }; reader.onerror = reject; }); };
        const formatDate = (dateString) => { if (!dateString) return ""; const date = new Date(dateString); if (isNaN(date.getTime())) return dateString; return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }); };
        const formatDateTime = (dateString) => { if (!dateString) return "-"; const date = new Date(dateString); if (isNaN(date.getTime())) return "-"; return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }); };
        const getLocalDateValue = () => { const date = new Date(); const offset = date.getTimezoneOffset() * 60000; return new Date(date.getTime() - offset).toISOString().slice(0, 10); };
        const isResignedEmployee = (employee) => String(employee?.status || '').trim().toLowerCase() === 'resigned';
        const calculateTenure = (dateString) => { if (!dateString) return ""; const start = new Date(dateString); const now = new Date(); if (isNaN(start.getTime())) return ""; let years = now.getFullYear() - start.getFullYear(); let months = now.getMonth() - start.getMonth(); if (months < 0 || (months === 0 && now.getDate() < start.getDate())) { years--; months += 12; } if (years < 0) return "New"; return `${years} ปี ${months} ด.`; };
        const safeLocalLoad = (key, fallback) => { try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : fallback; } catch (e) { console.warn(`Error loading ${key}, using fallback.`, e); return fallback; } };
        // Imported/cloud data may carry numeric IDs; the UI compares IDs with ===, so keep them as strings.
        const normalizeEmployees = (list) => (Array.isArray(list) ? list : []).filter(e => e && typeof e === 'object').map(e => ({
            ...e,
            id: e.id === null || e.id === undefined ? e.id : String(e.id),
            reportsTo: e.reportsTo === null || e.reportsTo === undefined ? e.reportsTo : String(e.reportsTo),
            subDept: String(e.subDept || '').trim(),
            shift: ['A', 'B'].includes(String(e.shift || '').trim().toUpperCase()) ? String(e.shift).trim().toUpperCase() : ''
        }));
        const isSubcontractEmployee = (employee) => String(employee?.type || '').trim().toLowerCase().replace(/[\s_-]/g, '').startsWith('subcontract');
        // Everyone under an employee (all levels, resigned excluded), split into regular staff and subcontract.
        const countTeamMembers = (allEmployees, rootId) => {
            const seen = new Set([rootId]);
            const queue = [rootId];
            let subcontract = 0;
            let total = 0;
            for (let cursor = 0; cursor < queue.length; cursor++) {
                allEmployees.forEach(member => {
                    if (member.reportsTo !== queue[cursor] || seen.has(member.id)) return;
                    seen.add(member.id);
                    queue.push(member.id);
                    if (isResignedEmployee(member)) return;
                    total++;
                    if (isSubcontractEmployee(member)) subcontract++;
                });
            }
            return { total, subcontract, regular: total - subcontract };
        };
        // A person counts as having a Job Description when either language is filled in (Thai: jobDescriptionTh, English: jobDescription).
        const hasJobDescription = (employee) => Boolean(String(employee?.jobDescription || '').trim() || String(employee?.jobDescriptionTh || '').trim());
        // One A4 page per person: photo + details, the Thai and English text, and signature lines (printed through html2canvas so Thai renders with the browser font).
        // `photos` maps employee id -> image src (data URL or URL); people without an entry get no photo.
        const buildJobDescriptionPagesHtml = (rows, printedOn, photos = new Map()) => {
            const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const detail = (label, value) => `<tr><td style="padding:3px 18px 3px 0;color:#6b7280;white-space:nowrap;width:190px">${label}</td><td style="padding:3px 0;font-weight:600">${esc(value) || '-'}</td></tr>`;
            const box = (title, text) => String(text || '').trim() ? `
                <div style="font-size:13px;font-weight:700;margin:0 0 6px">${title}</div>
                <div style="white-space:pre-wrap;font-size:14px;line-height:1.65;border:1px solid #d1d5db;border-radius:8px;padding:12px 16px;margin-bottom:14px;flex:1 1 0">${esc(String(text).trim())}</div>` : '';
            return rows.map(r => {
                const photo = photos.get(r.id);
                return `
                <section style="box-sizing:border-box;display:flex;flex-direction:column;min-height:1050px;padding:8px 6px 0">
                    <div style="border-bottom:2px solid #1f2937;padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end">
                        <div><h1 style="margin:0;font-size:24px;font-weight:700">Job Description</h1><div style="font-size:13px;color:#4b5563">ใบกำหนดหน้าที่และความรับผิดชอบ</div></div>
                        <span style="font-size:12px;color:#6b7280">${esc(printedOn)}</span>
                    </div>
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px">
                        <table style="border-collapse:collapse;font-size:14px">
                            ${detail('ชื่อ / Name', r.name)}${detail('รหัสพนักงาน / Employee ID', r.id)}${detail('ตำแหน่ง / Position', r.position)}${detail('แผนก / Department', [r.dept, r.subDept].filter(Boolean).join(' / '))}${detail('รายงานต่อ / Reports to', r.reportsToName)}
                        </table>
                        ${photo ? `<img src="${esc(photo)}" referrerpolicy="no-referrer" style="width:104px;height:104px;border-radius:50%;object-fit:cover;flex:none" alt="">` : ''}
                    </div>
                    ${box('หน้าที่และความรับผิดชอบ', r.jobDescriptionTh)}${box('Duties and Responsibilities', r.jobDescription)}
                    <div style="display:flex;gap:56px;margin:42px 0 24px;font-size:13px">
                        <div style="flex:1;border-top:1px solid #111827;padding-top:6px;text-align:center">พนักงาน / Employee (${esc(r.name)})<br><span style="color:#6b7280">วันที่ / Date ____ / ____ / ________</span></div>
                        <div style="flex:1;border-top:1px solid #111827;padding-top:6px;text-align:center">หัวหน้างาน / Supervisor${r.reportsToName ? ` (${esc(r.reportsToName)})` : ''}<br><span style="color:#6b7280">วันที่ / Date ____ / ____ / ________</span></div>
                    </div>
                </section>`;
            }).join('');
        };
        // Flatten the org chart depth-first (same child order as the chart) into rows for the Excel export.
        const buildOrgChartRows = (employees, rootEmployees) => {
            const nameById = new Map(employees.map(e => [e.id, e.name]));
            const rows = [];
            const walk = (employee, level, visited) => {
                if (visited.has(employee.id)) return;
                const seen = new Set(visited).add(employee.id);
                const team = countTeamMembers(employees, employee.id);
                rows.push({
                    level,
                    id: employee.id,
                    name: employee.name || '',
                    position: employee.position || '',
                    dept: employee.dept || '',
                    subDept: employee.subDept || '',
                    shift: employee.shift || '',
                    type: employee.type || '',
                    company: employee.company || '',
                    reportsToId: employee.reportsTo && employee.reportsTo !== 'STAGING' ? employee.reportsTo : '',
                    reportsToName: nameById.get(employee.reportsTo) || '',
                    phone: employee.showPhone && employee.phone ? employee.phone : '',
                    startDate: employee.startDate || '',
                    teamTotal: team.total,
                    teamRegular: team.regular,
                    teamSubcontract: team.subcontract,
                    jobDescription: employee.jobDescription || '',
                    jobDescriptionTh: employee.jobDescriptionTh || '',
                    image: employee.image || ''
                });
                employees.filter(e => e.reportsTo === employee.id).sort(compareEmployeeCategoryOrder).forEach(child => walk(child, level + 1, seen));
            };
            rootEmployees.forEach(root => walk(root, 0, new Set()));
            return rows;
        };
        // ---- Excel org chart: lays the chart out on a cell grid (each card = 12 rows x 1 "unit" of 3 columns) ----
        const ORG_PHOTO_ROWS = 4;
        const ORG_CARD_ROWS = 12;
        const ORG_GAP_ROWS = 2;
        const TW_HEX = {
            blue: { 50: 'EFF6FF', 100: 'DBEAFE', 200: 'BFDBFE', 400: '60A5FA', 600: '2563EB' },
            teal: { 50: 'F0FDFA', 100: 'CCFBF1', 200: '99F6E4', 400: '2DD4BF', 600: '0D9488' },
            indigo: { 50: 'EEF2FF', 100: 'E0E7FF', 200: 'C7D2FE', 400: '818CF8', 600: '4F46E5' },
            rose: { 50: 'FFF1F2', 100: 'FFE4E6', 200: 'FECDD3', 400: 'FB7185', 600: 'E11D48' },
            slate: { 50: 'F8FAFC', 100: 'F1F5F9', 200: 'E2E8F0', 300: 'CBD5E1', 400: '94A3B8', 600: '475569' },
            orange: { 50: 'FFF7ED', 100: 'FFEDD5', 200: 'FED7AA', 400: 'FB923C', 600: 'EA580C' },
            gray: { 200: 'E5E7EB', 300: 'D1D5DB' }
        };
        // 'bg-blue-100' / 'border-blue-600' -> 'FFDBEAFE' (ARGB for ExcelJS)
        const tailwindArgb = (className, fallback) => {
            const match = /^(?:bg|border)-([a-z]+)-(\d+)$/.exec(className || '');
            const hex = match && TW_HEX[match[1]] && TW_HEX[match[1]][match[2]];
            return `FF${hex || fallback}`;
        };
        // Photo -> 96px circle with a white ring and a thin outline (transparent corners), as a PNG data URL for the Excel chart.
        const circlePhotoDataUrl = (src) => new Promise((resolve, reject) => {
            const probe = new Image();
            probe.crossOrigin = 'anonymous';
            probe.referrerPolicy = 'no-referrer';
            const timer = setTimeout(() => reject(new Error('photo timeout')), 8000);
            probe.onload = () => {
                clearTimeout(timer);
                try {
                    const size = 96;
                    const ring = 5;
                    const canvas = document.createElement('canvas');
                    canvas.width = canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const crop = Math.min(probe.naturalWidth, probe.naturalHeight);
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2 - 1, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#d1d5db';
                    ctx.stroke();
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2 - 1 - ring, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(probe, (probe.naturalWidth - crop) / 2, (probe.naturalHeight - crop) / 2, crop, crop, ring, ring, size - ring * 2, size - ring * 2);
                    ctx.restore();
                    resolve(canvas.toDataURL('image/png'));
                } catch (error) { reject(error); }
            };
            probe.onerror = () => { clearTimeout(timer); reject(new Error('photo failed')); };
            probe.src = src;
        });
        const buildOrgChartLayout = (employees, rootEmployees) => {
            const measure = (employee, visited) => {
                if (visited.has(employee.id)) return null;
                const seen = new Set(visited).add(employee.id);
                const kids = employees.filter(e => e.reportsTo === employee.id && !seen.has(e.id)).sort(compareEmployeeCategoryOrder).map(kid => measure(kid, seen)).filter(Boolean);
                const node = { employee, kids, w: 1, h: ORG_CARD_ROWS, cols: 1, colW: [], rowH: [] };
                if (kids.length) {
                    // Leaders show their team in a grid (gridCols wide); everyone else spreads the team in one row.
                    const isGrid = String(employee.position || '').toLowerCase().includes('leader');
                    const wanted = Number(employee.gridCols) > 0 ? Number(employee.gridCols) : kids.length;
                    node.cols = isGrid ? Math.min(wanted, kids.length) : kids.length;
                    const rows = Math.ceil(kids.length / node.cols);
                    node.colW = Array(node.cols).fill(1);
                    node.rowH = Array(rows).fill(ORG_CARD_ROWS);
                    kids.forEach((kid, i) => {
                        const c = i % node.cols;
                        const r = Math.floor(i / node.cols);
                        node.colW[c] = Math.max(node.colW[c], kid.w);
                        node.rowH[r] = Math.max(node.rowH[r], kid.h);
                    });
                    node.w = node.colW.reduce((a, b) => a + b, 0);
                    node.h = ORG_CARD_ROWS + ORG_GAP_ROWS + node.rowH.reduce((a, b) => a + b, 0) + (rows - 1);
                }
                return node;
            };
            const cards = [];
            const vlines = [];
            const bars = [];
            const place = (node, u0, r0, level) => {
                const top = r0 + ORG_CARD_ROWS + ORG_GAP_ROWS;
                const firstRowCx = [];
                node.kids.forEach((kid, i) => {
                    const c = i % node.cols;
                    const r = Math.floor(i / node.cols);
                    let x = u0 + Math.floor((node.colW[c] - kid.w) / 2);
                    for (let k = 0; k < c; k++) x += node.colW[k];
                    let y = top + r;
                    for (let k = 0; k < r; k++) y += node.rowH[k];
                    place(kid, x, y, level + 1);
                    if (r === 0) firstRowCx.push(kid.cx);
                    else vlines.push({ unit: kid.cx, row: y - 1 });
                });
                if (firstRowCx.length) {
                    const min = Math.min(...firstRowCx);
                    const max = Math.max(...firstRowCx);
                    node.cx = Math.floor((min + max) / 2);
                    vlines.push({ unit: node.cx, row: top - 2 });
                    firstRowCx.forEach(cx => vlines.push({ unit: cx, row: top - 1 }));
                    if (max > min) bars.push({ from: min, to: max, row: top - 2 });
                } else {
                    node.cx = u0;
                }
                cards.push({ employee: node.employee, unit: node.cx, row: r0, level, team: node.kids.length ? countTeamMembers(employees, node.employee.id) : null });
            };
            let unit = 0;
            let rows = 0;
            rootEmployees.forEach(root => {
                const node = measure(root, new Set());
                if (!node) return;
                place(node, unit, 0, 0);
                unit += node.w + 1;
                rows = Math.max(rows, node.h);
            });
            return { cards, vlines, bars, units: Math.max(unit - 1, 1), rows };
        };
        const renderOrgChartSheet = (sheet, layout, theme, title, photoIds = new Map()) => {
            const COL0 = 2;
            const ROW0 = 3;
            const colL = unit => COL0 + unit * 3;
            const colR = unit => colL(unit) + 1;
            const lineStyle = { style: 'thin', color: { argb: 'FF9CA3AF' } };
            const FONT = 'Tahoma';
            sheet.getColumn(1).width = 2;
            for (let u = 0; u < layout.units; u++) {
                sheet.getColumn(colL(u)).width = 13;
                sheet.getColumn(colR(u)).width = 13;
                sheet.getColumn(colL(u) + 2).width = 2.5;
            }

        };
        const Ruler = ({ orientation = 'horizontal', length = 3000 }) => { const pxPerMm = 3.7795; const paperSizes = [ { name: 'A4', w: 210, h: 297 }, { name: 'A3', w: 297, h: 420 }, { name: 'A2', w: 420, h: 594 }, { name: 'A1', w: 594, h: 841 }, { name: 'A0', w: 841, h: 1189 } ];
            const ticks = []; for (let i = 0; i <= length / pxPerMm; i += 10) { ticks.push( <div key={i} className="absolute bg-gray-400" style={orientation==='horizontal'?{left:`${i*pxPerMm}px`,height:'6px',width:'1px',bottom:0}:{top:`${i*pxPerMm}px`,width:'6px',height:'1px',right:0}}> <span className="absolute text-[8px] text-gray-500 font-mono" style={orientation==='horizontal'?{left:'2px',bottom:'8px'}:{top:'2px',right:'8px'}}>{i}</span> </div> ); } const markers = []; paperSizes.forEach(size => { if (orientation === 'horizontal') { markers.push(<div key={`w-${size.name}`} className="paper-marker" style={{left: `${size.h * pxPerMm}px`, top: '2px'}}>{size.name}</div>); markers.push(<div key={`l-${size.name}`} className="paper-line" style={{left: `${size.h * pxPerMm}px`, height: '2000px', top: '30px', width: '0px'}}></div>); } else { markers.push(<div key={`h-${size.name}`} className="paper-marker" style={{top: `${size.w * pxPerMm}px`, left: '2px', transform: 'rotate(-90deg)'}}>{size.name}</div>); markers.push(<div key={`vl-${size.name}`} className="paper-line" style={{top: `${size.w * pxPerMm}px`, width: '2000px', left: '30px', height: '0px'}}></div>); } });

        // [FIXED] SummaryDashboard with Department Updates
        // Permanent : Subcontract as whole percents that always add up to 100.
        const formatSplitPercent = (perm, sub) => {
            const total = perm + sub;
            if (total <= 0) return '-';
            const permPct = Math.round((perm / total) * 100);
            return `${permPct}% : ${100 - permPct}%`;
        };

        // Shared by the Dashboard modal and the PDF export so both always show the same numbers.
        const computeDashboardStats = (employees, activeTab) => {
                try {
                    const safeEmps = Array.isArray(employees) ? employees : [];
                    const targetEmps = activeTab === 'Overview' ? safeEmps : safeEmps.filter(e => e.dept === activeTab);
                    
                    const total = targetEmps.length;
                    const byType = { Permanent: 0, Subcontract: 0 };
                    const byPosition = {};
                    let totalYears = 0; let countTenure = 0;
                    
                    // [V11] Ops Counters
                    let opsSub = 0;
                    let opsPerm = 0;

                    targetEmps.forEach(e => {
                        if (e.type === 'Permanent') byType.Permanent++; 
                        else byType.Subcontract++;

                        const pos = e.position || "Unknown";
                        byPosition[pos] = (byPosition[pos] || 0) + 1;
                        
                        // [V11] Calculate Operational Ratio (Rank < 3)
                        const rank = getPositionRank(e.position);
                        if (rank < 3) { 
                            if (e.type === 'Subcontract') opsSub++;
                            else opsPerm++;
                        }

                        if (e.startDate) {
                            const start = new Date(e.startDate);
                            if (!isNaN(start.getTime())) {
                                const now = new Date();
                                const diffTime = Math.abs(now - start);
                                const diffYears = diffTime / (1000 * 60 * 60 * 24 * 365);
                                totalYears += diffYears;
                                countTenure++;
                            }
                        }
                    });

                    const avgTenure = countTenure > 0 ? (totalYears / countTenure).toFixed(1) : 0;

                    // [V11] Ratio Formatting
                    const totalOps = opsSub + opsPerm;
                    const opsRatio = totalOps > 0 ? { pct: Math.round((opsSub / totalOps) * 100), sub: opsSub, perm: opsPerm } : null;

                    // Production = every leader plus everyone who reports (directly or indirectly) to one; everyone else is Support.
                    // Follow the reporting chain over all employees so a team is still found when the dashboard is filtered to one department.
                    const childrenOf = {};
                    safeEmps.forEach(e => { const m = String(e.reportsTo ?? ''); if (m) (childrenOf[m] = childrenOf[m] || []).push(e); });
                    const productionIds = new Set();
                    const pending = safeEmps.filter(e => (e.position || '').toLowerCase().includes('leader'));
                    while (pending.length) {
                        const e = pending.pop();
                        const id = String(e.id);
                        if (productionIds.has(id)) continue;
                        productionIds.add(id);
                        (childrenOf[id] || []).forEach(c => pending.push(c));
                    }
                    const makeGroup = () => ({ total: 0, perm: 0, sub: 0, positions: {} });
                    const groups = { production: makeGroup(), support: makeGroup() };
                    targetEmps.forEach(e => {
                        const g = productionIds.has(String(e.id)) ? groups.production : groups.support;
                        g.total++;
                        if (e.type === 'Permanent') g.perm++; else g.sub++;
                        const pos = e.position || 'Unknown';
                        g.positions[pos] = (g.positions[pos] || 0) + 1;
                    });

                    // Leader Team Summary
                    const leaderSummary = targetEmps
                        .filter(e => (e.position || '').toLowerCase().includes('leader'))
                        .map(leader => {
                            const members = targetEmps.filter(e => e.reportsTo === leader.id);
                            // Include the leader in their own team totals.
                            const teamMembers = [leader, ...members];
                            const perm = teamMembers.filter(e => e.type === 'Permanent').length;
                            const sub = teamMembers.filter(e => e.type === 'Subcontract').length;
                            return { id: leader.id, name: leader.name, position: leader.position, dept: leader.dept, total: teamMembers.length, perm, sub };
                        })
                        .sort((a, b) => b.total - a.total);

                    return { total, byType, byPosition, avgTenure, opsRatio, leaderSummary, groups };
                } catch (error) {
                    console.error("Dashboard calculation error:", error);
                    return { total: 0, byType: {Permanent:0, Subcontract:0}, byPosition: {}, avgTenure: 0, opsRatio: null, leaderSummary: [], groups: { production: { total: 0, perm: 0, sub: 0, positions: {} }, support: { total: 0, perm: 0, sub: 0, positions: {} } } };
                }
        };

                                    <p className="text-xs text-gray-500 mb-4">Production = every Leader and everyone reporting to a Leader. Everyone else is counted as Support.</p>
                                    <div className="flex h-3 overflow-hidden rounded-full bg-gray-100" role="img" aria-label={`Production ${stats.groups.production.total} people, Support ${stats.groups.support.total} people`}>
                                        {stats.groups.production.total > 0 && <div className="bg-blue-500" style={{ width: `${(stats.groups.production.total / stats.total) * 100}%` }}></div>}

                                    </div>
                                    <div className="mt-2 mb-5 flex flex-wrap gap-x-5 gap-y-1 text-xs text-gray-600">
                                        <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-blue-500"></span>Production <b>{stats.groups.production.total}</b> people ({Math.round((stats.groups.production.total / stats.total) * 100)}%)</span>
                                        <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-slate-400"></span>Support <b>{stats.groups.support.total}</b> people ({Math.round((stats.groups.support.total / stats.total) * 100)}%)</span>
                                    </div>
                                    <div className="grid grid-cols-1 gap-4 md:grid-cols-2">
                                        {[{ key: 'production', label: 'Production', sub: 'Leader and below', top: 'border-t-blue-500', text: 'text-blue-700' }, { key: 'support', label: 'Support', sub: 'Everyone outside Production', top: 'border-t-slate-400', text: 'text-slate-700' }].map(({ key, label, sub, top, text }) => {

        const EXIT_REASONS = { voluntary: 'ลาออกเอง (Voluntary)', terminated: 'เลิกจ้าง (Terminated)', contract_end: 'หมดสัญญา (Contract ended)', retired: 'เกษียณ (Retired)', other: 'อื่น ๆ (Other)' };

        // H1, Coil winding and Lug&Screw are shown as one combined sub-department in attendance views.
        const mergedSubDeptLabel = 'H1 / Coil winding / Lug&Screw';
        const mergedSubDeptNames = ['h1', 'coilwinding', 'lugscrew'];
        const attendanceSubDeptKey = value => {
            const name = String(value || '').trim();
            if (!name) return '__NO_SUB_DEPT__';
            return mergedSubDeptNames.includes(name.toLowerCase().replace(/[^a-z0-9]/g, '')) ? mergedSubDeptLabel : name;
        };

        // ---- Staff turnover ----
        const parseDay = (value) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : null; };
        const dayKey = (time) => { const d = new Date(time); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
        const DAY_MS = 86400000;
        const TENURE_BUCKETS = [['< 3 เดือน', 0, 3], ['3 – 6 เดือน', 3, 6], ['6 – 12 เดือน', 6, 12], ['1 – 3 ปี', 12, 36], ['3 ปีขึ้นไป', 36, Infinity]];
        // Who left, from which team and when, plus headcount-based turnover rates for [from, to] (day timestamps, inclusive).
        // Headcount on a day = people who had started and had not yet left (resigned people need an exit date to be counted).
        const computeTurnoverStats = (employees, { dept = 'ALL', team = 'ALL', from, to }) => {
            const all = (Array.isArray(employees) ? employees : []).filter(e => e && e.id !== null && e.id !== undefined && e.id !== '');
            const byId = new Map(all.map(e => [String(e.id), e]));
            const deptOf = (e) => isResignedEmployee(e) ? (e.exitDept || e.dept || '') : (e.dept || '');
            const teamOf = (e) => attendanceSubDeptKey(isResignedEmployee(e) ? (e.exitSubDept || e.subDept) : e.subDept);
            const people = all.filter(e => (dept === 'ALL' || deptOf(e) === dept) && (team === 'ALL' || teamOf(e) === team));
            const startOf = (e) => parseDay(e.startDate);
            const exitOf = (e) => isResignedEmployee(e) ? parseDay(e.exitDate) : null;
            const headcountAt = (group, time) => group.filter(e => {
                if (isResignedEmployee(e) && exitOf(e) === null) return false;
                const start = startOf(e);
                if (start !== null && start > time) return false;
                const exit = exitOf(e);
                return exit === null || exit > time;
            }).length;
            const leaversIn = (group, a, b) => group.filter(e => { const x = exitOf(e); return x !== null && x >= a && x <= b; });
            const rateFor = (group, a, b) => {
                const leavers = leaversIn(group, a, b).length;
                const avg = (headcountAt(group, a - DAY_MS) + headcountAt(group, b)) / 2;
                const days = Math.round((b - a) / DAY_MS) + 1;
                const rate = avg > 0 ? (leavers / avg) * 100 : 0;
                return { leavers, avgHeadcount: avg, rate, annualised: days > 0 ? rate * (365 / days) : 0 };
            };
            const leaverRows = leaversIn(people, from, to).map(e => {
                const start = startOf(e);
                const exit = exitOf(e);
                const months = start !== null ? Math.max(0, (exit - start) / (DAY_MS * 30.4375)) : null;
                const leaderRecord = e.reportsTo && e.reportsTo !== 'STAGING' ? byId.get(String(e.reportsTo)) : null;
                return {
                    id: String(e.id), name: e.name || '', position: e.exitPosition || e.position || '', dept: deptOf(e), team: teamOf(e),
                    leader: e.exitManagerName || leaderRecord?.name || '', type: isSubcontractEmployee(e) ? 'Subcontract' : 'Permanent', company: e.company || '',
                    startDate: e.startDate || '', exitDate: e.exitDate || '', exitTime: exit, months, reason: e.exitReason || '', note: e.exitNote || ''
                };
            }).sort((a, b) => b.exitTime - a.exitTime || a.name.localeCompare(b.name));
            const tally = (keyOf) => {
                const map = new Map();
                leaverRows.forEach(r => { const k = keyOf(r); map.set(k, (map.get(k) || 0) + 1); });
                return Array.from(map.entries()).map(([name, count]) => ({ name, count })).sort((x, y) => y.count - x.count || x.name.localeCompare(y.name));
            };
            const teams = Array.from(new Set(people.map(teamOf))).sort((a, b) => a.localeCompare(b)).map(name => {
                const group = people.filter(e => teamOf(e) === name);
                return { name: name === '__NO_SUB_DEPT__' ? 'ไม่ระบุแผนกย่อย' : name, headcount: headcountAt(group, to), ...rateFor(group, from, to) };
            }).filter(t => t.leavers > 0 || t.headcount > 0).sort((a, b) => b.leavers - a.leavers || b.headcount - a.headcount);
            // Monthly trend for the 12 months ending with the month of `to`.
            const trend = [];
            const end = new Date(to);
            for (let i = 11; i >= 0; i--) {
                const first = new Date(end.getFullYear(), end.getMonth() - i, 1).getTime();
                const last = Math.min(new Date(end.getFullYear(), end.getMonth() - i + 1, 0).getTime(), to);
                trend.push({ label: new Date(first).toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }), leavers: leaversIn(people, first, last).length, rate: rateFor(people, first, last).rate });
            }
            const known = leaverRows.filter(r => r.months !== null);
            return {
                ...rateFor(people, from, to),
                headcountNow: headcountAt(people, to),
                leaverRows,
                missingExitDate: people.filter(e => isResignedEmployee(e) && exitOf(e) === null).length,
                avgTenureMonths: known.length ? known.reduce((n, r) => n + r.months, 0) / known.length : null,
                byTeam: teams,
                byLeader: tally(r => r.leader || 'ไม่ทราบหัวหน้า'),
                byReason: tally(r => EXIT_REASONS[r.reason] || 'ไม่ระบุ'),
                byType: tally(r => r.type),
                byTenure: TENURE_BUCKETS.map(([name, lo, hi]) => ({ name, count: known.filter(r => r.months >= lo && r.months < hi).length })).concat([{ name: 'ไม่ทราบวันเริ่มงาน', count: leaverRows.length - known.length }]),
                trend,
                teamOptions: Array.from(new Set(all.filter(e => dept === 'ALL' || deptOf(e) === dept).map(teamOf))).sort((a, b) => a.localeCompare(b))
            };
        };

        const TurnoverDashboard = ({ employees, currentDept }) => {
            const [preset, setPreset] = useState('12m');
            const [customFrom, setCustomFrom] = useState('');
            const [customTo, setCustomTo] = useState('');
            const [team, setTeam] = useState('ALL');
            const [search, setSearch] = useState('');
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const range = (() => {
                if (preset === 'month') return [new Date(now.getFullYear(), now.getMonth(), 1).getTime(), today];
                if (preset === '3m') return [new Date(now.getFullYear(), now.getMonth() - 2, 1).getTime(), today];
                if (preset === 'ytd') return [new Date(now.getFullYear(), 0, 1).getTime(), today];
                if (preset === 'custom') { const a = parseDay(customFrom); const b = parseDay(customTo); return [a ?? new Date(now.getFullYear(), 0, 1).getTime(), b ?? today]; }
                return [new Date(now.getFullYear(), now.getMonth() - 11, 1).getTime(), today];
            })();
            const [from, to] = range[0] <= range[1] ? range : [range[1], range[0]];
            const stats = computeTurnoverStats(employees, { dept: currentDept, team, from, to });
            const query = search.trim().toLowerCase();
            const rows = stats.leaverRows.filter(r => !query || `${r.name} ${r.id} ${r.position} ${r.team} ${r.leader}`.toLowerCase().includes(query));
            const pct = (v) => `${(Math.round(v * 10) / 10).toFixed(1)}%`;
            const tenureText = (months) => months === null ? '-' : months < 12 ? `${Math.round(months)} เดือน` : `${Math.floor(months / 12)} ปี ${Math.round(months % 12)} เดือน`;
            const maxTrend = Math.max(1, ...stats.trend.map(t => t.leavers));
            const presets = [['month', 'เดือนนี้'], ['3m', '3 เดือน'], ['ytd', 'ตั้งแต่ต้นปี'], ['12m', '12 เดือน'], ['custom', 'กำหนดเอง']];
            const BarList = ({ title, items }) => {
                const top = Math.max(1, ...items.map(i => i.count));
                return (
                    <div className="rounded-2xl border bg-white p-4 shadow-sm">
                        <h3 className="mb-3 text-sm font-bold text-gray-800">{title}</h3>
                        {items.every(i => i.count === 0) ? <p className="text-xs text-gray-400">ไม่มีข้อมูล</p> : items.filter(i => i.count > 0).map(i => (
                            <div key={i.name} className="mb-2">
                                <div className="flex justify-between text-xs"><span className="truncate pr-2 text-gray-700">{i.name}</span><span className="font-bold text-gray-900">{i.count}</span></div>
                                <div className="mt-0.5 h-2 overflow-hidden rounded-full bg-gray-100"><div className="h-full rounded-full bg-rose-400" style={{ width: `${(i.count / top) * 100}%` }}></div></div>
                            </div>
                        ))}
                    </div>
                );
            };
            const exportExcel = async () => {
                if (!window.ExcelJS) { alert('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ กรุณารีเฟรชหน้าแล้วลองใหม่'); return; }
                const workbook = new window.ExcelJS.Workbook();
                const list = workbook.addWorksheet('Resignations', { views: [{ state: 'frozen', ySplit: 1 }] });
                list.columns = [['Exit Date', 14], ['ID', 10], ['Name', 28], ['Position', 24], ['Department', 16], ['Team', 22], ['Leader at exit', 26], ['Type', 13], ['Company', 16], ['Start Date', 14], ['Tenure (months)', 15], ['Reason', 28], ['Note', 40]].map(([header, width]) => ({ header, width }));
                stats.leaverRows.forEach(r => list.addRow([r.exitDate, r.id, r.name, r.position, r.dept, r.team === '__NO_SUB_DEPT__' ? '' : r.team, r.leader, r.type, r.company, r.startDate, r.months === null ? '' : Math.round(r.months * 10) / 10, EXIT_REASONS[r.reason] || '', r.note]));
                list.getRow(1).font = { bold: true };
                list.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: 13 } };
                const teamSheet = workbook.addWorksheet('By team');
                teamSheet.columns = [['Team', 26], ['Resignations', 14], ['Headcount (end)', 16], ['Avg headcount', 15], ['Turnover % (period)', 19], ['Annualised %', 14]].map(([header, width]) => ({ header, width }));
                stats.byTeam.forEach(t => teamSheet.addRow([t.name, t.leavers, t.headcount, Math.round(t.avgHeadcount * 10) / 10, Math.round(t.rate * 10) / 10, Math.round(t.annualised * 10) / 10]));
                teamSheet.getRow(1).font = { bold: true };
                const trendSheet = workbook.addWorksheet('Monthly');
                trendSheet.columns = [{ header: 'Month', width: 12 }, { header: 'Resignations', width: 14 }, { header: 'Turnover %', width: 12 }];
                stats.trend.forEach(t => trendSheet.addRow([t.label, t.leavers, Math.round(t.rate * 10) / 10]));
                trendSheet.getRow(1).font = { bold: true };
                const buffer = await workbook.xlsx.writeBuffer();
                const url = window.URL.createObjectURL(new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
                const link = document.createElement('a');
                link.setAttribute('hidden', '');
                link.setAttribute('href', url);
                link.setAttribute('download', `staff_turnover_${currentDept}_${dayKey(from)}_${dayKey(to)}.xlsx`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
            };
            const cards = [
                { label: 'ลาออกในช่วงที่เลือก', value: stats.leavers, hint: `${dayKey(from)} – ${dayKey(to)}`, cls: 'text-rose-600' },
                { label: 'พนักงานปัจจุบัน', value: stats.headcountNow, hint: 'ณ วันสิ้นสุดช่วง', cls: 'text-gray-900' },
                { label: 'Turnover rate', value: pct(stats.rate), hint: Math.round((to - from) / DAY_MS) + 1 >= 60 ? `เฉลี่ยต่อปี ${pct(stats.annualised)}` : 'ช่วงสั้น (<60 วัน) ไม่คำนวณต่อปี', cls: 'text-amber-600' },
                { label: 'อายุงานเฉลี่ยของผู้ลาออก', value: tenureText(stats.avgTenureMonths), hint: 'นับจากวันเริ่มงานถึงวันออก', cls: 'text-blue-700' }
            ];
            return (
                <section className="mx-auto w-full max-w-6xl space-y-4 pb-10">
                    <div className="flex flex-wrap items-start justify-between gap-3">
                        <div>
                            <div className="text-sm font-semibold text-rose-600">Staff Turnover</div>
                            <h1 className="text-xl font-bold text-gray-900 sm:text-2xl">การลาออกของพนักงาน — {currentDept === 'ALL' ? 'ทุกแผนก' : currentDept}</h1>
                            <p className="mt-1 text-sm text-gray-500">ใครออกจากทีมไหน เมื่อไหร่ และอัตราการลาออก (Turnover rate = ผู้ลาออก ÷ จำนวนพนักงานเฉลี่ยในช่วงนั้น)</p>
                        </div>
                        <button type="button" onClick={exportExcel} className="rounded-xl border bg-white px-3 py-2 text-sm font-semibold text-green-700 shadow-sm hover:bg-green-50">ส่งออก Excel</button>
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                        {presets.map(([key, label]) => <button key={key} type="button" onClick={() => setPreset(key)} className={`rounded-full border px-3 py-1 text-xs font-bold ${preset === key ? 'border-rose-600 bg-rose-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'}`}>{label}</button>)}
                        {preset === 'custom' && <>
                            <input type="date" value={customFrom} onChange={e => setCustomFrom(e.target.value)} className="rounded border bg-white p-1 text-xs" aria-label="จากวันที่"/>
                            <span className="text-xs text-gray-500">ถึง</span>
                            <input type="date" value={customTo} onChange={e => setCustomTo(e.target.value)} className="rounded border bg-white p-1 text-xs" aria-label="ถึงวันที่"/>
                        </>}
                        <select value={team} onChange={e => setTeam(e.target.value)} className="ml-auto rounded border bg-white p-1.5 text-xs" aria-label="ทีม">
                            <option value="ALL">ทุกแผนกย่อย / ทีม</option>
                            {stats.teamOptions.map(t => <option key={t} value={t}>{t === '__NO_SUB_DEPT__' ? 'ไม่ระบุแผนกย่อย' : t}</option>)}
                        </select>
                    </div>
                    {stats.missingExitDate > 0 && <div className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm font-semibold text-amber-800">มีผู้ลาออก {stats.missingExitDate} คนที่ยังไม่ได้ระบุวันที่ออก จึงยังไม่ถูกนับในรายงานนี้ (แก้ได้ที่ข้อมูลพนักงาน)</div>}
                    <div className="grid grid-cols-2 gap-3 md:grid-cols-4">
                        {cards.map(card => (
                            <div key={card.label} className="rounded-2xl border bg-white p-4 shadow-sm">
                                <div className="text-xs font-semibold text-gray-500">{card.label}</div>
                                <div className={`mt-1 text-3xl font-extrabold ${card.cls}`}>{card.value}</div>
                                <div className="mt-1 text-[11px] text-gray-400">{card.hint}</div>
                            </div>
                        ))}
                    </div>
                    <div className="rounded-2xl border bg-white p-4 shadow-sm">
                        <h3 className="mb-3 text-sm font-bold text-gray-800">แนวโน้ม 12 เดือนล่าสุด (จำนวนผู้ลาออก / อัตรา %)</h3>
                        <div className="flex h-40 items-end gap-1.5">
                            {stats.trend.map(t => (
                                <div key={t.label} className="flex h-full flex-1 flex-col items-center justify-end">
                                    <span className="text-[11px] font-bold text-gray-800">{t.leavers || ''}</span>
                                    <div className="w-full rounded-t bg-rose-400" style={{ height: `${(t.leavers / maxTrend) * 100}%`, minHeight: t.leavers ? '4px' : '0' }}></div>
                                </div>
                            ))}
                        </div>
                        <div className="mt-1 flex gap-1.5 text-center text-[10px] text-gray-500">
                            {stats.trend.map(t => <div key={t.label} className="flex-1"><div>{t.label}</div><div className="font-semibold text-amber-600">{pct(t.rate)}</div></div>)}
                        </div>
                    </div>
                    <div className="grid gap-3 md:grid-cols-2 lg:grid-cols-3">
                        <BarList title="ตามแผนกย่อย / ทีม" items={stats.byTeam.map(t => ({ name: `${t.name} (${pct(t.rate)})`, count: t.leavers }))} />
                        <BarList title="ตามหัวหน้า ณ วันที่ออก" items={stats.byLeader} />
                        <BarList title="ตามสาเหตุ" items={stats.byReason} />
                        <BarList title="ตามอายุงาน" items={stats.byTenure} />
                        <BarList title="ตามประเภทพนักงาน" items={stats.byType} />
                    </div>
                    <div className="rounded-2xl border bg-white shadow-sm">
                        <div className="flex flex-wrap items-center justify-between gap-2 border-b p-4">
                            <h3 className="text-sm font-bold text-gray-800">รายชื่อผู้ลาออก ({rows.length})</h3>
                            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="ค้นหาชื่อ รหัส ทีม หัวหน้า..." aria-label="ค้นหาผู้ลาออก" className="w-64 rounded border p-1.5 text-xs"/>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="min-w-full text-xs">
                                <thead className="bg-gray-50 text-left text-gray-500"><tr>{['วันที่ออก', 'ID', 'ชื่อ', 'ตำแหน่ง', 'แผนก / ทีม', 'หัวหน้า ณ วันที่ออก', 'อายุงาน', 'สาเหตุ'].map(h => <th key={h} className="px-3 py-2 font-bold">{h}</th>)}</tr></thead>
                                <tbody>
                                    {rows.length === 0 && <tr><td colSpan={8} className="px-3 py-6 text-center text-gray-400">ไม่มีผู้ลาออกในช่วงที่เลือก</td></tr>}
                                    {rows.map(r => (
                                        <tr key={r.id} className="border-t">
                                            <td className="whitespace-nowrap px-3 py-2">{formatDate(r.exitDate)}</td>
                                            <td className="px-3 py-2 text-gray-500">{r.id}</td>
                                            <td className="px-3 py-2 font-semibold text-gray-900">{r.name}{r.type === 'Subcontract' && <span className="ml-1 rounded bg-orange-100 px-1 text-[10px] font-bold text-orange-700">Sub</span>}</td>
                                            <td className="px-3 py-2">{r.position}</td>
                                            <td className="px-3 py-2">{r.dept}{r.team !== '__NO_SUB_DEPT__' ? ` / ${r.team}` : ''}</td>
                                            <td className="px-3 py-2">{r.leader || '-'}</td>
                                            <td className="whitespace-nowrap px-3 py-2">{tenureText(r.months)}</td>
                                            <td className="px-3 py-2" title={r.note}>{EXIT_REASONS[r.reason] || <span className="text-gray-400">ไม่ระบุ</span>}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            );
        };

        // ---- Skill Matrix (ISO 9001 / IATF 16949) — display board; levels are typed in here until the training system can push them ----
        const SKILL_LEVEL_INFO = [
            { level: 0, th: 'ยังไม่ได้อบรม', en: 'Not trained', criteria: 'ยังไม่ผ่านการอบรม WI ของสถานีนี้' },
            { level: 1, th: 'อบรมแล้ว ทำงานได้ภายใต้การดูแล', en: 'Trained – under supervision', criteria: 'ผ่านการอบรม WI / OJT แล้ว ต้องมีพี่เลี้ยงดูแลขณะทำงาน' },
            { level: 2, th: 'ทำงานได้เองตามมาตรฐาน', en: 'Works independently', criteria: 'ผ่านการประเมิน ทำงานได้เองตาม WI ไม่มี NG จากการทำงาน · ปล่อยงานได้' },
            { level: 3, th: 'ทำงานได้เอง แก้ปัญหาได้', en: 'Solves problems', criteria: 'แก้ปัญหาเบื้องต้นได้ เข้าใจ Reaction plan / จุด CC-SC ของสถานี' },
            { level: 4, th: 'สอนผู้อื่นได้ (Trainer)', en: 'Trainer', criteria: 'สอนและประเมินผู้อื่นได้ เป็น Trainer ของสถานี' }
        ];
        const SKILL_LEVEL_COLORS = ['#94a3b8', '#f59e0b', '#0ea5e9', '#10b981', '#6366f1'];
        const SKILL_RELEASE_LEVEL = 2;
        const SKILL_CATEGORIES = [
            { key: 'process', label: 'Station / Process', head: 'bg-blue-600', soft: 'bg-blue-50', text: 'text-blue-700', hex: '2563EB' },
            { key: 'machine', label: 'Machine / Tool', head: 'bg-violet-600', soft: 'bg-violet-50', text: 'text-violet-700', hex: '7C3AED' },
            { key: 'quality', label: 'Quality', head: 'bg-emerald-600', soft: 'bg-emerald-50', text: 'text-emerald-700', hex: '059669' },
            { key: 'safety', label: 'Safety', head: 'bg-amber-500', soft: 'bg-amber-50', text: 'text-amber-700', hex: 'F59E0B' },
            { key: 'general', label: 'General', head: 'bg-slate-500', soft: 'bg-slate-50', text: 'text-slate-700', hex: '64748B' }
        ];
        const SKILL_CODE_PREFIX = { process: 'P', machine: 'M', quality: 'Q', safety: 'S', general: 'G' };
        // Next free code for a category (P01, P02 ... per prefix), looking at every code already used.
        const nextSkillCode = (category, skills) => {
            const prefix = SKILL_CODE_PREFIX[category] || 'P';
            const pattern = new RegExp(`^${prefix}(\\d+)$`, 'i');
            const max = (skills || []).reduce((top, skill) => { const m = String(skill?.code || '').trim().match(pattern); return m ? Math.max(top, Number(m[1])) : top; }, 0);
            return `${prefix}${String(max + 1).padStart(2, '0')}`;
        };
        const SKILL_CHART_COLORS = ['#ef4444', '#f97316', '#facc15', '#60a5fa', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#14b8a6', '#a3a3a3'];
        const SKILL_NO_LINE_LABEL = 'ไม่ระบุไลน์';
        const skillCategory = (key) => SKILL_CATEGORIES.find(c => c.key === key) || SKILL_CATEGORIES[0];
        const skillCategoryIndex = (key) => Math.max(0, SKILL_CATEGORIES.findIndex(c => c.key === key));
        const skillKey = (employeeId, skillId) => `${employeeId}|${skillId}`;
        const skillLine = (value) => String(value || '').trim();
        const skillSameText = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
        const newSkillId = () => `SK-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`.toUpperCase();
        const compareSkills = (a, b) => skillCategoryIndex(a.category) - skillCategoryIndex(b.category) || (a.subDept === '' ? 1 : 0) - (b.subDept === '' ? 1 : 0) || (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name));
        // Skills that apply to one line: that line's own skills plus the department-wide ones (subDept '').
        const skillsForLine = (catalog, dept, line) => (catalog || []).filter(s => s.active !== false && skillSameText(s.dept, dept) && (s.subDept === '' || s.subDept === line)).sort(compareSkills);
        // Lines an employee belongs to in the Skill Matrix: the main sub-department plus any extra lines they also cover (e.g. a leader of two lines).
        const employeeExtraLines = (employee) => [...new Set((Array.isArray(employee?.extraSubDepts) ? employee.extraSubDepts : []).map(skillLine).filter(l => l && l !== skillLine(employee?.subDept)))];
        const employeeSkillLines = (employee) => [skillLine(employee?.subDept), ...employeeExtraLines(employee)];
        const inSkillLine = (employee, line) => employeeSkillLines(employee).includes(line);
        const skillsForEmployee = (catalog, employee) => {
            const seen = new Map();
            employeeSkillLines(employee).forEach(l => skillsForLine(catalog, employee.dept, l).forEach(s => seen.set(s.id, s)));
            return [...seen.values()].sort(compareSkills);
        };
        // Per-employee skill summary for the org chart cards: required skills met, stations at L3+, and each skill's level for the tooltip.
        const SkillSummaryContext = React.createContext(null);
        const computeSkillSummaries = (employees, data) => {
            const result = new Map();
            const catalog = data?.catalog || [];
            if (!catalog.length) return result;
            const levelMap = new Map((data.levels || []).map(l => [skillKey(l.employeeId, l.skillId), l.level]));
            (employees || []).forEach(emp => {
                if (!emp || isResignedEmployee(emp)) return;
                const skills = skillsForEmployee(catalog, emp);
                if (!skills.length) return;
                let required = 0, met = 0, stations = 0, rated = 0;
                const lines = skills.map(skill => {
                    const level = levelMap.has(skillKey(emp.id, skill.id)) ? levelMap.get(skillKey(emp.id, skill.id)) : null;
                    const req = requiredSkillLevel(skill, emp.position);
                    if (level !== null) rated++;
                    if (req > 0) { required++; if ((level ?? 0) >= req) met++; }
                    if (skill.category === 'process' && (level ?? -1) >= 3) stations++;
                    return `${req > 0 && (level ?? 0) < req ? '✗' : '•'} ${skill.name}: ${level === null ? '-' : `L${level}`}${req > 0 ? ` (ต้อง L${req})` : ''}`;
                });
                if (!required && !rated) return;
                result.set(emp.id, { required, met, stations, rated, tooltip: lines.join('\n') });
            });
            return result;
        };
        const SkillCardStrip = ({ employeeId }) => {
            const summaries = React.useContext(SkillSummaryContext);
            const summary = summaries?.get(employeeId);
            if (!summary) return null;
            const ratio = summary.required ? summary.met / summary.required : 1;
            const tone = !summary.required ? ['bg-slate-400', 'text-slate-600', 'bg-slate-50 border-slate-200'] : ratio >= 1 ? ['bg-emerald-500', 'text-emerald-700', 'bg-emerald-50 border-emerald-200'] : ratio >= 0.5 ? ['bg-amber-400', 'text-amber-700', 'bg-amber-50 border-amber-200'] : ['bg-rose-500', 'text-rose-700', 'bg-rose-50 border-rose-200'];
            return (
                <div className={`mb-3 mt-1 w-full cursor-pointer rounded border px-1 py-0.5 ${tone[2]}`} title={`Skill Matrix (คลิกเพื่อดู Radar)\n${summary.tooltip}`} onClick={(e) => { e.stopPropagation(); openSkillRadar(employeeId); }} role="button">
                    <div className={`flex items-center justify-between gap-1 text-[9px] font-bold ${tone[1]}`}>
                        <span>🎓 Skill {summary.required ? `${summary.met}/${summary.required}` : `${summary.rated} ทักษะ`}</span>
                        {summary.stations > 0 && <span className="rounded bg-white/80 px-1 text-[8px] text-indigo-700" title="จำนวนสถานีที่ทำได้ระดับ 3 ขึ้นไป">★{summary.stations}</span>}
                    </div>
                    {summary.required > 0 && <div className="mt-0.5 h-1 overflow-hidden rounded-full bg-white"><div className={`h-full rounded-full ${tone[0]}`} style={{ width: `${Math.round(ratio * 100)}%` }}></div></div>}
                </div>
            );
        };
        const requiredSkillLevel = (skill, position) => {
            const required = skill?.required || {};
            const key = Object.keys(required).find(k => skillSameText(k, position));
            return key ? Number(required[key]) || 0 : 0;
        };
        const canEditSkillMatrix = (currentUser, dept) => {
            if (!currentUser || !dept || dept === 'ALL') return false;
            if (currentUser.role === 'admin') return true;
            if (!['engineer', 'supervisor'].includes(currentUser.role)) return false;
            return currentUser.dept === 'ALL' || skillSameText(currentUser.dept, dept);
        };
        const addMonthsToDay = (day, months) => {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(day || '')) return '';
            const [y, m, d] = day.split('-').map(Number);
            const date = new Date(y, m - 1 + Number(months || 0), d);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        };
        const SKILL_SAMPLE = [
            { category: 'process', name: 'Lug assembly', code: 'P01', wi: 'WI-ASY-001', critical: 'CC', line: true },
            { category: 'process', name: 'Screw torque', code: 'P02', wi: 'WI-ASY-002', critical: 'SC', line: true },
            { category: 'process', name: 'Coil winding', code: 'P03', wi: 'WI-ASY-003', critical: '', line: true },
            { category: 'process', name: 'Soldering', code: 'P04', wi: 'WI-ASY-004', critical: '', line: true },
            { category: 'process', name: 'Final test', code: 'P05', wi: 'WI-ASY-005', critical: 'CC', line: true },

            { category: 'quality', name: 'Gauge usage', code: 'Q03', wi: 'WI-QC-003', critical: '', line: true },
            { category: 'quality', name: 'Poka-yoke check', code: 'Q04', wi: 'WI-QC-004', critical: '', line: true },
            { category: 'safety', name: 'LOTO', code: 'S01', wi: 'WI-SF-001', critical: '', line: false },
            { category: 'safety', name: 'PPE', code: 'S02', wi: 'WI-SF-002', critical: '', line: false },
            { category: 'safety', name: 'Chemical handling', code: 'S03', wi: 'WI-SF-003', critical: '', line: false },

        ];
        const sampleRequired = (category, positions) => {
            const required = {};
            positions.forEach(position => {
                const p = String(position).toLowerCase();

                if (rank >= 3) return; // Engineer and above are not rated on the line matrix by default.

        };
        // Maintenance line sample: [category, name, CC/SC, target people, target level, level for technicians, level for leaders]
        const SKILL_SAMPLE_MAINTENANCE = [
            ['process', 'ซ่อมแก้ไขเครื่องจักรเมื่อเสีย (Breakdown repair)', '', 3, 3, 2, 3],

            ['machine', 'งานกลึง / เชื่อม / ทำชิ้นส่วนทดแทน', '', 2, 2, 2, 3],
            ['machine', 'การใช้เครื่องมือวัดไฟฟ้า (Multimeter, Megger)', '', 3, 3, 2, 3],
            ['machine', 'อ่านแบบ Drawing / Wiring diagram', '', 3, 2, 2, 3],
            ['quality', 'ตรวจเช็ก Poka-yoke / Error-proofing หลังซ่อม', 'CC', 3, 3, 2, 3],
            ['quality', 'สอบเทียบ / ตรวจเช็กเครื่องมือวัดของเครื่อง (Torque, Tension)', 'SC', 2, 3, 2, 3],

            ['safety', 'LOTO (ตัดพลังงานก่อนซ่อม)', '', 0, 3, 3, 4],
            ['safety', 'งานไฟฟ้าอย่างปลอดภัย', '', 0, 3, 3, 4],
            ['safety', 'งานที่สูง / งานที่อับอากาศ', '', 0, 2, 2, 3],
            ['safety', 'งานเชื่อม / งานที่ก่อให้เกิดความร้อน (Hot work)', '', 0, 2, 2, 3],

            ['general', '5S ในพื้นที่ซ่อมบำรุง', '', 0, 2, 2, 3]
        ];
        // Codes continue from the department's latest code per category, so they stay unique.
        const makeMaintenanceSampleSkills = (positions, usedCodes) => {
            const pool = [...usedCodes];
            return SKILL_SAMPLE_MAINTENANCE.map(([category, name, critical, targetCount, targetLevel, techLevel, leaderLevel], index) => {
                const code = nextSkillCode(category, pool);
