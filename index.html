        };

        const sortAttendanceByHierarchy = (employees) => {
            const roster = Array.isArray(employees) ? employees : [];
            const byId = new Map(roster.map(employee => [String(employee.id), employee]));
            const originalIndex = new Map(roster.map((employee, index) => [String(employee.id), index]));
            const compareSiblings = (a, b) => {
                const categoryOrder = compareEmployeeCategoryOrder(a, b);
                if (categoryOrder) return categoryOrder;
                return (originalIndex.get(String(a.id)) || 0) - (originalIndex.get(String(b.id)) || 0);
            };
            const childrenByManager = new Map();
            const roots = [];
            roster.forEach(employee => {
                const managerId = String(employee.reportsTo || '').trim();
                if (!managerId || managerId === 'STAGING' || !byId.has(managerId)) {
                    roots.push(employee);
                    return;
                }
                if (!childrenByManager.has(managerId)) childrenByManager.set(managerId, []);
                childrenByManager.get(managerId).push(employee);
            });
            roots.sort(compareSiblings);
            childrenByManager.forEach(children => children.sort(compareSiblings));

            const ordered = [];
            const visited = new Set();
            const visit = employee => {
                const id = String(employee.id);
                if (visited.has(id)) return;
                visited.add(id);
                ordered.push(employee);
                (childrenByManager.get(id) || []).forEach(visit);
            };
            roots.forEach(visit);
            // Keep malformed or cyclic reporting chains visible after the valid hierarchy.
            roster.slice().sort(compareSiblings).forEach(visit);
            return ordered;
        };

        const AttendanceAvatar = ({ employee }) => {
            const [imageFailed, setImageFailed] = useState(false);
            const imageUrl = employee?.image ? formatDriveUrl(employee.image) : '';
            const initials = String(employee?.name || employee?.id || '?').trim().split(/\s+/).slice(0, 2).map(part => part.charAt(0)).join('').toUpperCase();
            return (
                <div className="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-full border border-gray-200 bg-blue-50 text-sm font-bold text-blue-700" aria-hidden="true">
                    {imageUrl && !imageFailed
                        ? <img src={imageUrl} alt="" loading="lazy" decoding="async" referrerPolicy="no-referrer" onError={() => setImageFailed(true)} className="h-full w-full object-cover" />
                        : <span>{initials}</span>}
                </div>
            );
        };

        const AttendanceQRCodeModal = ({ employee, onClose }) => {
            const qrRef = useRef(null);
            const [qrLoading, setQrLoading] = useState(true);
            const [qrError, setQrError] = useState('');
            const code = `HRATTEND1:${encodeURIComponent(String(employee.id))}`;
            useEffect(() => {
                let cancelled = false;
                loadAttendanceLibrary('QRCode', 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').then(QRCode => {
                    if (cancelled || !qrRef.current) return;
                    qrRef.current.innerHTML = '';
                    new QRCode(qrRef.current, { text: code, width: 248, height: 248, correctLevel: QRCode.CorrectLevel.M });
                    setQrLoading(false);
                }).catch(() => {
                    if (!cancelled) { setQrError('โหลด QR ไม่สำเร็จ กรุณาลองใหม่'); setQrLoading(false); }
                });
                return () => { cancelled = true; };
            }, [code]);
            return (
                <div className="fixed inset-0 z-[140] flex items-center justify-center bg-black/60 p-4" role="dialog" aria-modal="true" aria-label={`QR code ${employee.name}`}>
                    <div className="w-full max-w-sm rounded-2xl bg-white p-5 text-center shadow-2xl">
                        <div className="flex items-start justify-between gap-3 text-left">
                            <div><h2 className="font-bold text-gray-900">QR เช็คชื่อพนักงาน</h2><p className="mt-1 text-sm text-gray-500">{employee.name} · {employee.id}</p></div>
                            <button type="button" onClick={onClose} className="rounded-lg px-3 py-2 text-gray-500 hover:bg-gray-100">ปิด</button>
                        </div>
                        <div className="my-5 flex min-h-[264px] items-center justify-center rounded-xl border bg-white p-2"><div ref={qrRef}></div>{qrLoading && <span className="text-sm text-gray-500">กำลังสร้าง QR…</span>}{qrError && <span className="text-sm text-red-600">{qrError}</span>}</div>
                        <p className="text-sm text-gray-600">ให้พนักงานแสดง QR นี้ แล้วสแกนจากหน้าเช็คชื่อ</p>
                    </div>
                </div>
            );
        };

        const AttendanceQrScanner = ({ onScan, onClose, queuedCount, scanMessage }) => {
            const scannerRef = useRef(null);
            const onScanRef = useRef(onScan);
            const [cameraError, setCameraError] = useState('');
            const [cameraReady, setCameraReady] = useState(false);
            useEffect(() => { onScanRef.current = onScan; }, [onScan]);
            useEffect(() => {
                let disposed = false;
                let startPromise = null;
                const startScanner = async () => {
                    try {
                        const Html5Qrcode = await loadAttendanceLibrary('Html5Qrcode', 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
                        if (disposed) return;
                        const scanner = new Html5Qrcode('attendance-qr-reader', { verbose: false });
                        scannerRef.current = scanner;
                        startPromise = scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1 }, text => { if (!disposed) onScanRef.current(text); }, () => {});
                        await startPromise;
                        if (!disposed) setCameraReady(true);
                    } catch (error) {
                        if (!disposed) setCameraError(window.Html5Qrcode ? 'เปิดกล้องไม่ได้ กรุณาอนุญาตใช้กล้องและเปิดหน้านี้ผ่าน HTTPS' : 'โหลดระบบสแกน QR ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ');
                    }
                };
                void startScanner();
                return () => {
                    disposed = true;
                    const scanner = scannerRef.current;
                    scannerRef.current = null;
                    if (scanner) {
                        Promise.resolve(startPromise).catch(() => {}).then(() => scanner.stop().catch(() => {})).then(() => scanner.clear()).catch(() => {});
                    }
                };
            }, []);
            return (
                <div className="fixed inset-0 z-[130] flex items-center justify-center bg-black/70 p-3 sm:p-5" role="dialog" aria-modal="true" aria-label="สแกน QR เช็คชื่อ">
                    <div className="max-h-full w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl sm:p-5">
                        <div className="flex items-start justify-between gap-3">
                            <div><h2 className="text-lg font-bold text-gray-900">สแกน QR พนักงาน</h2><p className="mt-1 text-sm text-gray-500">ระบบเลือกเข้างานหรือ OT ให้อัตโนมัติตามรายการรอบนี้</p></div>
                            <button type="button" onClick={onClose} className="rounded-lg px-3 py-2 text-gray-600 hover:bg-gray-100">ปิด</button>
                        </div>
                        <div id="attendance-qr-reader" className="mt-4 min-h-[280px] overflow-hidden rounded-xl bg-gray-950"></div>
                        {!cameraReady && !cameraError && <p className="mt-3 text-center text-sm text-gray-500">กำลังเปิดกล้อง…</p>}
                        {cameraError && <p role="alert" className="mt-3 rounded-xl bg-red-50 p-3 text-sm text-red-700">{cameraError}</p>}
                        {scanMessage && <p role="status" className="mt-3 rounded-xl bg-blue-50 p-3 text-center text-sm font-semibold text-blue-800">{scanMessage}</p>}
                        <p className="mt-3 text-center text-sm font-semibold text-green-700">เข้าคิวแล้ว {queuedCount} รายการ · สแกนต่อได้ ระบบยังไม่บันทึก</p>
                        <button type="button" onClick={onClose} className="mt-3 min-h-12 w-full rounded-xl bg-blue-700 px-4 font-bold text-white">เสร็จสิ้นการสแกน · กลับไปบันทึกทั้งหมด</button>
                    </div>
                </div>
            );
        };

        const shiftAttendanceDate = (isoDate, days) => {
            const [y, m, d] = String(isoDate).split('-').map(Number);
            const date = new Date(Date.UTC(y, m - 1, d + days));
            return date.toISOString().slice(0, 10);
        };

        const AttendancePanel = ({ data, currentUser, currentDept, loading, savingType, error, notice, onSaveBatch, onRefresh, selectedDate = '', onDateChange }) => {
            const [entryTime, setEntryTime] = useState('08:00');
            const todayDate = data?.today || '';
            const canBackdate = Boolean(data?.canBackdate && todayDate && onDateChange);
            const isBackdated = Boolean(selectedDate) || Boolean(data?.backdated);
            // The list on screen must belong to the round the next save will go to.
            const dateMismatch = selectedDate ? data?.date !== selectedDate : Boolean(data?.backdated);
            const minDate = canBackdate && Number(data?.backdateDays) > 0 ? shiftAttendanceDate(todayDate, -Number(data.backdateDays)) : undefined;
            const changeDate = value => {
                if (!onDateChange) return;
                if (!value || value === todayDate) { onDateChange(''); return; }
                if (todayDate && value > todayDate) return;
                if (minDate && value < minDate) return;
                onDateChange(value);
            };
            const employees = Array.isArray(data?.employees) ? data.employees : [];
            const orderedEmployees = useMemo(() => sortAttendanceByHierarchy(employees), [employees]);
            const records = Array.isArray(data?.records) ? data.records : [];
            const isAdmin = currentUser?.role === 'admin';
            const userKey = currentUser ? `${currentUser.attendanceToken || currentUser.username || ''}|${currentUser.dept || ''}` : '';
            const [selectedDept, setSelectedDept] = useState(() => currentUser?.dept || currentDept || '');
            const [selectedSubDept, setSelectedSubDept] = useState('ALL');
            const [selectedShift, setSelectedShift] = useState('ALL');
            const [searchTerm, setSearchTerm] = useState('');
            const [pendingActions, setPendingActions] = useState({});
            const [qrEmployee, setQrEmployee] = useState(null);
            const [scannerOpen, setScannerOpen] = useState(false);
            const [scanNotice, setScanNotice] = useState('');
            const initializedForUser = useRef('');
            const deptOptions = Array.from(new Set(employees.map(employee => employee.dept || '__NO_DEPT__')));
            const deptOptionsKey = deptOptions.join('|');
            const selfById = employees.find(employee => employee.id === String(data?.selfId || ''));
            const selfByUsername = employees.find(employee => employee.id === String(currentUser?.username || ''));
            const sameNameEmployees = currentUser?.name
                ? employees.filter(employee => String(employee.name || '').trim().toLocaleLowerCase() === String(currentUser.name).trim().toLocaleLowerCase())
                : [];
            const selfEmployee = selfById || selfByUsername || (sameNameEmployees.length === 1 ? sameNameEmployees[0] : null);
            useEffect(() => {
                if (employees.length === 0) return;
                const allowed = selectedDept === 'ALL' && isAdmin || deptOptions.includes(selectedDept);
                if (!allowed) {
                    const preferredDept = deptOptions.find(dept => dept.toLocaleLowerCase() === String(currentUser?.dept || '').trim().toLocaleLowerCase());
                    setSelectedDept(isAdmin ? (preferredDept || 'ALL') : (preferredDept || deptOptions[0] || ''));
                }
            }, [deptOptionsKey, employees.length, isAdmin, selectedDept, currentUser?.dept]);
            useEffect(() => {
                if (!userKey || !currentUser?.username || String(data?.actorUsername || '') !== String(currentUser.username) || employees.length === 0 || initializedForUser.current === userKey) return;
                initializedForUser.current = userKey;
                const userDept = String(currentUser.dept || '').trim();
                const preferredDept = deptOptions.find(dept => dept.toLocaleLowerCase() === userDept.toLocaleLowerCase());
                setSelectedDept(isAdmin ? (preferredDept || 'ALL') : (preferredDept || deptOptions[0] || ''));
                setSelectedSubDept(String(selfEmployee?.subDept || '').trim() ? attendanceSubDeptKey(selfEmployee.subDept) : 'ALL');
                const shift = String(selfEmployee?.shift || '').trim().toUpperCase();
                setSelectedShift(shift === 'A' || shift === 'B' ? shift : 'ALL');
                setSearchTerm('');
                setPendingActions({});
            }, [userKey, currentUser?.username, currentUser?.dept, data?.actorUsername, data?.selfId, deptOptionsKey, employees.length, isAdmin, selfEmployee?.subDept, selfEmployee?.shift]);

            const dateLabel = data?.date
                ? new Date(`${data.date}T00:00:00`).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
                : 'วันนี้';
            const scopedEmployees = orderedEmployees.filter(employee => selectedDept === 'ALL' || (employee.dept || '__NO_DEPT__') === selectedDept);
            const subDeptOptions = Array.from(new Set(scopedEmployees.map(employee => attendanceSubDeptKey(employee.subDept)))).sort((a, b) => a === '__NO_SUB_DEPT__' ? 1 : b === '__NO_SUB_DEPT__' ? -1 : a.localeCompare(b));
            const subDeptOptionsKey = subDeptOptions.join('|');
            useEffect(() => {
                if (selectedSubDept !== 'ALL' && !subDeptOptions.includes(selectedSubDept)) setSelectedSubDept('ALL');
            }, [selectedSubDept, subDeptOptionsKey]);
            const subDeptScopedEmployees = scopedEmployees.filter(employee => selectedSubDept === 'ALL' || attendanceSubDeptKey(employee.subDept) === selectedSubDept);
            const shiftScopedEmployees = subDeptScopedEmployees.filter(employee => selectedShift === 'ALL' || (selectedShift === 'UNASSIGNED' ? !['A', 'B'].includes(String(employee.shift || '').trim().toUpperCase()) : String(employee.shift || '').trim().toUpperCase() === selectedShift));
            const query = searchTerm.trim().toLowerCase();
            const visibleEmployees = shiftScopedEmployees.filter(employee => !query || `${employee.name} ${employee.id} ${employee.dept || ''} ${employee.subDept || ''} ${employee.position || ''} ${employee.shift || ''}`.toLowerCase().includes(query));
            const recordsByEmployee = records.reduce((map, record) => {
                const existing = map[record.username] || {};
                existing[record.type] = record;
                map[record.username] = existing;
                return map;
            }, {});
            const pendingList = Object.values(pendingActions);
            // A different round has different records: drop anything queued for the previous one.
            useEffect(() => { setPendingActions({}); setScanNotice(''); }, [selectedDate]);
            const workCount = shiftScopedEmployees.filter(employee => recordsByEmployee[employee.id]?.work).length;
            const otCount = shiftScopedEmployees.filter(employee => recordsByEmployee[employee.id]?.ot).length;

            const toggleAction = (employeeId, type) => {
                const key = `${employeeId}:${type}`;
                setPendingActions(previous => {
                    const next = { ...previous };
                    if (next[key]) {
                        delete next[key];
                        if (type === 'work') delete next[`${employeeId}:ot`];
                    } else {
                        next[key] = { employeeId, type };
                    }
                    return next;
                });
            };

            const handleQrScan = useCallback(rawCode => {
                const match = /^HRATTEND1:(.+)$/.exec(String(rawCode || '').trim());
                if (!match) {
                    setScanNotice('QR นี้ไม่ใช่รหัสเช็คชื่อของระบบ');
                    return;
                }
                let employeeId = '';
                try { employeeId = decodeURIComponent(match[1]); } catch (error) {}
                const employee = employees.find(item => item.id === employeeId);
                if (!employee) {
                    setScanNotice('พนักงานรายนี้อยู่นอกทีมที่คุณมีสิทธิ์เช็คชื่อ');
                    return;
                }
                if (!shiftScopedEmployees.some(item => item.id === employeeId)) {
                    setScanNotice(`พนักงาน ${employee.name} ไม่อยู่ในแผนกหรือกะที่เลือก`);
                    return;
                }
                const employeeRecords = recordsByEmployee[employee.id] || {};
                if (employeeRecords.ot) {
                    setScanNotice(`${employee.name} เช็คเข้างานและ OT ครบแล้วในรอบนี้`);
                    return;
                }
                if (!employeeRecords.work && pendingActions[`${employee.id}:work`]) {
                    setScanNotice(`${employee.name} อยู่ในคิวเข้างานแล้ว กรุณาบันทึกก่อนสแกน OT`);
                    return;
                }
                const type = employeeRecords.work ? 'ot' : 'work';
                const key = `${employee.id}:${type}`;
                if (pendingActions[key]) {
                    setScanNotice(`${employee.name} อยู่ในคิวบันทึกแล้ว`);
                    return;
                }
                setPendingActions(previous => ({ ...previous, [key]: { employeeId: employee.id, type } }));
                setScanNotice(`เพิ่ม ${employee.name} ในคิว${type === 'ot' ? ' OT' : 'เข้างาน'}แล้ว`);
                if (navigator.vibrate) navigator.vibrate(45);
            }, [employees, shiftScopedEmployees, recordsByEmployee, pendingActions]);

            const saveBatch = async () => {
                if (pendingList.length === 0 || savingType || dateMismatch) return;
                const results = await onSaveBatch(pendingList, entryTime);

            return (

                    {isBackdated && <div className="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">

                        <label className="min-w-0 text-sm font-semibold text-gray-700 xl:col-span-2">

                                <option value="ALL">ทุกแผนกย่อย</option>

                        <label className="min-w-0 text-sm font-semibold text-gray-700 xl:col-span-2">
                            กะ
                            <select value={selectedShift} onChange={event => setSelectedShift(event.target.value)} disabled={loading || employees.length === 0}
                                className="mt-1 min-h-12 w-full rounded-xl border border-gray-300 bg-white px-3 text-base font-semibold text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 disabled:bg-gray-100">
                                <option value="ALL">ทุกกะ</option>

                        <label className="min-w-0 text-sm font-semibold text-gray-700 xl:col-span-3">

                            <span className="whitespace-nowrap rounded-full bg-violet-100 px-3 py-2 text-xs font-bold text-violet-800">OT {otCount}/{shiftScopedEmployees.length}</span>
                            <button type="button" onClick={() => { setScanNotice(''); setScannerOpen(true); }} disabled={loading || dateMismatch || employees.length === 0} className="min-h-10 rounded-xl bg-green-700 px-4 text-sm font-bold text-white hover:bg-green-800 disabled:opacity-50">สแกน QR</button>
                        </div>
                    </div>

                    {loading && employees.length === 0 && <div className="rounded-2xl border bg-white p-5 text-sm text-gray-500">กำลังโหลดรายชื่อ…</div>}
                    {!loading && employees.length === 0 && !data?.rosterMessage && <div className="rounded-2xl border bg-white p-5 text-sm text-gray-500">ไม่มีรายชื่อพนักงานที่เข้าถึงได้</div>}
                    {employees.length > 0 && visibleEmployees.length === 0 && <div className="rounded-2xl border bg-white p-5 text-sm text-gray-500">{selectedShift === 'UNASSIGNED' ? 'ไม่พบพนักงานที่ไม่มีกะ' : selectedSubDept !== 'ALL' ? `ไม่พบพนักงานในแผนกย่อย ${selectedSubDept === '__NO_SUB_DEPT__' ? 'ที่ไม่ระบุ' : selectedSubDept}` : `ไม่พบพนักงานใน${selectedShift === 'ALL' ? 'แผนกนี้' : `กะ ${selectedShift}`}`}</div>}
                    <div className="space-y-3">
                        {visibleEmployees.map(employee => {
                            const employeeRecords = recordsByEmployee[employee.id] || {};
                            const work = employeeRecords.work;
                            const ot = employeeRecords.ot;
                            const workQueued = Boolean(pendingActions[`${employee.id}:work`]);
                            const buttons = [
                                { type: 'work', title: 'เข้างาน', record: work, queued: workQueued, disabled: Boolean(work) },
                                { type: 'ot', title: 'OT', record: ot, queued: Boolean(pendingActions[`${employee.id}:ot`]), disabled: !work && !workQueued || Boolean(ot) }
                            ];
                            return (
                                <article key={employee.id} className="rounded-2xl border bg-white p-3 shadow-sm sm:flex sm:items-center sm:gap-4 sm:p-4">
                                    <div className="mb-3 flex min-w-0 items-center justify-between gap-3 sm:mb-0 sm:flex-1">
                                        <div className="flex min-w-0 items-center gap-3">
                                            <AttendanceAvatar employee={employee} />
                                            <div className="min-w-0">
                                                <div className="flex min-w-0 items-center gap-1.5">
                                                    <div className="truncate font-bold text-gray-900">{employee.name || employee.id}</div>
                                                    {isSubcontractEmployee(employee) && <span title={employee.company || 'Subcontract'} className="max-w-24 shrink-0 truncate rounded bg-orange-50 px-1.5 py-0.5 text-[10px] font-semibold text-orange-700">{employee.company || 'Subcontract'}</span>}
                                                </div>
                                                <div className="truncate text-xs text-gray-500">{employee.id}{employee.position ? ` · ${employee.position}` : ''}{employee.dept ? ` · ${employee.dept}` : ''}{employee.subDept ? ` · ${employee.subDept}` : ''}{employee.shift ? ` · กะ ${employee.shift}` : ' · ไม่มีกะ'}</div>
                                            </div>
                                        </div>
                                        {employee.qrEnabled !== false && <button type="button" aria-label={`แสดง QR ${employee.name}`} onClick={() => setQrEmployee(employee)} className="shrink-0 rounded-lg border px-3 py-2 text-xs font-bold text-gray-600 hover:bg-gray-50">QR</button>}
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 sm:w-[360px]">
                                        {buttons.map(button => (
                                            <button key={button.type} type="button" disabled={loading || Boolean(savingType) || dateMismatch || button.disabled}
                                                onClick={() => toggleAction(employee.id, button.type)}
                                                className={`touch-manipulation min-h-12 rounded-xl border px-3 py-2 text-sm font-bold transition active:scale-[0.98] disabled:cursor-not-allowed ${button.record ? 'border-green-200 bg-green-50 text-green-800' : button.queued ? 'border-blue-300 bg-blue-100 text-blue-800 ring-2 ring-blue-200' : button.type === 'ot' && button.disabled ? 'border-gray-200 bg-gray-100 text-gray-400' : 'border-blue-200 bg-white text-blue-700 hover:bg-blue-50 disabled:opacity-50'}`}>
                                                {button.record ? `${button.title} ✓ ${button.record.time}` : button.queued ? `เลือกแล้ว · ${button.title}` : button.type === 'ot' && button.disabled ? 'เลือกเข้างานก่อน' : button.title}
                                            </button>
                                        ))}
                                    </div>
                                </article>
                            );
                        })}
                    </div>

                    {pendingList.length > 0 && <div className="fixed inset-x-3 bottom-3 z-[60] mx-auto flex max-w-6xl items-center justify-between gap-3 rounded-2xl border border-blue-200 bg-white/95 p-3 shadow-xl backdrop-blur sm:px-5">
                        <div className="min-w-0"><div className="font-bold text-gray-900">รอบันทึก {pendingList.length} รายการ{isBackdated ? ` · ย้อนหลัง ${data?.date || ''} เวลา ${entryTime}` : ''}</div><div className="hidden text-xs text-gray-500 sm:block">ระบบจะส่งบันทึกทั้งหมดในครั้งเดียว</div></div>
                        <div className="flex shrink-0 gap-2"><button type="button" onClick={() => setPendingActions({})} disabled={Boolean(savingType)} className="min-h-11 rounded-xl border px-3 text-sm font-semibold text-gray-600">ล้าง</button><button type="button" onClick={saveBatch} disabled={Boolean(savingType) || dateMismatch} className="min-h-11 rounded-xl bg-blue-700 px-4 text-sm font-bold text-white disabled:opacity-60">{savingType === 'batch' ? 'กำลังบันทึก…' : 'บันทึกทั้งหมด'}</button></div>
                    </div>}

                    {qrEmployee && <AttendanceQRCodeModal employee={qrEmployee} onClose={() => setQrEmployee(null)} />}
                    {scannerOpen && <AttendanceQrScanner onScan={handleQrScan} onClose={() => setScannerOpen(false)} queuedCount={pendingList.length} scanMessage={scanNotice} />}
                </section>
            );
        };

        const App = () => {
            // [FIXED] ใช้ safeLocalLoad ป้องกัน JSON Parse Error (สาเหตุหลักจอขาว)
            const initialEmployees = normalizeEmployees(safeLocalLoad('orgData', []));
            const initialPendingSync = safeLocalLoad('pendingSync', []);
            const safeInitialPendingSync = Array.isArray(initialPendingSync) ? initialPendingSync : [];
            const initialSubDepartmentCatalog = normalizeSubDepartmentCatalog(safeLocalLoad('orgSubDepartments', {}), initialEmployees);
            const [currentUser, setCurrentUser] = useState(() => safeLocalLoad('currentUser', null));
            const [employees, setEmployees] = useState(initialEmployees);
            const [positions, setPositions] = useState(() => safeLocalLoad('orgPositions', ["Manager", "Supervisor", "Engineer", "Leader", "Operator"]));
            const [departments, setDepartments] = useState(() => safeLocalLoad('orgDepartments', ["ASSEMBLY", "QC", "HR", "EXECUTIVE"]));
            const [subDepartments, setSubDepartments] = useState(initialSubDepartmentCatalog);
            
            const [currentDept, setCurrentDept] = useState(departments[0] || "ASSEMBLY");
            const [driveUrl, setDriveUrl] = useState(() => safeLocalLoad('driveUrl', "https://script.google.com/macros/s/AKfycbxYxBWD4blG_bP9hdTm_W8RP9PtM9CLZovmSFQVVsQTcBl18uxcaAxrhW5lZKFmEj8H/exec"));
            
            // [FIXED] เพิ่มสถานะ isDataReady เพื่อป้องกัน White Screen
            const [isDataReady, setIsDataReady] = useState(false);
            
            const [viewMode, setViewMode] = useState('chart'); 
            const [zoom, setZoom] = useState(1);
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingEmployee, setEditingEmployee] = useState(null);
            const [selectionMode, setSelectionMode] = useState(false);
            const [selectedIds, setSelectedIds] = useState([]);
            const [cloudStatus, setCloudStatus] = useState('offline');
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
            const [isAdminPanelOpen, setIsAdminPanelOpen] = useState(false);
            const [isSummaryOpen, setIsSummaryOpen] = useState(false);
            const [appTheme, setAppTheme] = useState('blue');
            const [appShape, setAppShape] = useState(SHAPES.rounded);
            const [layoutThreshold, setLayoutThreshold] = useState(4);
            const [deptName, setDeptName] = useState(currentDept + " DEPT");
            const [isManageDeptsOpen, setIsManageDeptsOpen] = useState(false);
            const [isManagePositionsOpen, setIsManagePositionsOpen] = useState(false);
            const [logo, setLogo] = useState({ url: null, x: 50, y: 50 });
            const [annotations, setAnnotations] = useState([]);
            const [linkStartId, setLinkStartId] = useState(null);
            const [showRulers, setShowRulers] = useState(false);
            const [showSkillOnChart, setShowSkillOnChart] = useState(() => safeLocalLoad('showSkillOnChart', true) !== false);
            const [chartSkillData, setChartSkillData] = useState(() => safeLocalLoad('skillMatrixCache', null));
            const [history, setHistory] = useState([initialEmployees]);
            const [historyIndex, setHistoryIndex] = useState(0);
            const [pendingSyncCount, setPendingSyncCount] = useState(safeInitialPendingSync.length);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [sidebarWidth, setSidebarWidth] = useState(256);
            const [pendingShiftDrop, setPendingShiftDrop] = useState(null);
            const [pendingDropShifts, setPendingDropShifts] = useState({});
            const sidebarRef = useRef(null);
            const isResizing = useRef(false);
            const pendingSyncRef = useRef(safeInitialPendingSync);
            const syncInFlightRef = useRef(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'ascending' });
            const [showEmployeeHistory, setShowEmployeeHistory] = useState(false);
            const [attendanceData, setAttendanceData] = useState({ date: '', mine: {}, records: [], employees: [], departments: [] });
            const [attendanceLoading, setAttendanceLoading] = useState(false);
            const [attendanceUpdatedAt, setAttendanceUpdatedAt] = useState(null);
            const [attendanceSavingType, setAttendanceSavingType] = useState('');
            const [attendanceError, setAttendanceError] = useState('');
            const [attendanceNotice, setAttendanceNotice] = useState('');

            const appApiCall = useCallback(async (url, action, payload = {}) => {
                const executor = currentUser ? {
                    username: currentUser.username,
                    name: currentUser.name,
                    role: currentUser.role,
                    dept: currentUser.dept || 'ALL'
                } : { username: 'System', name: 'Login/System', role: '-', dept: '-' };
                const requestBody = { action, ...payload, executor };
                if (action === 'getAttendance' || action === 'recordAttendance' || action === 'recordAttendanceBatch' || action === 'translateText' || action === 'saveSkillCatalog' || action === 'saveSkillLevels' || action === 'saveSkillMatrixDoc') {
                    requestBody.attendanceToken = currentUser?.attendanceToken || '';
                }

                const res = await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify(requestBody)
                });
                const raw = await res.text();
                let result;
                try {
                    result = JSON.parse(raw);
                } catch (error) {
                    throw new Error(`Backend returned an invalid response (HTTP ${res.status})`);
                }
                if (!res.ok) {
                    throw new Error(result?.message || result?.error || `Backend request failed (HTTP ${res.status})`);
                }
                return result;
            }, [currentUser]);

            // '' = the current round; 'yyyy-MM-dd' = an earlier round picked on the check-in page (backdated entry).
            const [attendanceDate, setAttendanceDate] = useState('');
            const attendanceRequestSeq = useRef(0);
            const loadAttendance = useCallback(async (workDate = '') => {
                if (!driveUrl) {
                    setAttendanceError('ยังไม่ได้ตั้งค่า URL ของระบบ');
                    return;
                }
                const seq = ++attendanceRequestSeq.current;
                setAttendanceLoading(true);
                setAttendanceError('');
                try {
                    const result = await appApiCall(driveUrl, 'getAttendance', workDate ? { workDate } : {});
                    if (seq !== attendanceRequestSeq.current) return;
                    if (result?.code === 'session_expired') {
                        localStorage.removeItem('currentUser');
                        setCurrentUser(null);
                        return;
                    }
                    if (result?.status !== 'success') throw new Error(result?.message || 'โหลดข้อมูลเช็คชื่อไม่สำเร็จ');
                    setAttendanceData(result);
                    setAttendanceUpdatedAt(Date.now());
                } catch (error) {
                    if (seq === attendanceRequestSeq.current) setAttendanceError(error?.message || 'เชื่อมต่อระบบเช็คชื่อไม่สำเร็จ');
                } finally {
                    if (seq === attendanceRequestSeq.current) setAttendanceLoading(false);
                }
            }, [appApiCall, driveUrl]);
            const activeAttendanceDate = viewMode === 'attendance' ? attendanceDate : '';
            const reloadAttendance = useCallback(() => loadAttendance(activeAttendanceDate), [loadAttendance, activeAttendanceDate]);

            const handleAttendanceBatchSave = useCallback(async (items, entryTime) => {
                if (!driveUrl || attendanceSavingType || !Array.isArray(items) || items.length === 0) return null;
                setAttendanceSavingType('batch');
                setAttendanceError('');
                setAttendanceNotice('');
                try {
                    const result = await appApiCall(driveUrl, 'recordAttendanceBatch', attendanceDate ? { items, workDate: attendanceDate, time: entryTime || '08:00' } : { items });
                    if (result?.code === 'session_expired') {
                        localStorage.removeItem('currentUser');
                        setCurrentUser(null);
                        return null;
                    }
                    if (result?.status !== 'success' || !Array.isArray(result.items)) {
                        throw new Error(result?.message || 'บันทึกเช็คชื่อไม่สำเร็จ');
                    }
                    const completed = result.items.filter(item => (item.status === 'success' || item.status === 'duplicate') && item.record);
                    setAttendanceData(previous => {
                        const sameDate = previous.date === result.date;
                        const mergedRecords = sameDate ? [...(previous.records || [])] : [];
                        completed.forEach(item => {
                            const record = item.record;
                            const index = mergedRecords.findIndex(existing => existing.username === record.username && existing.type === record.type);
                            if (index >= 0) mergedRecords[index] = record;
                            else mergedRecords.unshift(record);
                        });
                        return { ...previous, date: result.date || previous.date, records: mergedRecords };
                    });
                    const savedCount = result.items.filter(item => item.status === 'success').length;
                    const duplicateCount = result.items.filter(item => item.status === 'duplicate').length;
                    const failed = result.items.filter(item => item.status !== 'success' && item.status !== 'duplicate');
                    setAttendanceNotice(`บันทึกสำเร็จ ${savedCount} รายการ${result.backdated ? ` (ย้อนหลังรอบวันที่ ${result.date})` : ''}${duplicateCount ? ` · มีรายการบันทึกไว้แล้ว ${duplicateCount} รายการ` : ''}`);
                    if (failed.length) setAttendanceError(failed.map(item => `${item.name || item.employeeId}: ${item.message || 'บันทึกไม่สำเร็จ'}`).join(' · '));
                    return result.items;
                } catch (error) {
                    setAttendanceError(error?.message || 'เชื่อมต่อระบบเช็คชื่อไม่สำเร็จ กรุณาลองอีกครั้ง');
                    return null;
                } finally {
                    setAttendanceSavingType('');
                }
            }, [appApiCall, attendanceSavingType, attendanceDate, driveUrl]);

            useEffect(() => {
                if ((viewMode === 'attendance' || viewMode === 'monitor') && currentUser) void loadAttendance(activeAttendanceDate);
            }, [viewMode, currentUser, loadAttendance, activeAttendanceDate]);
            useEffect(() => {
                if (viewMode !== 'monitor' || !currentUser) return undefined;
                const timer = setInterval(() => { if (!document.hidden) void loadAttendance(''); }, 60000);
                return () => clearInterval(timer);
            }, [viewMode, currentUser, loadAttendance]);

            const persistPendingSync = useCallback((queue) => {
                const safeQueue = Array.isArray(queue) ? queue : [];
                pendingSyncRef.current = safeQueue;
                setPendingSyncCount(safeQueue.length);
                localStorage.setItem('pendingSync', JSON.stringify(safeQueue));

                if (!target.reportsTo || target.reportsTo === 'STAGING') {
                    // This is a root node (Department Head or Staging)

                    const roots = employees
                        .filter(e => (!e.reportsTo || e.reportsTo === 'STAGING') && (currentDept === 'ALL' || e.dept === currentDept))
                        .sort((a, b) => (a.order || 0) - (b.order || 0));
                    
                    const currentIndex = roots.findIndex(e => e.id === id);
                    if (currentIndex === -1) return;

                    let newIndex = currentIndex + offset;
                    if (newIndex < 0) newIndex = 0;
                    if (newIndex >= roots.length) newIndex = roots.length - 1;
                    if (newIndex === currentIndex) return;

                    // Swap mechanism
                    const itemToMove = roots[currentIndex];
                    roots.splice(currentIndex, 1);
                    roots.splice(newIndex, 0, itemToMove);

                    // Re-assign order based on new array position
                    const updates = roots.map((root, index) => ({ ...root, order: index + 1 }));
                    
                    // Merge updates
                    const newData = employees.map(e => {
                        const updatedRoot = updates.find(u => u.id === e.id);

                    updateStateFull(newData, updates, []);

                const currentIndex = siblings.findIndex(e => e.id === id); if (currentIndex === -1) return;

                const itemToMove = siblings[currentIndex]; siblings.splice(currentIndex, 1); siblings.splice(newIndex, 0, itemToMove);
                const updates = siblings.map((sib, index) => ({ ...sib, order: index + 1 }));
                const newData = employees.map(e => { const updatedSibling = updates.find(u => u.id === e.id); return updatedSibling ? updatedSibling : e; });

                        if (!squareCache.has(src)) squareCache.set(src, new Promise((resolve, reject) => {
                            const probe = new Image();
                            probe.crossOrigin = 'anonymous';
                            probe.referrerPolicy = 'no-referrer';
                            probe.onload = () => {
                                try {
                                    const side = Math.min(probe.naturalWidth, probe.naturalHeight, 192);
                                    const c = document.createElement('canvas');
                                    c.width = c.height = side;
                                    const crop = Math.min(probe.naturalWidth, probe.naturalHeight);
                                    c.getContext('2d').drawImage(probe, (probe.naturalWidth - crop) / 2, (probe.naturalHeight - crop) / 2, crop, crop, 0, 0, side, side);
                                    resolve(c.toDataURL('image/jpeg', 0.92));
                                } catch (error) { reject(error); }
                            };
                            probe.onerror = reject;
                            probe.src = src;
                        }));
                        return squareCache.get(src);
                    };
                    await Promise.all([...clone.querySelectorAll('img')].map(async img => {
                        if (!img.naturalWidth || getComputedStyle(img).objectFit !== 'cover') return;
                        try {
                            img.src = await toSquareDataUrl(img.currentSrc || img.src);
                            img.style.objectFit = 'fill';
                            await img.decode().catch(() => {});
                        } catch (error) { /* keep the original photo */ }
                    }));
                    // Measure every descendant too: anything that still overflows the wrapper must be inside the capture box.
                    const viewportWidth = getViewportWidth();
                    const box = clone.getBoundingClientRect();
                    let w = Math.ceil(box.width), h = Math.ceil(box.height);
                    clone.querySelectorAll('*').forEach(el => { const r = el.getBoundingClientRect(); w = Math.max(w, Math.ceil(r.right - box.left)); h = Math.max(h, Math.ceil(r.bottom - box.top)); });
                    clone.style.width = `${w}px`; clone.style.height = `${h}px`;
                    // Browsers cap canvas size (about 16k px a side, ~150M px in total); stay under it and trade sharpness only for very large charts.
                    const scale = Math.max(0.3, Math.min(2, 16000 / w, 16000 / h, Math.sqrt(150e6 / (w * h))));
                    const canvas = await html2canvas(clone, { scale, useCORS: true, backgroundColor: '#ffffff', logging: false, width: w, height: h, windowWidth: viewportWidth, windowHeight: window.innerHeight, scrollX: 0, scrollY: 0 });
                    // One page whose proportions match the chart, so no branch is ever split across pages. Small charts print at A3-ish size, big ones grow (PDF viewers zoom) up to the 5000mm page limit.
                    const margin = 8, mmPerPx = Math.min(5000 / Math.max(w, h), Math.max(400 / Math.max(w, h), 0.1));
                    const innerW = w * mmPerPx, innerH = h * mmPerPx;

                        pdf.addPage(chartPage, orient(chartPage));

                        pdf = new jsPDF({ unit: 'mm', format: chartPage, orientation: orient(chartPage), compress: true });
                    }
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, innerW, innerH);
                    pdf.save(`orgchart_${currentDept}_${new Date().toISOString().slice(0,10)}.pdf`);

                            {viewMode === 'skills' ? (
                                <SkillMatrixPage employees={allEmployeesWithIds} currentDept={currentDept} departments={departments} subDepartments={subDepartments} positions={positions} currentUser={currentUser} driveUrl={driveUrl} apiCall={appApiCall} onSessionExpired={handleSkillSessionExpired} searchTerm={searchTerm} />
                            ) : viewMode === 'turnover' ? (
                                <TurnoverDashboard employees={allEmployeesWithIds} currentDept={currentDept} />
                            ) : viewMode === 'monitor' ? (
                                <AttendanceMonitor data={attendanceData} loading={attendanceLoading} error={attendanceError} onRefresh={reloadAttendance} lastUpdated={attendanceUpdatedAt} />
                            ) : viewMode === 'attendance' ? (
                                <AttendancePanel data={attendanceData} currentUser={currentUser} currentDept={currentDept} loading={attendanceLoading} savingType={attendanceSavingType} error={attendanceError} notice={attendanceNotice} onSaveBatch={handleAttendanceBatchSave} onRefresh={reloadAttendance} selectedDate={attendanceDate} onDateChange={setAttendanceDate}/>
                            ) : viewMode === 'chart' ? (
                                <div className="flex flex-col items-center min-w-max" style={{ transform: `scale(${zoom})`, transformOrigin: 'top center' }}>
                                    <DraggableLogo logo={logo} setLogo={setLogo} isLocked={isLocked} />
                                    {annotations.map(ann => <DraggableAnnotation key={ann.id} ann={ann} onUpdate={(id, up) => setAnnotations(prev=>prev.map(a=>a.id===id?{...a,...up}:a))} onDelete={(id)=>setAnnotations(prev=>prev.filter(a=>a.id!==id))} isLocked={isLocked} onLinkStart={setLinkStartId} />)}
                                    <div id="org-chart-full-view" className="bg-white p-8 rounded-2xl border shadow-xl inline-block min-w-[800px] org-chart-container relative">
                                        <div className="mb-8 border-b-2 pb-2"><h1 className="text-3xl font-bold text-gray-800 uppercase">{deptName}</h1></div>
                                        <SkillSummaryContext.Provider value={chartSkillSummaries}>
                                        <div className="flex gap-16 justify-center">
                                            {rootEmployees.map(root => <EmployeeNode key={root.id} employee={root} allEmployees={filteredAll} onEdit={(e)=>{setEditingEmployee({...e, isNew:false}); setIsModalOpen(true);}} onDrop={handleDropNode} isLocked={isLocked} themeConf={THEMES[appTheme]} shapeClass={appShape} selectionMode={selectionMode} selectedIds={selectedIds} toggleSelection={(id)=>setSelectedIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev, id])} onAddChild={(p)=>{setEditingEmployee({isNew:true, reportsTo:p.id, dept:p.dept}); setIsModalOpen(true);}} layoutThreshold={layoutThreshold} searchTerm={searchTerm} onReorder={handleReorder} onGridColChange={handleGridColChange} currentUser={currentUser} isAllDepts={currentDept === 'ALL'}/>)}
                                        </div>
                                        </SkillSummaryContext.Provider>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex flex-col h-full bg-white rounded-xl shadow-sm border overflow-hidden">
                                    <div className="flex flex-col gap-3 border-b bg-gray-50 p-4 sm:flex-row sm:items-center sm:justify-between">
                                        <div className="flex flex-wrap items-center gap-2">
                                            <button type="button" onClick={()=>setShowEmployeeHistory(false)} className={`rounded-lg px-3 py-2 text-sm font-bold ${!showEmployeeHistory ? 'bg-blue-700 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}`}>พนักงานปัจจุบัน ({scopedActiveCount})</button>
                                            <button type="button" onClick={()=>setShowEmployeeHistory(true)} className={`rounded-lg px-3 py-2 text-sm font-bold ${showEmployeeHistory ? 'bg-slate-700 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}`}>ประวัติลาออก ({scopedHistoryCount})</button>
                                            <span className="text-xs text-gray-500">แสดง {processedEmployees.length} รายการ</span>
                                        </div>
                                        <div className="flex flex-col gap-2 sm:flex-row sm:items-center">
                                            <label className="flex min-h-10 min-w-0 items-center gap-2 rounded-lg border border-gray-300 bg-white px-3 text-gray-400 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100 sm:w-80">
                                                <Icons.Search size={16}/>
                                                <input value={searchTerm} onChange={event=>setSearchTerm(event.target.value)} placeholder="ค้นหาชื่อ รหัส แผนก ตำแหน่ง..." aria-label="ค้นหาในตารางรายชื่อ" className="min-w-0 flex-1 bg-transparent text-sm text-gray-700 outline-none placeholder:text-gray-400"/>
                                                {searchTerm && <button type="button" onClick={()=>setSearchTerm('')} aria-label="ล้างคำค้นหา" className="text-gray-400 hover:text-gray-700"><Icons.X size={15}/></button>}
                                            </label>
                                            <button onClick={exportCSV} className="flex min-h-10 items-center justify-center gap-2 rounded-lg bg-green-600 px-3 text-sm text-white shadow-sm hover:bg-green-700"><Icons.FileSpreadsheet size={16}/> Export CSV</button>
                                            <button onClick={exportPDF} className="flex min-h-10 items-center justify-center gap-2 rounded-lg bg-red-600 px-3 text-sm text-white shadow-sm hover:bg-red-700"><Icons.FileText size={16}/> Export PDF</button>
                                        </div>
                                    </div>
                                    <div className="overflow-auto flex-1">
                                        <table className="min-w-full divide-y">
                                            <thead className="bg-gray-100 sticky top-0 z-10 shadow-sm">
                                                <tr>
                                                    {['ID','Name','Dept','Sub-dept','Shift','Position','Type','Status','Phone','Start Date','Company', ...(showEmployeeHistory ? ['Exit Date', 'Leader at exit', 'Reason'] : [])].map(h => (
                                                        <th key={h} className="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" onClick={()=>requestSort(h==='ID'?'id':h==='Name'?'name':h==='Dept'?'dept':h==='Sub-dept'?'subDept':h==='Shift'?'shift':h==='Position'?'position':h==='Type'?'type':h==='Status'?'status':h==='Phone'?'phone':h==='Start Date'?'startDate':h==='Exit Date'?'exitDate':'company')}>
                                                            <div className="flex items-center">{h} <Icons.Sort size={12} className="ml-1 opacity-50"/></div>
                                                        </th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y bg-white">
                                                {processedEmployees.length === 0 && <tr><td colSpan={11} className="px-4 py-10 text-center text-sm text-gray-500">{searchTerm ? `ไม่พบรายชื่อที่ตรงกับ “${searchTerm}”` : 'ไม่พบพนักงานในแผนกนี้'}</td></tr>}
                                                {processedEmployees.map(emp => (
                                                    <tr key={emp.id} className="hover:bg-blue-50 cursor-pointer transition-colors" onClick={()=>{setEditingEmployee({...emp, isNew:false}); setIsModalOpen(true);}}>
                                                        <td className="px-4 py-3 text-sm font-mono text-gray-500">{emp.id}</td>
                                                        <td className="px-4 py-3 text-sm font-medium text-gray-900 flex items-center gap-2"><img src={formatDriveUrl(emp.image)} className="w-6 h-6 rounded-full bg-gray-200"/>{emp.name}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-600"><span className="px-2 py-0.5 rounded-full bg-gray-100 text-xs">{showEmployeeHistory ? (emp.exitDept || emp.dept) : emp.dept}</span></td>
                                                        <td className="px-4 py-3 text-sm text-gray-600">{(showEmployeeHistory ? (emp.exitSubDept || emp.subDept) : emp.subDept) || <span className="text-gray-400">ไม่ระบุ</span>}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-600">{['A', 'B'].includes(String(emp.shift || '').toUpperCase()) ? <span className="rounded-full bg-indigo-100 px-2 py-0.5 text-xs font-bold text-indigo-700">กะ {String(emp.shift).toUpperCase()}</span> : <span className="text-gray-400">ไม่มีกะ</span>}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-600">{emp.position}</td>
                                                        <td className="px-4 py-3 text-sm"><span className={`px-2 py-1 rounded-full text-xs font-bold ${emp.type==='Permanent'?'bg-green-100 text-green-800':'bg-orange-100 text-orange-800'}`}>{emp.type}</span></td>
                                                        <td className="px-4 py-3 text-sm"><span className={`w-2 h-2 rounded-full inline-block mr-2 ${emp.status==='Active'?'bg-green-500':'bg-red-500'}`}></span>{emp.status}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-500">{emp.phone}</td>
                                                        <td className="px-4 py-3 text-sm text-gray-500"><div>{formatDate(emp.startDate)}</div><div className="text-[10px] text-gray-400">{calculateTenure(emp.startDate)}</div></td>
                                                        <td className="px-4 py-3 text-sm text-gray-500">{emp.company}</td>
                                                        {showEmployeeHistory && <td className="px-4 py-3 text-sm text-gray-500">{formatDate(emp.exitDate) || <span className="text-gray-400">ไม่ระบุ</span>}</td>}
                                                        {showEmployeeHistory && <td className="px-4 py-3 text-sm text-gray-500">{emp.exitManagerName || employees.find(m => String(m.id) === String(emp.reportsTo))?.name || <span className="text-gray-400">-</span>}</td>}
                                                        {showEmployeeHistory && <td className="px-4 py-3 text-sm text-gray-500" title={emp.exitNote || ''}>{EXIT_REASONS[emp.exitReason] || <span className="text-gray-400">ไม่ระบุ</span>}</td>}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {selectionMode && selectedIds.length > 0 && (
                                <div className="batch-actions">
                                    <span className="text-sm font-bold text-gray-600">{selectedIds.length} Selected</span>
                                    <div className="h-6 w-px bg-gray-200 mx-2"></div>
                                    <span className="text-xs text-gray-400 mr-2">Transfer To:</span>
                                    {departments.map(d => <button key={d} onClick={()=>handleTransferToDept(d)} className="px-2 py-1 text-xs bg-blue-50 text-blue-600 rounded hover:bg-blue-100">{d}</button>)}
                                    <button onClick={()=>{if(!confirm(`Delete ${selectedIds.length} employees?`)) return; updateStateFull(employees.filter(e=>!selectedIds.includes(e.id)), [], selectedIds); setSelectedIds([]); setSelectionMode(false);}} className="p-2 text-red-600 ml-4"><Icons.Trash2 size={16}/></button>
                                </div>
                            )}

                            {viewMode === 'chart' && (
                                <>
                                    <div className="zoom-controls"><button onClick={()=>setZoom(z=>Math.max(0.3,z-0.1))}><Icons.ZoomOut/></button><span className="text-xs font-mono">{Math.round(zoom*100)}%</span><button onClick={()=>setZoom(z=>Math.min(1.5,z+0.1))}><Icons.ZoomIn/></button></div>
                                    {!isLocked && historyIndex > 0 && <div className="undo-controls"><button onClick={handleUndo} className="bg-white text-gray-700 p-3 rounded-full shadow-lg border hover:bg-gray-50 flex items-center gap-2 group undo-btn" title="Undo Last Action"><Icons.RotateCcw size={20}/></button></div>}
                                </>
                            )}
                        </main>
                    </div>

                    {viewMode === 'chart' && <SkillRadarHost employees={employees} data={chartSkillData}/>}
                    {jobDescriptionId !== null && (() => {
                        const target = employees.find(e => String(e.id) === String(jobDescriptionId));
                        return target ? <JobDescriptionModal key={target.id} employee={target} manager={employees.find(e => String(e.id) === String(target.reportsTo))} canEdit={canEditJobDescription(currentUser, target)} onSave={handleSaveJobDescription} onTranslate={handleTranslateJobDescription} onClose={() => setJobDescriptionId(null)} /> : null;
                    })()}
                    {isModalOpen && <EmployeeForm employee={editingEmployee} supervisors={employees} positions={positions} positionRename={positionRename} depts={departments} subDepartments={subDepartments} onAddSubDept={handleAddSubDepartment} onDeleteSubDept={handleDeleteSubDepartment} onSave={handleSave} onCancel={()=>setIsModalOpen(false)} onDelete={handleDelete} currentUser={currentUser} driveUrl={driveUrl} onManagePositions={()=>setIsManagePositionsOpen(true)}/>}

                    {pendingShiftDrop && <div className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-950/50 p-4" role="dialog" aria-modal="true" aria-labelledby="drop-shift-title">
                        <div className="w-full max-w-md overflow-hidden rounded-2xl bg-white shadow-2xl">
                            <div className="border-b bg-slate-50 px-5 py-4">
                                <h2 id="drop-shift-title" className="text-lg font-bold text-slate-900">กำหนดกะก่อนย้ายพนักงาน</h2>
                                <p className="mt-1 text-sm text-slate-600">Leader {employees.find(employee => employee.id === pendingShiftDrop.targetId)?.name || ''} ยังไม่มีกะ กรุณาเลือกกะให้พนักงานแต่ละคน</p>
                                <p className="mt-1 text-xs text-slate-500">พนักงานที่มีกะอยู่แล้วจะคงกะเดิมไว้</p>
                            </div>
                            <div className="max-h-[50vh] space-y-3 overflow-y-auto p-5">
                                {employees.filter(employee => pendingShiftDrop.sourceIds.includes(employee.id) && !['A', 'B'].includes(String(employee.shift || '').trim().toUpperCase())).map(employee => (
                                    <label key={employee.id} className="flex items-center justify-between gap-3 rounded-xl border border-slate-200 p-3">
                                        <span className="min-w-0"><span className="block truncate font-semibold text-slate-900">{employee.name || employee.id}</span><span className="block text-xs text-slate-500">{employee.id}</span></span>
                                        <select aria-label={`เลือกกะของ ${employee.name || employee.id}`} value={pendingDropShifts[employee.id] || ''} onChange={event => setPendingDropShifts(previous => ({ ...previous, [employee.id]: event.target.value }))} className="min-h-11 w-32 rounded-lg border border-slate-300 bg-white px-3 font-semibold text-slate-800 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                                            <option value="">เลือกกะ</option><option value="A">กะ A</option><option value="B">กะ B</option>
                                        </select>
                                    </label>
                                ))}
                            </div>
                            <div className="flex justify-end gap-2 border-t bg-slate-50 px-5 py-4">
                                <button type="button" onClick={() => { setPendingShiftDrop(null); setPendingDropShifts({}); }} className="min-h-11 rounded-xl border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 hover:bg-slate-100">ยกเลิก</button>
                                <button type="button" disabled={employees.some(employee => pendingShiftDrop.sourceIds.includes(employee.id) && !['A', 'B'].includes(String(employee.shift || '').trim().toUpperCase()) && !['A', 'B'].includes(String(pendingDropShifts[employee.id] || '').trim().toUpperCase()))} onClick={() => { const pending = pendingShiftDrop; const shifts = pendingDropShifts; setPendingShiftDrop(null); setPendingDropShifts({}); applyDropReparent(pending.sourceIds, pending.targetId, shifts); }} className="min-h-11 rounded-xl bg-blue-700 px-4 text-sm font-bold text-white hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-50">กำหนดกะและย้าย</button>
                            </div>
                        </div>
                    </div>}
                    
                    {/* [V15] Admin Panel is now the central hub */}
                    {isAdminPanelOpen && <AdminPanel onClose={()=>setIsAdminPanelOpen(false)} driveUrl={driveUrl} setDriveUrl={setDriveUrl} apiCall={appApiCall} depts={departments} onAddDept={handleAddDept} onDeleteDept={handleDeleteDept} currentUser={currentUser} orgData={employees} onDataRecovered={(raw) => { const data = normalizeEmployees(raw); setEmployees(data); resetHistory(data); persistPendingSync([]); localStorage.setItem('orgData', JSON.stringify(data)); }}/>}
                    
                    {isManagePositionsOpen && <ManagePositionsModal positions={positions} onAdd={handleAddPosition} onDelete={handleDeletePosition} onRename={handleRenamePosition} canRename={currentUser?.role !== 'leader'} onClose={()=>setIsManagePositionsOpen(false)} />}
                    {isManageDeptsOpen && <ManageDeptsModal depts={departments} onAdd={handleAddDept} onDelete={handleDeleteDept} onClose={()=>setIsManageDeptsOpen(false)} />}
                    {isSummaryOpen && <SummaryDashboard employees={validEmployees} onClose={()=>setIsSummaryOpen(false)} departments={departments} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
