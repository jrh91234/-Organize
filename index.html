        const makeSampleSkills = (positions, forLine) => SKILL_SAMPLE.filter(s => s.line === forLine).map((s, index) => ({
            id: newSkillId() + index, category: s.category, code: s.code, name: s.name, wi: s.wi, wiRev: s.wi ? '00' : '', critical: s.critical,
            targetCount: forLine && s.category === 'process' ? 3 : 0, targetLevel: 3, required: sampleRequired(s.category, positions)
        }));

        const SkillPie = ({ level, size = 22, color, dashed = false }) => {
            const c = size / 2, r = size / 2 - 1.5;
            const fill = color || SKILL_LEVEL_COLORS[level] || SKILL_LEVEL_COLORS[0];
            const point = (angle) => `${c + r * Math.cos(angle)},${c + r * Math.sin(angle)}`;
            const quarter = (q) => { const a0 = -Math.PI / 2 + q * Math.PI / 2; return `M${c},${c} L${point(a0)} A${r},${r} 0 0 1 ${point(a0 + Math.PI / 2)} Z`; };
            const filled = level === null || level === undefined ? 0 : Math.max(0, Math.min(4, level));
            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} aria-hidden="true" className="shrink-0">
                    <circle cx={c} cy={c} r={r} fill="#ffffff"/>
                    {filled === 4 ? <circle cx={c} cy={c} r={r} fill={fill}/> : [0, 1, 2, 3].slice(0, filled).map(q => <path key={q} d={quarter(q)} fill={fill}/>)}
                    <line x1={c} y1={c - r} x2={c} y2={c + r} stroke={filled === 4 ? '#ffffff' : '#cbd5e1'} strokeWidth="0.8" opacity={filled === 4 ? 0.5 : 1}/>
                    <line x1={c - r} y1={c} x2={c + r} y2={c} stroke={filled === 4 ? '#ffffff' : '#cbd5e1'} strokeWidth="0.8" opacity={filled === 4 ? 0.5 : 1}/>
                    <circle cx={c} cy={c} r={r} fill="none" stroke={level === null || level === undefined ? (dashed ? '#f43f5e' : '#e2e8f0') : '#475569'} strokeWidth="1.2" strokeDasharray={dashed && (level === null || level === undefined) ? '2 2' : undefined}/>
                </svg>
            );
        };

        const SkillAvatar = ({ employee, size = 32 }) => {
            const [failed, setFailed] = useState(false);
            const initials = String(employee?.name || '?').replace(/^(mr|mrs|ms|miss|นาย|นาง|นางสาว)\.?\s*/i, '').slice(0, 2).toUpperCase();
            if (!employee?.image || failed) return <div className="flex shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-violet-100 to-blue-100 font-bold text-violet-700" style={{ width: size, height: size, fontSize: size * 0.36 }}>{initials}</div>;
            return <img src={formatDriveUrl(employee.image)} alt="" onError={() => setFailed(true)} referrerPolicy="no-referrer" className="shrink-0 rounded-full object-cover ring-2 ring-white" style={{ width: size, height: size }}/>;
        };

        // Everything the dashboard shows, from the employee list + catalog + levels, under the chosen filters.
        // ---- Skill radar: one person's levels (0-4) against what their position requires, optionally against the line average ----
        const SKILL_MAX_LEVEL = 4;
        const openSkillRadar = (employeeId) => window.dispatchEvent(new CustomEvent('open-skill-radar', { detail: { id: employeeId } }));
        // mode 'category' = one axis per skill category (average level); 'skill' = one axis per skill. Missing levels count as 0.
        const computeSkillRadar = (employee, catalog, levels, colleagues, mode) => {
            const skills = skillsForEmployee(catalog, employee);
            const levelMap = new Map((levels || []).map(l => [skillKey(l.employeeId, l.skillId), Number(l.level) || 0]));
            const levelOf = (emp, skill) => levelMap.get(skillKey(emp.id, skill.id)) ?? 0;
            const hasLevel = (skill) => levelMap.has(skillKey(employee.id, skill.id));
            const avgOf = (skillList, fn) => skillList.length ? skillList.reduce((n, sk) => n + fn(sk), 0) / skillList.length : 0;
            const others = (colleagues || []).filter(e => e.id !== employee.id);
            const groups = mode === 'category'
                ? SKILL_CATEGORIES.map(c => ({ label: c.label.split(' / ')[0], full: c.label, skills: skills.filter(sk => sk.category === c.key) })).filter(g => g.skills.length)
                : skills.map((sk, i) => ({ label: sk.code || `#${i + 1}`, full: sk.name, skills: [sk] }));
            const axes = groups.map(g => {
                const requiredSkills = g.skills.filter(sk => requiredSkillLevel(sk, employee.position) > 0);
                return {
                    label: g.label, full: g.full, count: g.skills.length,
                    value: avgOf(g.skills, sk => levelOf(employee, sk)),
                    required: avgOf(requiredSkills, sk => requiredSkillLevel(sk, employee.position)),
                    average: others.length ? avgOf(g.skills, sk => others.reduce((n, e) => n + levelOf(e, sk), 0) / others.length) : null,
                    rated: g.skills.some(hasLevel)
                };
            });
            const rows = skills.map(sk => ({ skill: sk, level: hasLevel(sk) ? levelOf(employee, sk) : null, required: requiredSkillLevel(sk, employee.position) }));
            return { axes, rows, colleagues: others.length };
        };
        const SkillRadarChart = ({ axes, showAverage, size = 380 }) => {
            const center = size / 2;
            const radius = size / 2 - 70;
            const n = axes.length;
            const point = (i, value, extra = 0) => {
                const angle = -Math.PI / 2 + (i * 2 * Math.PI) / n;
                const r = (Math.max(0, Math.min(SKILL_MAX_LEVEL, value)) / SKILL_MAX_LEVEL) * radius + extra;
                return [center + r * Math.cos(angle), center + r * Math.sin(angle), Math.cos(angle)];
            };
            const polygon = (fn) => axes.map((a, i) => point(i, fn(a)).slice(0, 2).map(v => v.toFixed(1)).join(',')).join(' ');
            const ring = (level) => axes.map((a, i) => point(i, level).slice(0, 2).map(v => v.toFixed(1)).join(',')).join(' ');
            const clip = (text) => String(text).length > 14 ? `${String(text).slice(0, 13)}…` : String(text);
            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="mx-auto w-full max-w-[420px]" role="img" aria-label="Skill radar chart">
                    {[1, 2, 3, 4].map(level => <polygon key={level} points={ring(level)} fill={level === 2 ? '#f8fafc' : 'none'} stroke="#cbd5e1" strokeWidth="1" strokeDasharray={level === SKILL_RELEASE_LEVEL ? '4 3' : undefined}/>)}
                    {axes.map((a, i) => { const [x, y] = point(i, SKILL_MAX_LEVEL); return <line key={a.label + i} x1={center} y1={center} x2={x} y2={y} stroke="#e2e8f0" strokeWidth="1"/>; })}
                    {[1, 2, 3, 4].map(level => <text key={level} x={center + 3} y={center - (level / SKILL_MAX_LEVEL) * radius - 2} fontSize="9" fill="#94a3b8">L{level}</text>)}
                    {showAverage && axes.every(a => a.average !== null) && <polygon points={polygon(a => a.average)} fill="#3b82f622" stroke="#3b82f6" strokeWidth="2" strokeDasharray="2 3"/>}
                    <polygon points={polygon(a => a.required)} fill="none" stroke="#f97316" strokeWidth="2" strokeDasharray="6 4"/>
                    <polygon points={polygon(a => a.value)} fill="#22c55e33" stroke="#16a34a" strokeWidth="2.5"/>
                    {axes.map((a, i) => { const [x, y] = point(i, a.value); return <circle key={a.label + i} cx={x} cy={y} r="3.5" fill="#16a34a"><title>{`${a.full}: ${(Math.round(a.value * 10) / 10)}${a.required ? ` (ต้อง ${Math.round(a.required * 10) / 10})` : ''}`}</title></circle>; })}
                    {axes.map((a, i) => { const [x, y, cos] = point(i, SKILL_MAX_LEVEL, 16); return <text key={a.label + i} x={x} y={y + 3} fontSize="11" fontWeight="600" fill="#334155" textAnchor={cos > 0.25 ? 'start' : cos < -0.25 ? 'end' : 'middle'}>{clip(a.label)}<title>{a.full}</title></text>; })}
                </svg>
            );
        };
        const SkillRadarModal = ({ employee, employees, data, onClose }) => {
            const catalog = data?.catalog || [];
            const line = employeeSkillLines(employee)[0];
            const colleagues = useMemo(() => (employees || []).filter(e => !isResignedEmployee(e) && skillSameText(e.dept, employee.dept) && inSkillLine(e, line)), [employees, employee, line]);
            const categoryAxes = useMemo(() => computeSkillRadar(employee, catalog, data?.levels, colleagues, 'category').axes.length, [employee, catalog, data, colleagues]);
            const [mode, setMode] = useState(categoryAxes >= 3 ? 'category' : 'skill');
            const [showAverage, setShowAverage] = useState(false);
            const radar = useMemo(() => computeSkillRadar(employee, catalog, data?.levels, colleagues, mode), [employee, catalog, data, colleagues, mode]);
            const required = radar.rows.filter(r => r.required > 0);
            const met = required.filter(r => (r.level ?? 0) >= r.required).length;
            const stations = radar.rows.filter(r => r.skill.category === 'process' && (r.level ?? -1) >= 3).length;
            const canDraw = radar.axes.length >= 3;
            const modes = [['category', 'ตามหมวดทักษะ'], ['skill', 'ตามทักษะรายตัว']];
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 p-4" onClick={onClose}>
                    <div className="flex max-h-[92vh] w-full max-w-3xl flex-col rounded-2xl bg-white shadow-2xl" onClick={e => e.stopPropagation()}>
                        <div className="flex items-start justify-between border-b bg-gray-50 px-6 py-4">
                            <div className="flex items-center gap-3">
                                <SkillAvatar employee={employee} size={48}/>
                                <div>
                                    <h2 className="text-lg font-bold">Skill Radar</h2>
                                    <p className="text-sm text-gray-600">{employee.name} · {employee.id}</p>
                                    <p className="text-xs text-gray-500">{employee.position}{employee.dept ? ` · ${employee.dept}` : ''}{line ? ` / ${line}` : ''}</p>
                                </div>
                            </div>
                            <button type="button" onClick={onClose} aria-label="ปิด"><Icons.X/></button>
                        </div>
                        <div className="grow overflow-y-auto p-6">
                            {radar.rows.length === 0 ? <p className="py-10 text-center text-sm text-gray-400">ยังไม่มีทักษะที่กำหนดให้ไลน์ของพนักงานคนนี้ (ตั้งค่าได้ที่ Skill Matrix → Settings)</p> : <>
                                <div className="mb-3 flex flex-wrap items-center gap-2">
                                    {modes.map(([key, label]) => <button key={key} type="button" onClick={() => setMode(key)} className={`rounded-full border px-3 py-1 text-xs font-bold ${mode === key ? 'border-blue-600 bg-blue-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'}`}>{label}</button>)}
                                    <label className="ml-auto flex items-center gap-1.5 text-xs font-semibold text-gray-600"><input type="checkbox" checked={showAverage} onChange={e => setShowAverage(e.target.checked)} disabled={radar.colleagues === 0}/>เทียบค่าเฉลี่ยของไลน์ ({radar.colleagues} คน)</label>
                                </div>
                                <div className="mb-3 flex flex-wrap gap-2 text-xs font-bold">
                                    {required.length > 0 && <span className={`rounded-full px-3 py-1 ${met === required.length ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>ผ่านเกณฑ์ {met}/{required.length}</span>}
                                    <span className="rounded-full bg-indigo-100 px-3 py-1 text-indigo-700" title="สถานีที่ทำได้ระดับ 3 ขึ้นไป">★ {stations} สถานี</span>
                                </div>
                                {canDraw ? <SkillRadarChart axes={radar.axes} showAverage={showAverage}/> : <p className="py-6 text-center text-sm text-gray-400">ต้องมีอย่างน้อย 3 แกนจึงจะวาด Radar ได้ (ตอนนี้มี {radar.axes.length}) ดูรายละเอียดในตารางด้านล่าง</p>}
                                <div className="mb-4 mt-2 flex flex-wrap justify-center gap-4 text-[11px] font-semibold text-gray-600">
                                    <span className="flex items-center gap-1"><i className="inline-block h-0.5 w-5 bg-green-600"></i>ระดับปัจจุบัน</span>
                                    <span className="flex items-center gap-1"><i className="inline-block h-0.5 w-5 border-t-2 border-dashed border-orange-500"></i>ระดับที่ตำแหน่งต้องการ</span>
                                    {showAverage && <span className="flex items-center gap-1"><i className="inline-block h-0.5 w-5 border-t-2 border-dotted border-blue-500"></i>ค่าเฉลี่ยไลน์</span>}
                                </div>
                                <table className="w-full text-xs">
                                    <thead><tr className="text-left text-gray-500"><th className="py-1 pr-2">ทักษะ</th><th className="px-2">หมวด</th><th className="px-2 text-center">ระดับ</th><th className="px-2 text-center">ต้องการ</th><th className="pl-2 text-center">สถานะ</th></tr></thead>
                                    <tbody>
                                        {radar.rows.map(r => {
                                            const category = skillCategory(r.skill.category);
                                            const ok = r.required > 0 && (r.level ?? 0) >= r.required;
                                            const gap = r.required > 0 && (r.level ?? 0) < r.required;
                                            return (
                                                <tr key={r.skill.id} className="border-t">
                                                    <td className="py-1.5 pr-2 font-semibold text-gray-800">{r.skill.code ? <span className="mr-1 text-gray-400">{r.skill.code}</span> : null}{r.skill.name}</td>
                                                    <td className={`px-2 ${category.text}`}>{category.label}</td>
                                                    <td className="px-2 text-center font-bold" style={{ color: r.level === null ? '#94a3b8' : SKILL_LEVEL_COLORS[r.level] }}>{r.level === null ? '-' : `L${r.level}`}</td>
                                                    <td className="px-2 text-center text-gray-600">{r.required > 0 ? `L${r.required}` : '-'}</td>
                                                    <td className="pl-2 text-center">{ok ? <span className="font-bold text-emerald-600">✓</span> : gap ? <span className="font-bold text-rose-600">ต่ำกว่าเกณฑ์</span> : <span className="text-gray-300">-</span>}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </>}
                        </div>
                    </div>
                </div>
            );
        };
        // Listens for 'open-skill-radar' (card strip, matrix rows) and shows the radar for that person with the given Skill Matrix data.
        const SkillRadarHost = ({ employees, data }) => {
            const [employeeId, setEmployeeId] = useState(null);
            useEffect(() => {
                const open = (event) => setEmployeeId(event.detail?.id ?? null);
                window.addEventListener('open-skill-radar', open);
                return () => window.removeEventListener('open-skill-radar', open);
            }, []);
            const employee = employeeId === null ? null : (employees || []).find(e => String(e.id) === String(employeeId));
            return employee ? <SkillRadarModal key={employee.id} employee={employee} employees={employees} data={data} onClose={() => setEmployeeId(null)} /> : null;
        };
        const computeSkillStats = (employees, data, { dept, line, position, shift }) => {
            const catalog = data.catalog || [];
            const levelMap = new Map((data.levels || []).map(l => [skillKey(l.employeeId, l.skillId), l]));
            const inDept = (e) => dept === 'ALL' || e.dept === dept;
            const active = employees.filter(e => !isResignedEmployee(e) && inDept(e));
            const inLine = active.filter(e => line === 'ALL' || inSkillLine(e, line));
            const people = inLine.filter(e => (position === 'ALL' || e.position === position) && (shift === 'ALL' || (e.shift || '-') === shift));
            const skillsInScope = new Map();
            const topGaps = new Map(), byPosition = new Map(), byLine = new Map();
            const levelCounts = [0, 0, 0, 0, 0];
            let unassessed = 0, multiSkilled = 0;
            const rows = people.map(emp => {
                const skills = skillsForEmployee(catalog, emp);
                let gapPoints = 0, gapSkills = 0, stations = 0, hasRequirement = false;
                skills.forEach(skill => {
                    skillsInScope.set(skill.id, skill);
                    const rec = levelMap.get(skillKey(emp.id, skill.id));
                    const level = rec ? rec.level : null;
                    const req = requiredSkillLevel(skill, emp.position);
                    if (req > 0) hasRequirement = true;
                    if (level === null) { if (req > 0) unassessed++; } else levelCounts[level]++;
                    if (skill.category === 'process' && (level ?? -1) >= 3) stations++;
                    const gap = req > 0 ? Math.max(0, req - (level ?? 0)) : 0;
                    if (gap > 0) {
                        gapPoints += gap; gapSkills++;
                        const t = topGaps.get(skill.name) || { name: skill.name, count: 0, critical: skill.critical };
                        t.count++; topGaps.set(skill.name, t);
                    }
                });
                if (stations >= 3) multiSkilled++;
                const pos = emp.position || '-';
                const p = byPosition.get(pos) || { name: pos, sum: 0, n: 0, required: false };
                p.sum += gapPoints; p.n++; if (hasRequirement) p.required = true; byPosition.set(pos, p);
                if (gapSkills > 0) {
                    const lineName = `${dept === 'ALL' ? `${emp.dept} / ` : ''}${skillLine(emp.subDept) || SKILL_NO_LINE_LABEL}`;
                    byLine.set(lineName, (byLine.get(lineName) || 0) + 1);
                }
                return { emp, gapPoints, gapSkills, stations };
            });
            // Station coverage (3x3): per line, how many people are at the target level and how many can be released per shift.
            const coverage = [];
            const lineGroups = new Map();
            inLine.forEach(e => employeeSkillLines(e).filter(l => line === 'ALL' || l === line).forEach(l => { const k = `${e.dept}\u0000${l}`; if (!lineGroups.has(k)) lineGroups.set(k, []); lineGroups.get(k).push(e); }));
            lineGroups.forEach((members, k) => {
                const [d, l] = k.split('\u0000');
                skillsForLine(catalog, d, l).filter(s => s.targetCount > 0).forEach(skill => {
                    const levelOf = (e) => levelMap.get(skillKey(e.id, skill.id))?.level ?? -1;
                    const qualified = members.filter(e => levelOf(e) >= (skill.targetLevel || 3)).length;
                    const release = (s) => members.filter(e => (e.shift || '') === s && levelOf(e) >= SKILL_RELEASE_LEVEL).length;
                    const trainers = members.filter(e => levelOf(e) >= 4).length;
                    coverage.push({ skill, dept: d, line: l, qualified, target: skill.targetCount, shortage: Math.max(0, skill.targetCount - qualified), releaseA: release('A'), releaseB: release('B'), trainers });
                });
            });
            coverage.sort((a, b) => b.shortage - a.shortage || (b.skill.critical ? 1 : 0) - (a.skill.critical ? 1 : 0) || a.line.localeCompare(b.line) || compareSkills(a.skill, b.skill));
            const peopleIds = new Set(people.map(e => e.id));
            const employeeById = new Map(employees.map(e => [e.id, e]));
            const skillById = new Map(catalog.map(s => [s.id, s]));
            const recent = (data.history || [])
                .filter(h => h.newLevel !== null && h.newLevel > (h.oldLevel ?? 0) && peopleIds.has(h.employeeId) && skillById.has(h.skillId))
                .sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp)))
                .slice(0, 6)
                .map(h => ({ ...h, employee: employeeById.get(h.employeeId), skill: skillById.get(h.skillId), delta: h.newLevel - (h.oldLevel ?? 0) }));
            const withGap = rows.filter(r => r.gapSkills > 0).length;
            const skills = [...skillsInScope.values()];
            return {
                total: rows.length, withGap, meet: rows.length - withGap,
                skillsTracked: skills.length, criticalCount: skills.filter(s => s.critical).length,
                topGaps: [...topGaps.values()].sort((a, b) => b.count - a.count).slice(0, 5),
                byPosition: [...byPosition.values()].filter(p => p.n > 0 && p.required).map(p => ({ name: p.name, value: p.sum / p.n, n: p.n })).sort((a, b) => b.value - a.value).slice(0, 6),
                byLine: [...byLine.entries()].map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count),
                coverage, shortStations: coverage.filter(c => c.shortage > 0).length,
                trainingNeed: coverage.filter(c => c.shortage > 0).slice(0, 5),
                recent, levelCounts, unassessed, multiSkilled,
                lineCount: lineGroups.size
            };
        };

        const SkillDonut = ({ items, total, label }) => {
            const size = 150, stroke = 26, r = (size - stroke) / 2, circ = 2 * Math.PI * r;
            const sum = items.reduce((s, i) => s + i.count, 0);
            let offset = 0;
            return (
                <div className="flex flex-wrap items-center gap-4">
                    <div className="relative" style={{ width: size, height: size }}>
                        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="-rotate-90">
                            <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#f1f5f9" strokeWidth={stroke}/>
                            {sum > 0 && items.map((item, i) => {
                                const len = (item.count / sum) * circ;
                                const seg = <circle key={item.name} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={SKILL_CHART_COLORS[i % SKILL_CHART_COLORS.length]} strokeWidth={stroke} strokeDasharray={`${Math.max(0, len - 2)} ${circ}`} strokeDashoffset={-offset}><title>{`${item.name}: ${item.count}`}</title></circle>;
                                offset += len;
                                return seg;
                            })}
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className="text-[11px] font-semibold text-gray-500">รวม</span>
                            <span className="text-3xl font-extrabold leading-none text-gray-900">{total}</span>
                            <span className="text-[11px] font-semibold text-gray-500">{label}</span>
                        </div>
                    </div>
                    <ul className="min-w-0 flex-1 space-y-1.5 text-xs">
                        {items.length === 0 && <li className="text-gray-400">ไม่มี Gap 🎉</li>}
                        {items.slice(0, 8).map((item, i) => (
                            <li key={item.name} className="flex items-center gap-2">
                                <span className="h-2.5 w-2.5 shrink-0 rounded-full" style={{ background: SKILL_CHART_COLORS[i % SKILL_CHART_COLORS.length] }}></span>
                                <span className="min-w-0 flex-1 truncate text-gray-700">{item.name}</span>
                                <span className="font-bold text-gray-900">{Math.round((item.count / Math.max(1, sum)) * 100)}%</span>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        };

        const SkillCard = ({ icon, title, children, action, className = '' }) => (
            <div className={`rounded-2xl border border-gray-100 bg-white p-4 shadow-sm ${className}`}>
                <div className="mb-3 flex items-center gap-2">
                    {icon && <span className="flex h-7 w-7 items-center justify-center rounded-lg bg-blue-600 text-white">{icon}</span>}
                    <h3 className="flex-1 text-sm font-bold text-gray-800">{title}</h3>
                    {action}
                </div>
                {children}
            </div>
        );

        const SkillDashboard = ({ stats, employees, onOpenMatrix, onOpenSettings, hasCatalog, canEdit }) => {
            const pct = (n) => stats.total ? Math.round((n / stats.total) * 100) : 0;
            if (!hasCatalog) return (
                <div className="flex flex-col items-center rounded-3xl border border-dashed border-violet-200 bg-white px-6 py-14 text-center shadow-sm">
                    <div className="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-500 to-blue-600 text-white shadow-lg"><Icons.GraduationCap size={30}/></div>
                    <h2 className="text-lg font-bold text-gray-900">ยังไม่มีรายการทักษะของแผนกนี้</h2>
                    <p className="mt-1 max-w-md text-sm text-gray-500">เริ่มจากกำหนดสถานี / ทักษะ และระดับที่แต่ละตำแหน่งต้องมี แล้วจึงใส่ระดับของพนักงานในหน้า Matrix</p>
                    <button type="button" onClick={onOpenSettings} className="mt-5 rounded-xl bg-violet-600 px-4 py-2 text-sm font-bold text-white shadow hover:bg-violet-700">{canEdit ? 'ตั้งค่ารายการทักษะ' : 'ดูหน้าตั้งค่าทักษะ'}</button>
                </div>
            );
            const kpis = [
                { label: 'พนักงานทั้งหมด', value: stats.total, unit: 'คน', hint: `${stats.lineCount} ไลน์`, icon: <Icons.Users size={22}/>, tone: 'from-blue-50 to-blue-100/60 text-blue-700', iconTone: 'bg-blue-600' },
                { label: 'พนักงานที่มี Skill Gap', value: stats.withGap, unit: `คน (${pct(stats.withGap)}%)`, hint: stats.unassessed ? `ยังไม่ประเมิน ${stats.unassessed} ช่อง` : 'ต่ำกว่าระดับที่ตำแหน่งต้องมี', icon: <Icons.Alert size={22}/>, tone: 'from-rose-50 to-rose-100/60 text-rose-600', iconTone: 'bg-rose-500' },
                { label: 'ครบตาม Requirement', value: stats.meet, unit: `คน (${pct(stats.meet)}%)`, hint: `Multi-skill ≥3 สถานี: ${stats.multiSkilled} คน`, icon: <Icons.Check size={22}/>, tone: 'from-emerald-50 to-emerald-100/60 text-emerald-700', iconTone: 'bg-emerald-500' },
                { label: 'ทักษะที่ติดตาม', value: stats.skillsTracked, unit: 'ทักษะ', hint: `CC/SC ${stats.criticalCount} · สถานีต่ำกว่าเป้า ${stats.shortStations}`, icon: <Icons.Target size={22}/>, tone: 'from-violet-50 to-violet-100/60 text-violet-700', iconTone: 'bg-violet-600' }
            ];
            const maxGap = Math.max(1, ...stats.topGaps.map(g => g.count));
            const maxPos = Math.max(1, ...stats.byPosition.map(p => p.value));
            const levelTotal = stats.levelCounts.reduce((a, b) => a + b, 0);
            return (
                <div className="space-y-4">
                    <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
                        {kpis.map(k => (
                            <div key={k.label} className={`rounded-2xl border border-white bg-gradient-to-br p-4 shadow-sm ${k.tone}`}>
                                <div className="flex items-start gap-3">
                                    <span className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-white shadow ${k.iconTone}`}>{k.icon}</span>
                                    <div className="min-w-0">
                                        <div className="text-xs font-semibold text-gray-600">{k.label}</div>
                                        <div className="text-3xl font-extrabold leading-tight">{k.value}</div>
                                        <div className="text-xs font-semibold">{k.unit}</div>
                                    </div>
                                </div>
                                <div className="mt-2 truncate text-[11px] text-gray-500">{k.hint}</div>
                            </div>
                        ))}
                    </div>
                    <div className="grid gap-4 lg:grid-cols-2">
                        <SkillCard icon={<Icons.Alert size={15}/>} title="Top 5 Skill Gaps (จำนวนคน)">
                            {stats.topGaps.length === 0 ? <p className="py-6 text-center text-sm text-gray-400">ไม่มี Skill Gap</p> : stats.topGaps.map((g, i) => (
                                <div key={g.name} className="mb-2.5 flex items-center gap-3">
                                    <span className="w-40 shrink-0 truncate text-xs font-medium text-gray-700" title={g.name}>{g.name}{g.critical && <span className="ml-1 rounded bg-rose-600 px-1 text-[9px] font-bold text-white">{g.critical}</span>}</span>
                                    <div className="h-4 flex-1 overflow-hidden rounded-md bg-gray-100"><div className="h-full rounded-md transition-all" style={{ width: `${(g.count / maxGap) * 100}%`, background: SKILL_CHART_COLORS[i] }}></div></div>
                                    <span className="w-8 text-right text-sm font-bold text-gray-900">{g.count}</span>
                                </div>
                            ))}
                        </SkillCard>
                        <SkillCard icon={<Icons.Chart size={15}/>} title="Skill Gap by Position (ค่าเฉลี่ยระดับที่ขาดต่อคน)">
                            {stats.byPosition.every(p => p.value === 0) ? <p className="py-6 text-center text-sm text-gray-400">ทุกตำแหน่งครบตาม Requirement</p> : (
                                <div className="flex h-44 items-end gap-3 px-2">
                                    {stats.byPosition.map((p, i) => (
                                        <div key={p.name} className="flex h-full min-w-0 flex-1 flex-col items-center justify-end">
                                            <span className="text-sm font-bold text-gray-800">{p.value.toFixed(1)}</span>
                                            <div className="w-full max-w-[56px] rounded-t-lg" style={{ height: `${(p.value / maxPos) * 78}%`, minHeight: p.value ? 4 : 0, background: SKILL_CHART_COLORS[[0, 1, 4, 5, 3, 6][i] ?? i] }}></div>
                                            <span className="mt-1 w-full truncate text-center text-[11px] text-gray-600" title={`${p.name} (${p.n} คน)`}>{p.name}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </SkillCard>
                    </div>
                    <div className="grid gap-4 lg:grid-cols-3">
                        <SkillCard icon={<Icons.Grid size={15}/>} title="Skill Gap by Line (คนที่มี Gap)">
                            <SkillDonut items={stats.byLine} total={stats.withGap} label="คน"/>
                        </SkillCard>
                        <SkillCard icon={<Icons.Target size={15}/>} title="Training Need (สถานีที่คนไม่ถึงเป้า)">
                            {stats.trainingNeed.length === 0 ? <p className="py-6 text-center text-sm text-gray-400">ทุกสถานีมีคนถึงเป้าแล้ว</p> : (
                                <ul className="divide-y divide-gray-100">
                                    {stats.trainingNeed.map(c => (
                                        <li key={`${c.dept}|${c.line}|${c.skill.id}`} className="flex items-center gap-2 py-2 text-xs">
                                            <div className="min-w-0 flex-1">
                                                <div className="truncate font-semibold text-gray-800">{c.skill.name}{c.skill.critical && <span className="ml-1 rounded bg-rose-600 px-1 text-[9px] font-bold text-white">{c.skill.critical}</span>}</div>
                                                <div className="truncate text-[11px] text-gray-400">{c.line || SKILL_NO_LINE_LABEL} · มี L{c.skill.targetLevel}+ {c.qualified}/{c.target} คน</div>
                                            </div>
                                            <span className="rounded-full bg-rose-50 px-2 py-0.5 font-bold text-rose-600">ขาด {c.shortage}</span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </SkillCard>
                        <SkillCard icon={<Icons.ArrowUp size={15}/>} title="Recent Skill Improvement">
                            {stats.recent.length === 0 ? <p className="py-6 text-center text-sm text-gray-400">ยังไม่มีการเลื่อนระดับใน 6 เดือนล่าสุด</p> : (
                                <ul className="space-y-2">
                                    {stats.recent.map(r => (
                                        <li key={`${r.timestamp}|${r.employeeId}|${r.skillId}`} className="flex items-center gap-2 text-xs">
                                            <SkillAvatar employee={r.employee} size={30}/>
                                            <div className="min-w-0 flex-1">
                                                <div className="truncate font-semibold text-gray-800">{r.employee?.name || r.employeeId}</div>
                                                <div className="truncate text-[11px] text-gray-400">{r.skill.name} · L{r.oldLevel ?? 0} → L{r.newLevel} · {formatDate(r.assessedDate || r.timestamp)}</div>
                                            </div>
                                            <span className="font-extrabold text-emerald-600">+{r.delta}</span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </SkillCard>
                    </div>
                    <div className="grid gap-4 lg:grid-cols-3">
                        <SkillCard className="lg:col-span-2" icon={<Icons.Users size={15}/>} title={`Station Coverage 3×3 — คนที่ถึงเป้าต่อสถานี และคนที่ "ปล่อยงานได้" (L${SKILL_RELEASE_LEVEL}+) ต่อกะ`} action={<button type="button" onClick={onOpenMatrix} className="text-xs font-semibold text-violet-600 hover:underline">ดู Matrix ›</button>}>
                            {stats.coverage.length === 0 ? <p className="py-6 text-center text-sm text-gray-400">ยังไม่ได้ตั้งเป้าจำนวนคนต่อสถานี (ตั้งได้ในหน้าตั้งค่าทักษะ)</p> : (
                                <div className="max-h-80 overflow-auto">
                                    <table className="min-w-full text-xs">
                                        <thead className="sticky top-0 bg-white text-left text-[11px] text-gray-500"><tr>{['สถานี', 'ไลน์', 'ถึงเป้า', 'กะ A', 'กะ B', 'Trainer', 'สถานะ'].map(h => <th key={h} className="cursor-default px-2 py-1.5 font-bold hover:bg-white">{h}</th>)}</tr></thead>
                                        <tbody>
                                            {stats.coverage.map(c => {
                                                const ratio = c.target ? c.qualified / c.target : 1;
                                                const status = c.shortage === 0 ? ['ผ่าน', 'bg-emerald-100 text-emerald-700'] : ratio >= 0.5 ? ['เฝ้าระวัง', 'bg-amber-100 text-amber-700'] : ['เสี่ยง', 'bg-rose-100 text-rose-700'];
                                                return (
                                                    <tr key={`${c.dept}|${c.line}|${c.skill.id}`} className="border-t border-gray-100">
                                                        <td className="px-2 py-1.5 font-semibold text-gray-800">{c.skill.name}{c.skill.critical && <span className="ml-1 rounded bg-rose-600 px-1 text-[9px] font-bold text-white">{c.skill.critical}</span>}</td>
                                                        <td className="px-2 py-1.5 text-gray-500">{c.line || SKILL_NO_LINE_LABEL}</td>
                                                        <td className="px-2 py-1.5"><div className="flex items-center gap-2"><div className="h-1.5 w-16 overflow-hidden rounded-full bg-gray-100"><div className={`h-full rounded-full ${c.shortage ? 'bg-rose-400' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, ratio * 100)}%` }}></div></div><span className="font-bold">{c.qualified}/{c.target}</span></div></td>
                                                        <td className={`px-2 py-1.5 font-bold ${c.releaseA ? 'text-gray-800' : 'text-rose-500'}`}>{c.releaseA}</td>
                                                        <td className={`px-2 py-1.5 font-bold ${c.releaseB ? 'text-gray-800' : 'text-rose-500'}`}>{c.releaseB}</td>
                                                        <td className={`px-2 py-1.5 font-bold ${c.trainers ? 'text-indigo-600' : 'text-gray-300'}`}>{c.trainers}</td>
                                                        <td className="px-2 py-1.5"><span className={`rounded-full px-2 py-0.5 text-[10px] font-bold ${status[1]}`}>{status[0]}</span></td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </SkillCard>
                        <SkillCard icon={<Icons.Chart size={15}/>} title="สัดส่วนระดับทักษะ (ทุกช่องที่ประเมินแล้ว)">
                            <div className="flex h-4 overflow-hidden rounded-full bg-gray-100">
                                {stats.levelCounts.map((n, level) => n > 0 && <div key={level} style={{ width: `${(n / Math.max(1, levelTotal)) * 100}%`, background: SKILL_LEVEL_COLORS[level] }} title={`L${level}: ${n}`}></div>)}
                            </div>
                            <ul className="mt-3 space-y-1.5 text-xs">
                                {SKILL_LEVEL_INFO.map(info => (
                                    <li key={info.level} className="flex items-center gap-2">
                                        <SkillPie level={info.level} size={18}/>
                                        <span className="w-6 font-bold text-gray-700">L{info.level}</span>
                                        <span className="min-w-0 flex-1 truncate text-gray-500">{info.th}</span>
                                        <span className="font-bold text-gray-900">{stats.levelCounts[info.level]}</span>
                                    </li>
                                ))}
                                <li className="flex items-center gap-2 border-t pt-1.5"><SkillPie level={null} size={18} dashed/><span className="min-w-0 flex-1 text-gray-500">ต้องมีแต่ยังไม่ประเมิน</span><span className="font-bold text-rose-500">{stats.unassessed}</span></li>
                            </ul>
                        </SkillCard>
                    </div>
                </div>
            );
        };

        const SkillDocModal = ({ doc, onSave, onClose, saving }) => {
            const [form, setForm] = useState(doc);
            const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
            const field = (k, label, type = 'text') => (
                <label className="block text-xs font-semibold text-gray-600">{label}
                    <input type={type} value={form[k] ?? ''} onChange={e => set(k, e.target.value)} className="mt-1 w-full rounded-lg border p-2 text-sm font-normal text-gray-900 focus:border-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-100"/>
                </label>
            );
            return (
                <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/40 p-4" onClick={onClose}>
                    <form className="w-full max-w-xl rounded-2xl bg-white p-5 shadow-2xl" onClick={e => e.stopPropagation()} onSubmit={e => { e.preventDefault(); onSave(form); }}>
                        <h3 className="mb-1 text-lg font-bold text-gray-900">หัวเอกสาร Skill Matrix</h3>
                        <p className="mb-4 text-xs text-gray-500">{form.dept} / {form.subDept || SKILL_NO_LINE_LABEL} — เปลี่ยน WI หรือกระบวนการเมื่อไร ให้ขึ้น Rev. ใหม่และใส่วันที่ทบทวน</p>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="col-span-2">{field('title', 'ชื่อเอกสาร')}</div>
                            {field('docNo', 'เลขที่เอกสาร')}
                            {field('rev', 'Rev.')}
                            {field('effectiveDate', 'วันที่มีผล', 'date')}
                            <label className="block text-xs font-semibold text-gray-600">รอบการทบทวน
                                <select value={form.reviewMonths} onChange={e => set('reviewMonths', Number(e.target.value))} className="mt-1 w-full rounded-lg border p-2 text-sm font-normal">{[1, 3, 6, 12].map(m => <option key={m} value={m}>ทุก {m} เดือน</option>)}</select>
                            </label>
                            {field('lastReviewDate', 'วันที่ทบทวนล่าสุด', 'date')}
                            {field('preparedBy', 'ผู้จัดทำ')}
                            {field('checkedBy', 'ผู้ตรวจสอบ')}
                            {field('approvedBy', 'ผู้อนุมัติ')}
                        </div>
                        <div className="mt-5 flex justify-end gap-2">
                            <button type="button" onClick={onClose} className="rounded-lg border px-4 py-2 text-sm font-semibold text-gray-600 hover:bg-gray-50">ยกเลิก</button>
                            <button type="submit" disabled={saving} className="rounded-lg bg-violet-600 px-4 py-2 text-sm font-bold text-white hover:bg-violet-700 disabled:opacity-50">{saving ? 'กำลังบันทึก...' : 'บันทึก'}</button>
                        </div>
                    </form>
                </div>
            );
        };

        const SkillLevelPicker = ({ employee, skill, current, required, onPick, onClose }) => (
            <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/40 p-4" onClick={onClose}>
                <div className="w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl" onClick={e => e.stopPropagation()}>
                    <div className="mb-4 flex items-center gap-3">
                        <SkillAvatar employee={employee} size={44}/>
                        <div className="min-w-0">
                            <div className="truncate font-bold text-gray-900">{employee.name}</div>
                            <div className="truncate text-xs text-gray-500">{employee.id} · {employee.position}</div>
                            <div className="mt-0.5 truncate text-sm font-semibold text-violet-700">{skill.name}{skill.critical && <span className="ml-1 rounded bg-rose-600 px-1 text-[9px] font-bold text-white">{skill.critical}</span>}{required > 0 && <span className="ml-2 text-xs font-normal text-gray-500">ตำแหน่งนี้ต้องมี L{required}</span>}</div>
                        </div>
                    </div>
                    <div className="space-y-2">
                        {SKILL_LEVEL_INFO.map(info => (
                            <button key={info.level} type="button" autoFocus={info.level === (current ?? 0)} onClick={() => onPick(info.level)} className={`flex w-full items-center gap-3 rounded-xl border p-2.5 text-left transition hover:border-violet-300 hover:bg-violet-50 ${current === info.level ? 'border-violet-500 bg-violet-50 ring-2 ring-violet-200' : 'border-gray-200'}`}>
                                <SkillPie level={info.level} size={30}/>

        // The printable sheet (doc header + matrix + legend), used for both the on-screen table and the PDF.
        const SkillMatrixSheet = ({ dept, line, doc, skills, rows, levelOf, draft, editMode, onCellClick, onCellKey, printMode = false, onEditDoc, canEdit }) => {
            const groups = [];
            skills.forEach(skill => { const last = groups[groups.length - 1]; if (last && last.key === skill.category) last.count++; else groups.push({ key: skill.category, count: 1 }); });
            const nextReview = addMonthsToDay(doc.lastReviewDate || doc.effectiveDate, doc.reviewMonths || 6);

            const reviewState = !nextReview ? null : nextReview < today ? ['เลยกำหนดทบทวน', 'bg-rose-100 text-rose-700'] : nextReview <= addMonthsToDay(today, 1) ? ['ใกล้ถึงรอบทบทวน', 'bg-amber-100 text-amber-700'] : ['เป็นปัจจุบัน', 'bg-emerald-100 text-emerald-700'];
            const footer = skills.map(skill => {

            return (

                                            const gap = cell.req > 0 && (cell.level ?? 0) < cell.req;
                                            const info = cell.level === null ? 'ยังไม่ประเมิน' : `L${cell.level} ${SKILL_LEVEL_INFO[cell.level].th}`;
                                            const title = `${row.emp.name} · ${cell.skill.name}\n${info}${cell.req ? `\nตำแหน่งนี้ต้องมี L${cell.req}` : ''}${cell.rec && !changed ? `\nประเมิน ${cell.rec.assessedDate || '-'} โดย ${cell.rec.updatedBy || '-'}${cell.rec.source === 'system' ? ' (จากระบบอบรม)' : ''}` : ''}`;
                                            return (
                                                <td key={cell.skill.id} className={`border-b border-r border-gray-100 p-0 text-center ${gap ? 'bg-rose-50' : ''} ${changed ? 'bg-violet-100' : ''}`}>
                                                    {printMode ? <div className="flex h-9 items-center justify-center"><SkillPie level={cell.level} size={20} dashed={cell.req > 0}/></div> : (
                                                        <button type="button" title={title} aria-label={title} disabled={!editMode} onClick={() => onCellClick(row.emp, cell)} onKeyDown={e => onCellKey(e, row.emp, cell)}
                                                            className={`relative flex h-10 w-10 items-center justify-center focus:outline-none focus:ring-2 focus:ring-inset focus:ring-violet-500 ${editMode ? 'cursor-pointer hover:bg-violet-50' : 'cursor-default'}`}>

                                                            {gap && <span className="absolute right-0.5 top-0.5 h-1.5 w-1.5 rounded-full bg-rose-500"></span>}
                                                            {cell.rec?.source === 'system' && !changed && <span className="absolute bottom-0.5 right-0.5 h-1.5 w-1.5 rounded-full bg-sky-500"></span>}
                                                        </button>
                                                    )}
                                                </td>
                                            );
                                        })}
                                        <td className={`border-b border-r border-gray-100 text-center font-bold ${row.stations >= 3 ? 'text-emerald-600' : 'text-gray-400'}`}>{row.stations}</td>
                                        <td className={`border-b border-gray-100 text-center font-bold ${row.gapSkills ? 'text-rose-600' : 'text-emerald-600'}`}>{row.gapSkills || '✓'}</td>
                                    </tr>
                                ))}
                            </tbody>
                            {rows.length > 0 && (
                                <tfoot className="text-[11px]">
                                    {[
                                        ['เป้าหมาย (คน)', f => f.skill.targetCount ? `${f.skill.targetCount}` : '–', () => 'text-gray-500'],
                                        ['ถึงระดับเป้า', f => f.skill.targetCount ? `${f.qualified}` : `${f.qualified}`, f => !f.skill.targetCount ? 'text-gray-500' : f.qualified >= f.skill.targetCount ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-600'],
                                        [`ปล่อยงานได้ กะ A (L${SKILL_RELEASE_LEVEL}+)`, f => `${f.releaseA}`, f => f.releaseA ? 'text-gray-800' : 'text-rose-400'],
                                        [`ปล่อยงานได้ กะ B (L${SKILL_RELEASE_LEVEL}+)`, f => `${f.releaseB}`, f => f.releaseB ? 'text-gray-800' : 'text-rose-400']
                                    ].map(([label, value, tone], i) => (
                                        <tr key={label}>
                                            <td className={`${stickyCell} border-b border-r border-gray-200 bg-gray-50 px-3 py-1.5 text-right font-bold text-gray-600`}>{label}{i === 1 && <span className="ml-1 font-normal text-gray-400">(L ตามเป้าของสถานี)</span>}</td>
                                            {footer.map(f => <td key={f.skill.id} className={`border-b border-r border-gray-100 bg-gray-50/60 py-1.5 text-center font-bold ${tone(f)}`}>{value(f)}</td>)}
                                            <td colSpan={2} className="border-b border-gray-100 bg-gray-50/60"></td>
                                        </tr>
                                    ))}
                                </tfoot>
                            )}
                        </table>
                    </div>
                    <div className={`rounded-2xl border border-gray-200 bg-white px-4 py-3 ${printMode ? 'mt-3' : 'shadow-sm'}`}>
                        <div className="mb-2 text-xs font-bold text-gray-700">เกณฑ์ระดับทักษะ (Skill Level Criteria)</div>
                        <div className="grid gap-2 text-[11px] sm:grid-cols-5">
                            {SKILL_LEVEL_INFO.map(info => (
                                <div key={info.level} className="flex items-start gap-2">
                                    <SkillPie level={info.level} size={22}/>
                                    <div><div className="font-bold text-gray-800">L{info.level} · {info.th}</div><div className="text-gray-500">{info.criteria}</div></div>
                                </div>
                            ))}
                        </div>
                        <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 border-t pt-2 text-[10px] text-gray-500">
                            <span><span className="mr-1 inline-block h-2 w-2 rounded-full bg-rose-500"></span>ต่ำกว่าระดับที่ตำแหน่งต้องมี (Gap)</span>
                            <span><span className="mr-1 inline-block h-2.5 w-2.5 rounded-full border border-dashed border-rose-500 align-middle"></span>ต้องมีแต่ยังไม่ประเมิน</span>
                            <span><span className="mr-1 inline-block rounded bg-rose-600 px-1 font-bold text-white">CC/SC</span>Critical / Special characteristic</span>
                            <span>หลัก 3×3: แต่ละสถานีมีคน L3+ อย่างน้อยตามเป้า และแต่ละคนทำได้ ≥ 3 สถานี · คนที่ทำงานที่สถานีต้องอยู่ระดับ ≥ L{SKILL_RELEASE_LEVEL}</span>
                            {printMode && <span className="ml-auto">พิมพ์เมื่อ {formatDateTime(new Date().toISOString())}</span>}
                        </div>
                    </div>
                </div>
            );
        };

        const SkillMatrixView = ({ employees, data, dept, line, canEdit, call, onReload, searchTerm }) => {
            const [shift, setShift] = useState('ALL');
            const [position, setPosition] = useState('ALL');
            const [editMode, setEditMode] = useState(false);
            const [draft, setDraft] = useState({});
            const [picker, setPicker] = useState(null);
            const [assessedDate, setAssessedDate] = useState(getLocalDateValue());
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState(null);
            const [docOpen, setDocOpen] = useState(false);
            const [exporting, setExporting] = useState(false);
            const printRef = useRef(null);
            useEffect(() => { setDraft({}); setEditMode(false); setMessage(null); }, [dept, line]);
            const levelMap = useMemo(() => new Map((data.levels || []).map(l => [skillKey(l.employeeId, l.skillId), l])), [data.levels]);
            const levelOf = useCallback((employeeId, skillId) => {
                const key = skillKey(employeeId, skillId);
                if (Object.prototype.hasOwnProperty.call(draft, key)) return draft[key];
                return levelMap.get(key)?.level ?? null;
            }, [draft, levelMap]);
            const skills = useMemo(() => skillsForLine(data.catalog, dept, line), [data.catalog, dept, line]);
            const lineEmployees = useMemo(() => employees.filter(e => !isResignedEmployee(e) && e.dept === dept && inSkillLine(e, line)), [employees, dept, line]);
            const positionsHere = [...new Set(lineEmployees.map(e => e.position).filter(Boolean))].sort((a, b) => getPositionRank(b) - getPositionRank(a) || a.localeCompare(b));
            const query = String(searchTerm || '').trim().toLowerCase();
            const rows = lineEmployees
                .filter(e => (shift === 'ALL' || (e.shift || '-') === shift) && (position === 'ALL' || e.position === position) && (!query || `${e.name} ${e.id} ${e.position}`.toLowerCase().includes(query)))
                .sort((a, b) => getPositionRank(b.position) - getPositionRank(a.position) || String(a.shift || 'Z').localeCompare(String(b.shift || 'Z')) || String(a.id).localeCompare(String(b.id)))
                .map(emp => {
                    let gapSkills = 0, stations = 0;
                    const cells = skills.map(skill => {
                        const level = levelOf(emp.id, skill.id);
                        const req = requiredSkillLevel(skill, emp.position);
                        if (req > 0 && (level ?? 0) < req) gapSkills++;
                        if (skill.category === 'process' && (level ?? -1) >= 3) stations++;
                        return { skill, level, req, rec: levelMap.get(skillKey(emp.id, skill.id)) };
                    });
                    return { emp, cells, gapSkills, stations };
                });
            const savedDoc = (data.docs || []).find(d => skillSameText(d.dept, dept) && d.subDept === line);
            const doc = savedDoc || { dept, subDept: line, title: `Skill Matrix — ${line || dept}`, docNo: '', rev: '00', effectiveDate: '', preparedBy: '', checkedBy: '', approvedBy: '', reviewMonths: 6, lastReviewDate: '' };
            const draftCount = Object.keys(draft).length;
            const setLevel = (emp, skill, level) => {
                const key = skillKey(emp.id, skill.id);
                const original = levelMap.get(key)?.level ?? null;
                setDraft(prev => { const next = { ...prev }; if (level === original) delete next[key]; else next[key] = level; return next; });
            };
            const onCellClick = (emp, cell) => { if (editMode) setPicker({ emp, skill: cell.skill, req: cell.req }); };
            const onCellKey = (e, emp, cell) => {
                if (!editMode) return;
                if (/^[0-4]$/.test(e.key)) { e.preventDefault(); setLevel(emp, cell.skill, Number(e.key)); }
                else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); setLevel(emp, cell.skill, null); }
            };
            const save = async () => {
                if (!draftCount) return;
                setSaving(true); setMessage(null);
                try {
                    const items = Object.entries(draft).map(([key, level]) => { const [employeeId, skillId] = key.split('|'); return { employeeId, skillId, level }; });
                    const result = await call('saveSkillLevels', { items, assessedDate });
                    if (result?.status !== 'success') throw new Error(result?.message || 'บันทึกไม่สำเร็จ');
                    await onReload();
                    setDraft({});
                    setMessage({ ok: !result.errors?.length, text: result.errors?.length ? `บันทึกแล้ว ${result.changed} ช่อง · ${result.errors.join(' · ')}` : `บันทึกแล้ว ${result.changed} ช่อง` });
                } catch (error) {
                    setMessage({ ok: false, text: error?.message || 'บันทึกไม่สำเร็จ' });
                } finally { setSaving(false); }
            };
            const saveDoc = async (form) => {
                setSaving(true); setMessage(null);
                try {
                    const result = await call('saveSkillMatrixDoc', { doc: { ...form, dept, subDept: line } });
                    if (result?.status !== 'success') throw new Error(result?.message || 'บันทึกหัวเอกสารไม่สำเร็จ');
                    await onReload();
                    setDocOpen(false);
                    setMessage({ ok: true, text: 'บันทึกหัวเอกสารแล้ว' });
                } catch (error) { setMessage({ ok: false, text: error?.message || 'บันทึกหัวเอกสารไม่สำเร็จ' }); }
                finally { setSaving(false); }
            };
            const fileBase = `skill_matrix_${dept}_${line || 'no-line'}_Rev${doc.rev || '00'}`.replace(/[^\w.-]+/g, '_');
            const exportExcel = async () => {
                if (!window.ExcelJS) { alert('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ กรุณารีเฟรชหน้าแล้วลองใหม่'); return; }
                const wb = new window.ExcelJS.Workbook();
                const ws = wb.addWorksheet('Skill Matrix', { pageSetup: { paperSize: 8, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
                const firstSkillCol = 5, lastCol = firstSkillCol + skills.length + 1;
                ws.columns = [{ width: 10 }, { width: 28 }, { width: 16 }, { width: 6 }, ...skills.map(() => ({ width: 5 })), { width: 8 }, { width: 6 }];
                const thin = { style: 'thin', color: { argb: 'FFD1D5DB' } };
                const border = { top: thin, left: thin, bottom: thin, right: thin };
                ws.mergeCells(1, 1, 1, lastCol);
                ws.getCell(1, 1).value = doc.title || 'Skill Matrix';
                ws.getCell(1, 1).font = { bold: true, size: 16 };
                const meta = [['Doc No.', doc.docNo], ['Rev.', doc.rev], ['Effective', doc.effectiveDate], ['Line', `${dept} / ${line || SKILL_NO_LINE_LABEL}`], ['Prepared', doc.preparedBy], ['Checked', doc.checkedBy], ['Approved', doc.approvedBy], ['Last review', doc.lastReviewDate], ['Review cycle', `${doc.reviewMonths || 6} months`]];
                ws.getCell(2, 1).value = meta.map(([k, v]) => `${k}: ${v || '-'}`).join('    ');
                ws.mergeCells(2, 1, 2, lastCol);
                ws.getCell(2, 1).font = { size: 9, color: { argb: 'FF4B5563' } };
                const catRow = 4, nameRow = 5;
                let col = firstSkillCol;
                const groups = [];
                skills.forEach(s => { const last = groups[groups.length - 1]; if (last && last.key === s.category) last.count++; else groups.push({ key: s.category, count: 1 }); });
                groups.forEach(g => {
                    const cat = skillCategory(g.key);
                    if (g.count > 1) ws.mergeCells(catRow, col, catRow, col + g.count - 1);
                    const cell = ws.getCell(catRow, col);

                                            <td className="px-1"><select disabled={!canEdit} value={s.critical} onChange={e => onUpdate(i, { critical: e.target.value })} className={`${input} min-w-[76px] ${s.critical ? 'font-bold text-rose-600' : ''}`}><option value="">-</option><option value="CC">CC</option><option value="SC">SC</option></select></td>

                    {line && SkillTable({ title: `ทักษะเฉพาะไลน์ ${line}`, hint: `สถานี / เครื่องจักร / Quality ของไลน์นี้ · แสดงเฉพาะตำแหน่งของคนในไลน์ ${line}`, list: lineSkills, setter: setLineSkills, forLine: true })}
                    {SkillTable({ title: `ทักษะร่วมทั้งแผนก ${dept}`, hint: 'แสดงในทุกไลน์ของแผนกนี้ เช่น LOTO, PPE, 5S, การจัดการ NG', list: sharedSkills, setter: setSharedSkills, forLine: false })}
                    {canEdit && dirty && (

                            <button type="button" onClick={save} disabled={saving} className="rounded-lg bg-violet-600 px-4 py-1.5 text-xs font-bold text-white hover:bg-violet-700 disabled:opacity-50">{saving ? 'กำลังบันทึก...' : 'บันทึกรายการทักษะ'}</button>

        };

        const SKILL_CACHE_KEY = 'skillMatrixCache';
        const SkillMatrixPage = ({ employees, currentDept, departments, subDepartments, positions, currentUser, driveUrl, apiCall, onSessionExpired, searchTerm }) => {
            const [tab, setTab] = useState('dashboard');
            const [data, setData] = useState(() => { const cached = safeLocalLoad(SKILL_CACHE_KEY, null); return cached && Array.isArray(cached.catalog) ? cached : { catalog: [], levels: [], history: [], docs: [] }; });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [loadedAt, setLoadedAt] = useState(null);
            const [dept, setDept] = useState(currentDept);
            const [line, setLine] = useState('ALL');
            const [position, setPosition] = useState('ALL');
            const [shift, setShift] = useState('ALL');
            useEffect(() => { setDept(currentDept); setLine('ALL'); setPosition('ALL'); }, [currentDept]);
            const call = useCallback(async (action, payload) => {
                const result = await apiCall(driveUrl, action, payload);
                if (result?.code === 'session_expired') { onSessionExpired(); throw new Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); }
                return result;
            }, [apiCall, driveUrl, onSessionExpired]);
            const load = useCallback(async () => {
                if (!driveUrl) { setError('ยังไม่ได้ตั้งค่า URL ของระบบ'); return; }
                setLoading(true); setError('');
                try {
                    const result = await call('getSkillMatrix', {});
                    if (result?.status !== 'success') throw new Error(result?.message || (result?.error ? `Backend: ${result.error}` : 'โหลด Skill Matrix ไม่สำเร็จ'));
                    const next = { catalog: result.catalog || [], levels: result.levels || [], history: result.history || [], docs: result.docs || [] };
                    setData(next);
                    setLoadedAt(Date.now());
                    try { localStorage.setItem(SKILL_CACHE_KEY, JSON.stringify(next)); } catch (e) { /* cache is optional */ }
                } catch (err) {
                    setError(err?.message || 'โหลด Skill Matrix ไม่สำเร็จ');
                } finally { setLoading(false); }
            }, [call, driveUrl]);
            useEffect(() => { void load(); }, [load]);
            const activeEmployees = useMemo(() => employees.filter(e => !isResignedEmployee(e)), [employees]);
            // Matrix and settings work on one department; when the header is on "ALL" fall back to the first department that has people.
            const workDept = dept !== 'ALL' ? dept : (departments.find(d => activeEmployees.some(e => e.dept === d)) || departments[0] || '');
            const deptForLines = tab === 'dashboard' ? dept : workDept;
            const lineOptions = useMemo(() => {
                const set = new Set();
                const inDept = (d) => deptForLines === 'ALL' || d === deptForLines;
                Object.entries(subDepartments || {}).forEach(([d, list]) => { if (inDept(d)) (list || []).forEach(l => set.add(skillLine(l))); });
                activeEmployees.forEach(e => { if (inDept(e.dept)) employeeSkillLines(e).forEach(l => set.add(l)); });
                (data.catalog || []).forEach(s => { if (s.active !== false && s.subDept && inDept(s.dept)) set.add(s.subDept); });
                const hasNoLine = set.has('');
                set.delete('');
                const list = [...set].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
                if (hasNoLine) list.push('');
                return list;
            }, [subDepartments, activeEmployees, data.catalog, deptForLines]);
            const workLine = line !== 'ALL' && lineOptions.includes(line) ? line : (lineOptions.find(l => activeEmployees.some(e => e.dept === workDept && inSkillLine(e, l))) ?? lineOptions[0] ?? '');
            const stats = useMemo(() => computeSkillStats(employees, data, { dept, line, position, shift }), [employees, data, dept, line, position, shift]);
            const hasCatalog = (data.catalog || []).some(s => s.active !== false && (dept === 'ALL' || skillSameText(s.dept, dept)));
            const canEdit = canEditSkillMatrix(currentUser, workDept);
            const positionOptions = [...new Set(activeEmployees.filter(e => dept === 'ALL' || e.dept === dept).map(e => e.position).filter(Boolean))].sort((a, b) => getPositionRank(b) - getPositionRank(a) || a.localeCompare(b));
            const tabs = [['dashboard', 'Dashboard', <Icons.Chart size={15}/>], ['matrix', 'Matrix', <Icons.Grid size={15}/>], ['settings', 'ตั้งค่าทักษะ', <Icons.Settings size={15}/>]];
            const select = 'rounded-lg border border-gray-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-violet-200';
            return (
                <section className="mx-auto w-full max-w-7xl space-y-4 pb-10">
                    <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-950 via-violet-900 to-blue-800 px-5 py-5 text-white shadow-lg sm:px-6">
                        <div className="pointer-events-none absolute -right-10 -top-16 h-56 w-56 rounded-full bg-white/10 blur-2xl"></div>
                        <div className="pointer-events-none absolute -bottom-20 left-1/3 h-48 w-48 rounded-full bg-fuchsia-400/20 blur-3xl"></div>
                        <div className="relative flex flex-wrap items-start gap-4">
                            <span className="flex h-12 w-12 items-center justify-center rounded-2xl bg-white/15 ring-1 ring-white/20"><Icons.GraduationCap size={26}/></span>
                            <div className="min-w-0 flex-1">
                                <div className="text-xs font-semibold uppercase tracking-widest text-violet-200">Skill Matrix · ISO 9001 / IATF 16949</div>
                                <h1 className="text-xl font-extrabold sm:text-2xl">ทักษะพนักงาน — {tab === 'dashboard' ? (dept === 'ALL' ? 'ทุกแผนก' : dept) : `${workDept} / ${workLine || SKILL_NO_LINE_LABEL}`}</h1>
                                <p className="mt-0.5 text-xs text-violet-100/80">ใครอยู่ระดับไหน ขาดทักษะอะไร และแต่ละสถานีมีคนพร้อมปล่อยงานพอไหม{loadedAt ? ` · อัปเดต ${new Date(loadedAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}` : ''}</p>
                            </div>
                            <button type="button" onClick={() => void load()} disabled={loading} className="flex items-center gap-1.5 rounded-xl bg-white/15 px-3 py-2 text-xs font-bold ring-1 ring-white/20 hover:bg-white/25 disabled:opacity-60">{loading ? <Icons.Loader size={14}/> : <Icons.RefreshCw size={14}/>}รีเฟรช</button>
                        </div>
                        <div className="relative mt-4 flex flex-wrap items-center gap-2">
                            <div className="flex rounded-xl bg-black/20 p-1" role="tablist" aria-label="Skill Matrix">
                                {tabs.map(([key, label, icon]) => <button key={key} type="button" role="tab" aria-selected={tab === key} onClick={() => setTab(key)} className={`flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-bold transition ${tab === key ? 'bg-white text-violet-800 shadow' : 'text-violet-100 hover:bg-white/10'}`}>{icon}{label}</button>)}
                            </div>
                            <div className="ml-auto flex flex-wrap items-center gap-2">
                                <select value={tab === 'dashboard' ? dept : workDept} onChange={e => { setDept(e.target.value); setLine('ALL'); setPosition('ALL'); }} aria-label="แผนก" className={select}>
                                    {tab === 'dashboard' && <option value="ALL">ทุกแผนก</option>}
                                    {departments.map(d => <option key={d} value={d}>{d}</option>)}
                                </select>
                                <select value={tab === 'dashboard' ? line : workLine} onChange={e => setLine(e.target.value)} aria-label="ไลน์" className={select}>
                                    {tab === 'dashboard' && <option value="ALL">ทุกไลน์</option>}
                                    {lineOptions.map(l => <option key={l || '__none'} value={l}>{l || SKILL_NO_LINE_LABEL}</option>)}
                                </select>
                                {tab === 'dashboard' && <>
                                    <select value={position} onChange={e => setPosition(e.target.value)} aria-label="ตำแหน่ง" className={select}><option value="ALL">ทุกตำแหน่ง</option>{positionOptions.map(p => <option key={p} value={p}>{p}</option>)}</select>
                                    <select value={shift} onChange={e => setShift(e.target.value)} aria-label="กะ" className={select}><option value="ALL">ทุกกะ</option><option value="A">กะ A</option><option value="B">กะ B</option><option value="-">ไม่ระบุกะ</option></select>
                                </>}
                            </div>
                        </div>
                    </div>
                    {error && <div className="flex items-center justify-between gap-3 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700"><span>{error}</span><button type="button" onClick={() => void load()} className="rounded-lg bg-white px-3 py-1 text-xs font-bold text-rose-700 ring-1 ring-rose-200">ลองใหม่</button></div>}
                    {loading && !loadedAt && !hasCatalog && <div className="flex items-center justify-center gap-2 py-16 text-sm text-gray-500"><Icons.Loader size={18}/>กำลังโหลด Skill Matrix...</div>}
                    {!(loading && !loadedAt && !hasCatalog) && tab === 'dashboard' && <SkillDashboard stats={stats} employees={employees} hasCatalog={hasCatalog} canEdit={canEdit} onOpenMatrix={() => setTab('matrix')} onOpenSettings={() => setTab('settings')}/>}
                    {tab === 'matrix' && <SkillMatrixView employees={employees} data={data} dept={workDept} line={workLine} canEdit={canEdit} call={call} onReload={load} searchTerm={searchTerm}/>}
                    {tab === 'settings' && <SkillSettingsView employees={employees} data={data} dept={workDept} line={workLine} positions={positions} canEdit={canEdit} call={call} onReload={load}/>}
                    <SkillRadarHost employees={employees} data={data}/>
                </section>
            );
        };

        const AttendanceMonitor = ({ data, loading, error, onRefresh, lastUpdated }) => {
            const employees = Array.isArray(data?.employees) ? data.employees : [];
            const records = Array.isArray(data?.records) ? data.records : [];
            const previousShifts = Array.isArray(data?.previousShifts) ? data.previousShifts : [];
            const [openDept, setOpenDept] = useState('');
            const [showPendingOnly, setShowPendingOnly] = useState(false);
            const workedIds = new Set(records.filter(record => record.type === 'work').map(record => record.username));
            const otIds = new Set(records.filter(record => record.type === 'ot').map(record => record.username));
            const shiftOf = employee => { const shift = String(employee.shift || '').trim().toUpperCase(); return shift === 'A' || shift === 'B' ? shift : ''; };

            // Group by department + team, then work out which shift(s) are on duty for each team:
            // 1) shifts that already have someone checked in this round, else
            // 2) the shifts the team checked in on its last earlier work day, else
            // 3) every shift (nothing to go on yet).
            // Employees with no shift assigned are always counted as expected.
            const teamMap = new Map();
            employees.forEach(employee => {
                const dept = employee.dept || 'ไม่ระบุแผนก';
                const subKey = attendanceSubDeptKey(employee.subDept);
                const key = `${dept}\u0000${subKey}`;
                if (!teamMap.has(key)) teamMap.set(key, { dept, subKey, members: [], earlier: new Set() });
                teamMap.get(key).members.push(employee);
            });
            previousShifts.forEach(entry => {
                const team = teamMap.get(`${entry.dept || 'ไม่ระบุแผนก'}\u0000${attendanceSubDeptKey(entry.subDept)}`);
                if (team) (entry.shifts || []).forEach(shift => team.earlier.add(shift));
            });
            const deptMap = new Map();
            teamMap.forEach(team => {
                const todayShifts = new Set(team.members.filter(employee => workedIds.has(employee.id)).map(shiftOf).filter(Boolean));
                let basis = 'today';
                let active = todayShifts;
                if (active.size === 0) { active = team.earlier; basis = 'earlier'; }
                if (active.size === 0) { active = new Set(['A', 'B']); basis = 'unknown'; }
                const expected = team.members.filter(employee => !shiftOf(employee) || active.has(shiftOf(employee)));
                const entry = {
                    name: team.subKey === '__NO_SUB_DEPT__' ? 'ไม่ระบุแผนกย่อย' : team.subKey,
                    shifts: Array.from(active).sort(),
                    basis,
                    total: expected.length,
                    work: expected.filter(employee => workedIds.has(employee.id)).length,
                    ot: expected.filter(employee => otIds.has(employee.id)).length,
                    pending: expected.filter(employee => !workedIds.has(employee.id))
                };
                if (!deptMap.has(team.dept)) deptMap.set(team.dept, { name: team.dept, total: 0, work: 0, ot: 0, teams: [], pending: [] });
                const dept = deptMap.get(team.dept);
                dept.total += entry.total; dept.work += entry.work; dept.ot += entry.ot;
                dept.teams.push(entry);
                dept.pending.push(...entry.pending);
            });
            const departments = Array.from(deptMap.values()).sort((a, b) => a.name.localeCompare(b.name));
            departments.forEach(dept => dept.teams.sort((a, b) => a.name.localeCompare(b.name)));
            const overall = departments.reduce((sum, dept) => ({ total: sum.total + dept.total, work: sum.work + dept.work, ot: sum.ot + dept.ot }), { total: 0, work: 0, ot: 0 });
            const pct = (done, total) => total > 0 ? Math.round((done / total) * 100) : 0;
            const tone = percent => percent >= 90 ? 'bg-green-500' : percent >= 60 ? 'bg-amber-400' : 'bg-red-400';
            const shiftText = team => `${team.shifts.map(shift => `กะ ${shift}`).join(' + ')}${team.basis === 'today' ? '' : ' (คาดการณ์)'}`;
            const dateLabel = data?.date
                ? new Date(`${data.date}T00:00:00`).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
                : 'วันนี้';
            const timeLabel = lastUpdated ? new Date(lastUpdated).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '-';
            const cards = [
                { label: 'ต้องเข้างาน (กะที่ทำงานอยู่)', value: overall.total, cls: 'text-gray-900' },

                        <div className="mt-2 h-3 overflow-hidden rounded-full bg-gray-100"><div className={`h-full rounded-full transition-all ${tone(pct(overall.work, overall.total))}`} style={{ width: `${pct(overall.work, overall.total)}%` }}></div></div>
                        <p className="mt-2 text-xs text-gray-500">ระบบตรวจจับกะที่กำลังทำงานของแต่ละทีมเอง จากคนที่เช็คชื่อแล้ววันนี้ ถ้ายังไม่มีใครเช็คจะใช้กะของวันทำงานล่าสุดก่อนหน้า (คาดการณ์)</p>

                    {employees.length === 0 && !loading && <div className="rounded-2xl border bg-white p-5 text-sm text-gray-500">ไม่มีรายชื่อพนักงานที่เข้าถึงได้</div>}
